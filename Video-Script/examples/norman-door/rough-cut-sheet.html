<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>노먼 도어 90초: 제작에 쓴 대본과 제작 뒤 고친 대본</title>
<style>
:root{
  --paper:#f4f1ea; --panel:#fffdf8; --ink:#1d1b18; --muted:#6d675e; --line:#dcd6ca; --soft:#ebe6dc;
  --accent:#a8431f; --ok:#2c6a4d; --warn:#946200; --fail:#b3261e;
  --stage:#0f1113; --stage-ink:#f4f1ea; --stage-em:#ffd166;
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --hand:"Nanum Pen Script","Gaegu","Nanum Brush Script","Malgun Gothic",cursive;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.wrap{max-width:1360px;margin:0 auto;padding:0 28px 80px}
.top{position:sticky;top:0;z-index:20;background:rgba(244,241,234,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-in{max-width:1360px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:-.01em}
.brand small{font-weight:400;color:var(--muted);margin-left:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab .fam{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--soft);color:var(--muted)}
.tab[aria-selected="true"] .fam{background:#3a3733;color:#ddd}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.fail{background:var(--fail)}

.case-head{padding:26px 0 4px}
.eyebrow{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow b{color:var(--ink)}
h1{font-size:30px;line-height:1.25;margin:6px 0 4px;letter-spacing:-.02em}
.case-head .row{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;justify-content:space-between}
.pub-title{color:var(--muted);margin:0 0 14px}
.sumrow{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px}
.pill.fail{border-color:#e3b3ae;background:#fbeeed;color:var(--fail)}
.pill.warn{border-color:#e4d3a6;background:#fbf5e3;color:var(--warn)}
.pill.ok{border-color:#b9d6c7;background:#edf6f1;color:var(--ok)}

h2{font-size:20px;margin:36px 0 14px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px}
h2 .n{font-size:13px;color:var(--muted);font-weight:500}
h2 small{font-size:13px;font-weight:400;color:var(--muted)}

.decisions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.dcard.wide{grid-column:span 2}
.dcard.full{grid-column:1/-1}
.dcard h3{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.dcard p{margin:0;font-size:15px}
.dcard .big{font-size:18px;font-weight:600;line-height:1.45}
.dcard ul{margin:0;padding-left:18px}
.tagline{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;background:var(--soft);border-radius:4px;padding:2px 8px;color:#4a453e}

.bench{display:grid;grid-template-columns:minmax(0,46fr) minmax(0,54fr);gap:20px;align-items:start}
.player{position:sticky;top:66px}
.stage{position:relative;aspect-ratio:16/9;background:var(--stage);color:var(--stage-ink);border-radius:10px;overflow:hidden;container-type:inline-size;user-select:none}
.stage::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.022) 0 2px,transparent 2px 14px);pointer-events:none}
.stage.v-live{background:linear-gradient(135deg,#27363b,#12181b)}
.stage.v-archive{background:linear-gradient(135deg,#3d3325,#1a1611)}
.stage.v-reenact{background:linear-gradient(135deg,#2c303d,#13141a)}
.stage.v-illust{background:linear-gradient(135deg,#3b2b33,#191216)}
.stage.v-diagram{background-color:#101a2c;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:6.25% 11.11%}
.stage.v-typo{background:#090909}
.stage.v-stock{background:linear-gradient(135deg,#343434,#171717)}
.scene{position:absolute;left:3.2cqw;top:3cqw;max-width:52cqw;z-index:2}
.scene .vt{display:inline-block;font-size:1.5cqw;font-weight:700;letter-spacing:.04em;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:.6cqw;padding:.25cqw .9cqw;margin-bottom:.8cqw}
.scene .vd{font-size:1.75cqw;line-height:1.5;color:rgba(244,241,234,.78)}
.scene .vc{font-size:1.45cqw;line-height:1.45;color:rgba(244,241,234,.5);margin-top:.5cqw}
.tc{position:absolute;right:3cqw;top:3cqw;font-size:1.5cqw;color:rgba(244,241,234,.6);font-variant-numeric:tabular-nums;z-index:2;text-align:right}
.snd{position:absolute;left:3.2cqw;bottom:2.6cqw;font-size:1.4cqw;color:rgba(244,241,234,.5);max-width:60cqw;z-index:2}
.txt{position:absolute;z-index:3;left:8cqw;right:8cqw;top:50%;transform:translateY(-42%);text-align:center;font-size:4.2cqw;font-weight:600;line-height:1.5;letter-spacing:-.01em;text-shadow:0 .15cqw .8cqw rgba(0,0,0,.6)}
.txt.pos-low{top:auto;bottom:11cqw;transform:none}
.txt.pos-left{right:44cqw;text-align:left}
.txt.pos-right{left:44cqw;text-align:right}
.txt .ln{display:block;opacity:0;transform:translateY(.6cqw);transition:opacity .35s ease,transform .35s ease}
.txt .ln.on{opacity:1;transform:none}
.txt em{font-style:normal;color:var(--stage-em)}
.txt.k-title{font-size:6.4cqw;font-weight:800;letter-spacing:-.03em}
.txt.k-name{font-size:5.6cqw;font-weight:800;letter-spacing:-.02em}
.txt.k-quote{font-family:var(--serif);font-weight:500;font-size:3.7cqw}
.corner{position:absolute;right:3cqw;bottom:6cqw;max-width:46cqw;text-align:right;font-size:1.7cqw;line-height:1.45;color:rgba(244,241,234,.82);z-index:3;opacity:0;transition:opacity .4s ease}
.corner.on{opacity:1}
.txt.k-label{font-size:2.1cqw;font-weight:500;color:rgba(244,241,234,.85);top:auto;bottom:6cqw;left:auto;right:4cqw;transform:none;text-align:right}
.txt.v-mono{font-family:var(--hand);font-size:4.6cqw;font-weight:400;color:#ffe9c9}
.txt .att{display:block;margin-top:1.4cqw;font-family:var(--sans);font-size:1.8cqw;font-weight:400;color:rgba(244,241,234,.7)}
.silent{position:absolute;left:0;right:0;bottom:11cqw;text-align:center;font-size:1.5cqw;letter-spacing:.2em;color:rgba(244,241,234,.35);z-index:2}
.turnmark{position:absolute;right:3cqw;bottom:2.6cqw;font-size:1.4cqw;color:var(--stage-em);z-index:2;letter-spacing:.08em}

.ctrl{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:#bdb5a6}
.btn.play{background:var(--ink);color:#fff;border-color:var(--ink);min-width:74px}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);margin-left:auto}
select.btn{padding-right:8px}
.track{position:relative;margin-top:10px;cursor:pointer}
.beats{display:flex;height:26px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.beat{position:relative;background:var(--panel);border-right:1px solid var(--line);font-size:11px;line-height:24px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#4a453e;min-width:0}
.beat:nth-child(even){background:var(--soft)}
.beat:last-child{border-right:0}
.ticks{display:flex;height:9px;margin-top:3px;border-radius:3px;overflow:hidden}
.tick{min-width:0;border-right:1px solid var(--paper)}
.tick.k-edit{background:#8d867a} .tick.k-quote{background:var(--accent)} .tick.k-title{background:var(--ink)} .tick.k-name{background:#4b4740} .tick.k-label{background:#c9c2b4} .tick.k-silent{background:#e3ddd0}
.tick.turn{box-shadow:inset 0 -3px 0 var(--stage-em)}
.head{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--accent);pointer-events:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.hint{font-size:12px;color:var(--muted);margin-top:8px}

.sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 90px)}
table{border-collapse:collapse;width:100%;font-size:13.5px;table-layout:fixed}
col.w-time{width:62px} col.w-text{width:29%} col.w-kind{width:64px} col.w-vis{width:auto} col.w-note{width:17%} col.w-flag{width:11%}
td{overflow-wrap:anywhere}
thead th{position:sticky;top:0;background:#efeadf;text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);z-index:1}
td{padding:9px 10px;border-bottom:1px solid var(--soft);vertical-align:top}
tr.card{cursor:pointer}
tr.card:hover td{background:#faf6ee}
tr.card.cur td{background:#fbf0d9}
tr.beatrow td{background:#efeadf;font-size:12.5px;color:#4a453e;padding:6px 10px;border-bottom:1px solid var(--line)}
tr.beatrow b{color:var(--ink);margin-right:8px}
.c-time{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
.c-time b{display:block;color:var(--ink);font-weight:600}
.c-text{min-width:0}
.c-text .l{display:block;font-size:15px;font-weight:600;line-height:1.5}
.c-text em{font-style:normal;color:var(--accent);background:linear-gradient(transparent 62%,#f6dcc9 62%)}
.c-text.q .l{font-family:var(--serif);font-weight:500}
.c-text.lab .l{font-size:13px;font-weight:500;color:#4a453e}
.c-text.ttl .l{font-size:18px;font-weight:800}
.c-text .att{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.c-text .none{color:#a9a294;font-size:13px}
.kind{display:inline-block;font-size:11.5px;border-radius:4px;padding:1px 7px;border:1px solid var(--line);white-space:nowrap;color:#4a453e}
.kind.k-quote{border-color:#e2bfae;color:var(--accent)}
.kind.k-title{background:var(--ink);color:#fff;border-color:var(--ink)}
.kind.k-name{background:#4b4740;color:#fff;border-color:#4b4740}
.c-text.nm .l{font-size:17px;font-weight:800}
.c-text .lab{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.c-text .lab::before{content:"구석 표기  ";color:#a39b8c}
.c-text .orig{display:block;font-size:11.5px;color:#a39b8c;margin-top:3px;font-style:italic}
tr.beatrow .div{display:block;color:var(--muted);font-size:12px;margin-top:2px}
tr.beatrow .div i{font-style:normal;color:#a39b8c;margin-right:4px}
.kind.k-silent{color:#a9a294}
.meta-s{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.turn{display:inline-block;font-size:11px;color:#7a5a00;background:#fbefc8;border-radius:4px;padding:0 6px;margin-top:3px}
.vtype{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:#3d3933;margin-bottom:2px}
.vtype i{width:9px;height:9px;border-radius:2px;display:inline-block}
.sw-live{background:#3b545c}.sw-archive{background:#7a633f}.sw-reenact{background:#4a5170}.sw-illust{background:#7b4f63}.sw-diagram{background:#24406f}.sw-typo{background:#111}.sw-stock{background:#777}
.c-vis .carr{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.c-vis .carr::before{content:"장면이 맡는 것  ";color:#a39b8c}
.c-note{font-size:12.5px;color:#4a453e}
.c-note .s{display:block;color:var(--muted)}
.c-note .memo{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px;color:#6d675e}
.c-note .memo:hover{-webkit-line-clamp:unset}
.c-note .src{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;color:var(--muted)}
.flag{display:inline-block;font-size:11px;border-radius:4px;padding:0 6px;margin:0 3px 3px 0;white-space:nowrap}
.flag.warn{background:#fbf2d6;color:var(--warn)} .flag.fail{background:#fbe5e3;color:var(--fail)}
.c-flag{min-width:0}
.flag{white-space:normal}

.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.metric b{display:block;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.metric span{font-size:12px;color:var(--muted)}
.metric small{display:block;font-size:11.5px;color:#a39b8c;margin-top:2px}
.lintgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 0}
.box h3{font-size:13px;margin:8px 16px 6px;color:var(--muted);font-weight:600}
.rule{display:grid;grid-template-columns:52px 124px 1fr;gap:10px;padding:8px 16px;border-top:1px solid var(--soft);font-size:13.5px;align-items:baseline}
.rule:first-of-type{border-top:0}
.lv{font-size:12px;font-weight:700}
.lv.ok{color:var(--ok)} .lv.warn{color:var(--warn)} .lv.fail{color:var(--fail)}
.rule .nm{color:#3d3933;font-weight:600}
.rule .cards a{font-size:12px;margin-right:6px;text-decoration:none;border-bottom:1px dotted var(--accent);cursor:pointer}
details.passed summary{cursor:pointer;padding:8px 16px;font-size:13px;color:var(--muted);border-top:1px solid var(--soft)}
.manual{list-style:none;margin:0;padding:0 16px 10px}
.manual li{padding:6px 0;border-top:1px solid var(--soft);font-size:13.5px;display:flex;gap:8px}
.manual li:first-child{border-top:0}
.manual input{margin-top:4px;accent-color:var(--accent)}
.chain{padding:4px 16px 12px;font-size:14px;line-height:1.9}
.chain span{background:linear-gradient(transparent 62%,#f6dcc9 62%);margin-right:4px}
.chain i{color:#b8b0a1;font-style:normal;margin-right:4px}
.notes{padding:0 16px 10px;margin:0 0 0 18px;font-size:13.5px}
.sources{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 18px}
.source{padding:10px 0;border-top:1px solid var(--soft);font-size:13.5px;display:grid;grid-template-columns:40px 1fr;gap:10px}
.source:first-child{border-top:0}
.source .id{font-weight:700;color:var(--muted)}
.source .ck{color:var(--muted);display:block}
footer{margin-top:50px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:1080px){.bench{grid-template-columns:1fr}.player{position:static}.sheet{max-height:none}.decisions{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:repeat(3,1fr)}.lintgrid{grid-template-columns:1fr}}
@media (max-width:640px){.wrap{padding:0 14px 60px}.decisions{grid-template-columns:1fr}.dcard.wide{grid-column:auto}h1{font-size:26px}.metrics{grid-template-columns:repeat(2,1fr)}.rule{grid-template-columns:44px 1fr}.rule .nm{grid-column:2}.rule .ms{grid-column:1/-1}}
@media print{.top,.ctrl,.track,.hint,.legend{display:none}.player{position:static}.sheet{max-height:none;overflow:visible}.bench{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <div class="brand"><span id="sheetTitle"></span><small id="built"></small></div>
  <div class="tabs" id="tabs" role="tablist"></div>
</div></div>
<div class="wrap" id="app"></div>

<script>const DATA = {"title": "노먼 도어 90초: 제작에 쓴 대본과 제작 뒤 고친 대본", "built": "2026-11-12 17:20", "families": {"A1": "에세이형", "A2": "사건에서 개념으로", "A3": "다시 보기", "B": "사건 중계형", "C": "인물·사물 서사형", "D1": "발견 전달형", "D2": "개념 설명형", "L": "구획형"}, "cases": [{"file": "script-as-produced.json", "script": {"meta": {"title": "또 틀렸다, 그런데 누가? | 밀까 당길까 헷갈리는 문 '노먼 도어'", "lang": "ko", "family": "D2", "family_reason": "개념 하나(노먼 도어)를 일러스트와 도해로 90초 안에 가르친다. 실사 푸티지도 인물의 일대기도 없고, 2분 이하라 A1 탐구형은 맞지 않는다", "target_seconds": 90, "hook_mode": "그림", "logline": "문에 '미세요'를 붙여야 했다면 틀린 쪽은 당긴 사람이 아니라, 생김새로 여는 법을 알려 주지 못한 문이다", "audience_belief": "문을 반대로 연 것은 써 붙인 글자를 못 본 내 부주의 탓이다", "axis_fact": "문에 붙은 '미세요' 글자 한 장. 노먼은 문처럼 단순한 것에 표지를 덧붙여야 한다면 그것이 나쁜 디자인의 표시라고 썼다(S1 그림 1.2 설명). 통념의 '못 본 내 탓'을 '붙여야 했던 문 탓'으로 돌려 놓는다", "withhold": ["노먼 도어", "디자인", "기표", "행위 지원성"], "ending": {"type": "질문", "callback": "또 틀렸다", "callback_kind": "낱말"}, "materials": "일러스트, 도해, 타이포. 실사 촬영과 기록 영상은 없다", "sources": [{"id": "S1", "label": "Don Norman, The Design of Everyday Things, Revised and Expanded Edition, Basic Books, 2013, 1장", "url": "https://media.aanda.psu.edu/sites/media/aa/files/documents/norman_design-of-everyday-things.pdf", "checked": "PDF를 내려받아 1~17쪽을 읽고 확인: 문 고백 문장과 'Norman doors' 유래(1쪽), 문·전등 스위치·수도꼭지·레인지를 함께 든 첫 문단(1쪽), 표지 없이 여는 법을 알려야 한다는 문장(2쪽), 판과 기둥이 있으면 'no labels needed'(3쪽), 'engineer who became a cognitive psychologist'(12쪽), 'A flat plate mounted on a door affords pushing'(13쪽), 기표의 정의(14쪽), 그림 1.2 설명의 'it indicates bad design'(15쪽). 초판 연도(1988)는 브리프에만 있고 대본에 쓰지 않았다", "status": "직접 확인"}], "review_notes": ["자동 검수에서 남은 주의 없음", "수동 검수에서 그대로 둔 것: c04, c05, c13은 장면의 화살표와 문장의 뜻이 일부 겹친다. 문장은 판정과 인과만 말하고 방향과 까닭은 도해가 맡게 나눴다", "read-speed 주의(c10, c13)는 그대로 둔다. 용어를 구석 표기로 한 번씩 띄우는 카드다."], "assumptions": ["무엇을 하는 영상인가: 발견이나 개념을 설명한다. 통념: 반대로 연 것은 내 부주의 탓", "빌려 쓸 말: 노먼의 책 1장에서 인용 두 개(고백 한 줄, 그림 1.2 설명 한 줄)", "D2는 그림과 질문형 훅이라 감춤형이 아니지만, 이름 카드(c09) 전까지 편집 문장에 '노먼 도어', '디자인', 용어를 쓰지 않기로 하고 withhold에 적어 두었다. 인용 카드 c07의 출처 표기에는 지은이 이름이 먼저 뜬다. 화자를 본 뒤 이름 카드에서 같은 이름을 다시 만나게 하려는 것이다", "용어: affordance는 '행위 지원성', signifier는 '기표'로 통일하고, 본문 문장이 아니라 구석 표기(label)에 원어와 함께 한 번씩만 둔다", "제목 카드는 두지 않는다. D2 비트 시트에 제목 비트가 없고 90초라 이름 카드가 제목 구실을 한다", "끝의 참고 자료 표기 카드는 두지 않고, 출처는 인용 카드의 attribution으로 화면에 밝힌다", "D2의 '유형' 비트(같은 틀 2~3개)는 90초 분량 때문에 '글자가 필요 없는 문' 한 장의 대조로 줄였다", "마지막 한 줄은 질문으로 정했다. '틀린 쪽은 문'이라는 판정은 편집 문장이 아니라 c11의 인용이 맡는다"]}, "beats": [{"id": "b1", "name": "그림", "job": "문장 없이, 손잡이를 당겼는데 열리지 않는 문 하나를 먼저 보여 준다", "scene": "어떤 문인지(세로 손잡이가 달린 유리문), 무슨 일이 일어났는지(당겼고 열리지 않았다), 구석의 작은 스티커", "text": "없음"}, {"id": "b2", "name": "질문", "job": "누구나 해 본 속말로 '왜 이 문에서만 틀리는가'를 묻는다", "scene": "문 앞에서 멈칫한 손. 다른 문들은 문제없이 지나온 길", "text": "속말과 질문. 처음이 아니라는 것('또')"}, {"id": "b3", "name": "통념", "job": "글자를 못 본 내 탓이라는 통념을 따옴표 한 장으로 세운다", "scene": "뒤늦게 눈에 들어오는 작은 스티커, 머쓱해하는 사람", "text": "탓을 자기에게 돌리는 속마음"}, {"id": "b4", "name": "꺾임과 풀어 쓴 답", "job": "접속어로 꺾고, 이름 없이 정의를 일상어 한 문장으로 준다", "scene": "손잡이의 생김새가 부르는 손동작, 문이 실제로 열리는 방향(위에서 본 도해)", "text": "논리의 방향(그런데), 손잡이와 글자가 서로 다른 지시를 한다는 판정"}, {"id": "b5", "name": "이름", "job": "이런 문에 번번이 당한 사람의 말을 먼저 읽히고, 그 사람의 이름이 문의 이름이 됐음을 이름 카드로 알린다", "scene": "밀 문, 당길 문, 미닫이문 앞에 차례로 선 한 사람. 이름은 빈 화면에 혼자", "text": "화자의 자격, 인용, 이름"}, {"id": "b6", "name": "알아보는 법", "job": "노먼 도어를 가려내는 단서가 문에 붙은 글자임을 말하고, 판정은 인용에 맡긴다", "scene": "글자가 붙은 문들의 배열. 어떤 글자들이 붙는지", "text": "단서가 무엇인지, 그것이 무엇의 표시인지(인용)"}, {"id": "b7", "name": "유형(대조 한 쌍)", "job": "글자가 필요 없는 문을 그림으로 먼저 보여 주고 까닭을 한 문장으로 붙인다", "scene": "평평한 판만 달린 문을 멈칫 없이 밀고 지나가는 사람. 쥘 곳이 없고 스티커도 없다", "text": "판과 미는 행동의 인과, 용어(구석 표기)"}, {"id": "b8", "name": "범위 넓히기", "job": "같은 어려움이 문 밖의 가까운 사물에도 있음을 가장 가까운 예로 넓힌다", "scene": "스위치, 수도꼭지, 레인지에서 무엇이 헷갈리는지(어느 스위치가 어느 등인지, 어느 손잡이가 어느 화구인지)", "text": "누가 꼽았는지와 사물의 이름"}, {"id": "b9", "name": "뜸과 마지막 한 줄", "job": "첫 장면으로 돌아가 훅의 속말을 그대로 되받고, 질문의 주어만 바꾼다", "scene": "처음의 문과 같은 손. 이번에는 화면이 사람 대신 손잡이와 스티커로 다가간다", "text": "훅의 낱말 되받기와 질문"}], "cards": [{"id": "c01", "beat": "b1", "t": 0, "d": 5, "kind": "무문장", "lines": [], "visual": {"type": "일러스트", "desc": "세로 막대 손잡이가 달린 유리문. 걸어온 사람의 손이 손잡이를 쥐고 당기지만 문은 덜컹하고 버틴다. 손잡이 옆의 작은 스티커는 손 그림자에 가려 읽히지 않는다", "carries": "어떤 문인지, 당겼는데 열리지 않았다는 것", "motion": "옆모습 전신에서 손과 손잡이로 줌인", "callback": true}, "sound": "발소리, 문이 덜컹 걸리는 소리. 음악 없음"}, {"id": "c02", "beat": "b2", "t": 5, "d": 5, "kind": "편집", "lines": ["또 틀렸다", "왜 이 문 앞에서만 이럴까"], "em": "또 틀렸다", "voice": "독백", "visual": {"type": "일러스트", "desc": "(앞 장면 계속) 손잡이를 쥔 채 멈춘 손. 뒤로 방금 지나온 문 두 개가 열린 채 보인다", "carries": "다른 문은 문제없이 지나왔다는 것"}}, {"id": "c03", "beat": "b3", "t": 10, "d": 6, "kind": "편집", "lines": ["'글자를 못 본 내 탓이지'", "대개는 그렇게 넘어간다"], "em": "내 탓", "visual": {"type": "일러스트", "desc": "손이 비키자 손잡이 옆의 작은 스티커가 드러난다. 사람이 머쓱하게 뒷머리를 긁는다. 스티커는 아직 작아서 글자가 또렷하지 않다", "carries": "글자가 어디에 얼마나 작게 붙어 있었는지"}}, {"id": "c04", "beat": "b4", "t": 16, "d": 5, "kind": "편집", "turn": true, "lines": ["그런데", "손잡이는 당기라 하고"], "visual": {"type": "도해", "desc": "배경이 단색으로 바뀌고 손잡이만 선화로 남는다. 손가락이 막대를 감아쥐는 윤곽선과, 몸 쪽을 향한 화살표 하나", "carries": "감아쥐게 생긴 모양이 어떤 손동작을 부르는지", "motion": "일러스트에서 선화 도해로 전환"}, "sound": "낮은 연주곡이 시작된다"}, {"id": "c05", "beat": "b4", "t": 21, "d": 6, "kind": "편집", "lines": ["글자는 밀라고 하는", "생김새와 여는 법이 어긋난 문"], "em": "어긋난 문", "visual": {"type": "도해", "desc": "문을 위에서 내려다본 평면도. 경첩을 축으로 문이 바깥으로 열리는 호가 그려지고, 앞 카드의 몸 쪽 화살표와 정반대 방향의 화살표가 나란히 선다", "carries": "문이 실제로 열리는 방향과 손잡이가 부른 방향이 정반대라는 것", "motion": "화살표 둘이 차례로 그려진다"}}, {"id": "c06", "beat": "b5", "t": 27, "d": 6, "kind": "편집", "lines": ["이런 문에 번번이 당한", "한 인지심리학자의 고백"], "src": "S1", "visual": {"type": "일러스트", "desc": "문 세 개가 가로로 늘어서 있다. 같은 사람의 뒷모습이 첫 문은 밀다가, 둘째 문은 당기다가, 셋째 미닫이문에는 그대로 걸어가 부딪힌다", "carries": "틀리는 방식이 세 가지라는 것(밀 문, 당길 문, 미닫이문). 인용에서 덜어 낸 뒷부분을 그림이 맡는다", "motion": "왼쪽에서 오른쪽으로 한 문씩"}, "note": "'인지심리학자'는 S1 12쪽의 자기소개(an engineer who became a cognitive psychologist), '번번이'는 1쪽의 'My problems with doors have become so well known'에 기댄다"}, {"id": "c07", "beat": "b5", "t": 33, "d": 7, "kind": "인용", "voice": "인용", "lines": ["“나는 당겨야 할 문을 밀고,", "밀어야 할 문을 당긴다…”"], "src": "S1", "attribution": "도널드 노먼, 《The Design of Everyday Things》 개정판(2013) 1장", "quote_form": "번역, 줄임", "original": "I push doors that are meant to be pulled, pull doors that should be pushed, and walk into doors that neither pull nor push, but slide.", "visual": {"type": "타이포", "desc": "앞 장면의 문 세 개가 윤곽선만 남고 어두워진 바탕 위에 명조 서체의 인용문. 아래에 출처 표기", "motion": "한 줄씩 쌓인다"}, "note": "원문의 셋째 구절(미닫이문에 걸어가 부딪힌다)은 화면 문장에서 덜고 말줄임표를 두었다. 덜어 낸 내용은 c06의 그림에 있다"}, {"id": "c08", "beat": "b5", "t": 40, "d": 4, "kind": "편집", "lines": ["그 뒤 헷갈리는 문에", "붙은 이름은"], "src": "S1", "visual": {"type": "일러스트", "desc": "윤곽선이던 문 하나가 앞으로 나오고, 문 위 빈 이름표 자리가 깜박인다", "carries": "이름이 사람이 아니라 문에 붙는다는 것"}, "note": "S1 1쪽: confusing doors are often called \"Norman doors.\""}, {"id": "c09", "beat": "b5", "t": 44, "d": 4, "kind": "이름", "lines": ["노먼 도어"], "em": "노먼 도어", "label": "Norman door", "src": "S1", "visual": {"type": "타이포", "desc": "빈 화면 한가운데 이름만 크게. 앞 인용의 출처에 있던 '노먼' 두 글자와 같은 서체", "motion": "글자가 문이 열리듯 좌우로 벌어지며 나타난다"}, "sound": "음악이 한 음에서 멈췄다가 다시 흐른다"}, {"id": "c10", "beat": "b6", "t": 48, "d": 5, "kind": "편집", "lines": ["노먼 도어의 단서는", "문에 붙은 글자"], "em": "문에 붙은 글자", "label": "기표(signifier)", "src": "S1", "visual": {"type": "도해", "desc": "문 아홉 개가 3x3으로 늘어선다. 스티커가 붙은 문만 색이 켜진다. 화면 속 글자: 미세요, 당기시오, PUSH, PULL", "carries": "어떤 글자들이 붙는지, 글자가 붙은 문과 없는 문이 섞여 있다는 것", "motion": "스티커가 하나씩 켜진다"}, "note": "배열 속 문의 개수와 켜지는 개수는 통계가 아니다. 비율로 읽히지 않게 그린다"}, {"id": "c11", "beat": "b6", "t": 53, "d": 10, "kind": "인용", "voice": "인용", "lines": ["“문처럼 단순한 것에", "표지를 덧붙여야 한다면,", "그것은 나쁜 디자인이라는 뜻이다.”"], "em": "나쁜 디자인", "src": "S1", "attribution": "도널드 노먼, 같은 책 그림 1.2 설명", "quote_form": "번역, 줄임", "original": "When external signifiers—signs—have to be added to something as simple as a door, it indicates bad design.", "visual": {"type": "타이포", "desc": "켜져 있던 스티커 하나만 남고 나머지 문은 어두워진다. 그 위에 명조 서체의 인용문", "motion": "한 줄씩 쌓이고, 셋째 줄에서 남은 스티커의 색이 바뀐다"}, "note": "원문의 'external signifiers—signs—'를 동격인 '표지' 하나로 줄여 옮겼다. 뜻은 바뀌지 않는다"}, {"id": " _kind": "낱말"}, "materials": "일러스트, 도해, 타이포. 실사 촬영과 기록 영상은 없다", "sources": [{"id": "S1", "label": "Don Norman, The Design of Everyday Things, Revised and Expanded Edition, Basic Books, 2013, 1장", "url": "https://media.aanda.psu.edu/sites/media/aa/files/documents/norman_design-of-everyday-things.pdf", "checked": "PDF를 내려받아 1~17쪽을 읽고 확인: 문 고백 문장과 'Norman doors' 유래(1쪽), 문·전등 스위치·수도꼭지·레인지를 함께 든 첫 문단(1쪽), 표지 없이 여는 법을 알려야 한다는 문장(2쪽), 판과 기둥이 있으면 'no labels needed'(3쪽), 'engineer who became a cognitive psychologist'(12쪽), 'A flat plate mounted on a door affords pushing'(13쪽), 기표의 정의(14쪽), 그림 1.2 설명의 'it indicates bad design'(15쪽). 초판 연도(1988)는 브리프에만 있고 대본에 쓰지 않았다", "status": "직접 확인"}], "review_notes": ["read-speed 주의(c10, c13)는 그대로 둔다. 용어를 구석 표기로 한 번씩 띄우는 카드다.", "event-load 주의(c06, c14): c06은 6초에 실수 세 번, c14는 7초에 사물 셋이 들어간다. 제작본에서 모두 그려졌고 셋이라는 수가 문장을 받치므로 그대로 둔다. 다만 문장 두 줄과 겹쳐 이 대본에서 가장 바쁜 두 장이다. 길이에 여유가 있으면 1초씩 늘린다.", "c03과 c15는 legible: false다. 화면이 스티커 글자가 읽힐 만큼 다가가지 않게 하고, 글자는 c16에서 처음 읽힌다. 다만 c05의 평면도 표시에 같은 글자가 먼저 나온다. 문장이 이미 글자는 밀라고 한다고 말한 뒤라 숨길 정보가 아니다."], "assumptions": ["무엇을 하는 영상인가: 발견이나 개념을 설명한다. 통념: 반대로 연 것은 내 부주의 탓", "빌려 쓸 말: 노먼의 책 1장에서 인용 두 개(고백 한 줄, 그림 1.2 설명 한 줄)", "D2는 그림과 질문형 훅이라 감춤형이 아니지만, 이름 카드(c09) 전까지 편집 문장에 '노먼 도어', '디자인', 용어를 쓰지 않기로 하고 withhold에 적어 두었다. 인용 카드 c07의 출처 표기에는 지은이 이름이 먼저 뜬다. 화자를 본 뒤 이름 카드에서 같은 이름을 다시 만나게 하려는 것이다", "용어: affordance는 '행위 지원성', signifier는 '기표'로 통일하고, 본문 문장이 아니라 구석 표기(label)에 원어와 함께 한 번씩만 둔다", "제목 카드는 두지 않는다. D2 비트 시트에 제목 비트가 없고 90초라 이름 카드가 제목 구실을 한다", "끝의 참고 자료 표기 카드는 두지 않고, 출처는 인용 카드의 attribution으로 화면에 밝힌다", "D2의 '유형' 비트(같은 틀 2~3개)는 90초 분량 때문에 '글자가 필요 없는 문' 한 장의 대조로 줄였다", "마지막 한 줄은 질문으로 정했다. '틀린 쪽은 문'이라는 판정은 편집 문장이 아니라 c11의 인용이 맡는다", "3차는 제작 시험(examples/norman-door/production-notes.md)에서 나온 것을 대본에 되돌려 적은 판이다. 문장은 한 글자도 바꾸지 않았고 장면 제안, 화면 범위, 사건 수, 화면 속 글자, 노출 시간 두 곳(c07, c08)만 고쳤다. 전체 길이는 92초가 됐다"], "cast": [{"id": "문", "look": "세로 막대 손잡이가 달린 유리문. 문은 정면으로 보이고 손잡이는 왼쪽, 경첩은 오른쪽", "fixed": "손잡이 바로 왼쪽에 작은 빨간 스티커. 손잡이를 쥐면 아래팔에 가려지는  붙인다", "scene": "평평한 판만 달린 문을 멈칫 없이 밀고 지나가는 사람. 쥘 곳이 없고 스티커도 없다", "text": "판과 미는 행동의 인과, 용어(구석 표기)"}, {"id": "b8", "name": "범위 넓히기", "job": "같은 어려움이 문 밖의 가까운 사물에도 있음을 가장 가까운 예로 넓힌다", "scene": "스위치, 수도꼭지, 레인지에서 무엇이 헷갈리는지(어느 스위치가 어느 등인지, 어느 손잡이가 어느 화구인지)", "text": "누가 꼽았는지와 사물의 이름"}, {"id": "b9", "name": "뜸과 마지막 한 줄", "job": "첫 장면으로 돌아가 훅의 속말을 그대로 되받고, 질문의 주어만 바꾼다", "scene": "처음의 문과 같은 손. 이번에는 화면이 사람 대신 손잡이와 스티커로 다가간다", "text": "훅의 낱말 되받기와 질문"}], "cards": [{"id": "c01", "beat": "b1", "d": 5, "kind": "무문장", "lines": [], "visual": {"type": "일러스트", "desc": "세로 막대 손잡이가 달린 유리문. 걸어온 사람의 손이 손잡이를 쥐고 당기지만 문은 덜컹하고 버틴다. 손잡이 옆의 작은 스티커는 손 그림자에 가려 읽히지 않는다", "carries": "어떤 문인지, 당겼는데 열리지 않았다는 것", "motion": "화면: 전경에서 손과 손잡이로 다가간다 / 대상: 걸어와 손잡이를 쥐고 두 번 당긴다", "callback": true, "frame": "근접", "events": 2, "text_in_picture": ["미세요"], "legible": false}, "sound": "발소리, 문이 덜컹 걸리는 소리. 음악 없음", "t": 0.0}, {"id": "c02", "beat": "b2", "d": 5, "kind": "편집", "lines": ["또 틀렸다", "왜 이 문 앞에서만 이럴까"], "em": "또 틀렸다", "voice": "독백", "visual": {"type": "일러스트", "desc": "(앞 장면 계속) 손잡이를 쥔 채 멈춘 손. 뒤로 방금 지나온 문 두 개가 열린 채 보인다", "carries": "다른 문은 문제없이 지나왔다는 것", "frame": "전경", "motion": "화면: 물러나 지나온 문 둘이 화면에 들어온다 / 대상: 손은 손잡이를 쥔 채 멈춰 있다"}, "t": 5.0}, {"id": "c03", "beat": "b3", "d": 6, "kind": "편집", "lines": ["'글자를 못 본 내 탓이지'", "대개는 그렇게 넘어간다"], "em": "내 탓", "visual": {"type": "일러스트", "desc": "손이 비키자 손잡이 옆의 작은 스티커가 드러난다. 사람이 머쓱하게 뒷머리를 긁는다. 스티커는 아직 작아서 글자가 또렷하지 않다", "carries": "글자가 어디에 얼마나 작게 붙어 있었는지", "frame": "중간", "events": 2, "text_in_picture": ["미세요"], "legible": false, "motion": "화면: 사람과 문이 함께 보이는 중간 범위. 스티커 글자가 읽힐 만큼 다가가지 않는다 / 넘김: 바닥의 어두운 띠가 차올라 화면을 덮는다"}, "t": 10.0}, {"id": "c04", "beat": "b4", "d": 5, "kind": "편집", "turn": true, "lines": ["그런데", "손잡이는 당기라 하고"], "visual": {"type": "도해", "desc": "배경이 단색으로 바뀌고 손잡이만 선화로 남는다. 손가락이 막대를 감아쥐는 윤곽선과, 몸 쪽을 향한 화살표 하나", "carries": "감아쥐게 생긴 모양이 어떤 손동작을 부르는지", "motion": "넘김: 앞 장면의 손잡이 자리에서 선화 손잡이가 커진다 / 대상: 손가락 윤곽이 감아쥐고 화살표가 그려진다", "events": 2}, "sound": "낮은 연주곡이 시작된다", "t": 16.0}, {"id": "c05", "beat": "b4", "d": 6, "kind": "편집", "lines": ["글자는 밀라고 하는", "생김새와 여는 법이 어긋난 문"], "em": "어긋난 문", "visual": {"type": "도해", "desc": "문을 위에서 내려다본 평면도. 왼쪽이 사람 쪽, 오른쪽이 문 너머다. 경첩을 축으로 문이 문 너머로 열리는 호가 그려지고, 앞 카드의 몸 쪽 화살표와 정반대 방향의 화살표가 한 줄에 마주 선다. 빨간 화살표 옆에 스티커 표시가 붙는다. 화면 속 글자: 미세요", "carries": "문이 실제로 열리는 방향과 손잡이가 부른 방향이 정반대라는 것", "motion": "화살표 둘이 차례로 그려진다", "events": 2, "text_in_picture": ["미세요"]}, "t": 21.0}, {"id": "c06", "beat": "b5", "d": 6, "kind": "편집", "lines": ["이런 문에 번번이 당한", "한 인지심리학자의 고백"], "src": "S1", "visual": {"type": "일러스트", "desc": "문 세 개가 가로로 늘어서 있다. 같은 사람의 옆모습이 첫 문은 두 손으로 밀다가, 둘째 문은 손잡이를 쥐고 당기다가 막히고, 셋째 문에는 그대로 걸어가 부딪힌다. 부딪힌 뒤에야 셋째 문이 옆으로 미끄러진다", "carries": "틀리는 방식이 세 가지라는 것(밀 문, 당길 문, 미닫이문). 인용에서 덜어 낸 뒷부분을 그림이 맡는다", "motion": "대상: 왼쪽에서 오른쪽으로 한 문씩 / 넘김: 화면이 어두워지고 문 셋이 윤곽선으로 남는다", "events": 3}, "note": "'인지심리학자'는 S1 12쪽의 자기소개(an engineer who became a cognitive psychologist), '번번이'는 1쪽의 'My problems with doors have become so well known'에 기댄다. 대본 2차는 뒷모습을 제안했으나 뒤에서는 밀기와 당기기가 구별되지 않아 옆모습으로 바꿨다(제작 시험)", "t": 27.0}, {"id": "c07", "beat": "b5", "d": 8, "kind": "인용", "voice": "인용", "lines": ["“나는 당겨야 할 문을 밀고,", "밀어야 할 문을 당긴다…”"], "src": "S1", "attribution": "도널드 노먼, 《The Design of Everyday Things》 개정판(2013) 1장", "quote_form": "번역, 줄임", "original": "I push doors that are meant to be pulled, pull doors that should be pushed, and walk into doors that neither pull nor push, but slide.", "visual": {"type": "타이포", "desc": "앞 장면의 문 세 개가 윤곽선만 남고 어두워진 바탕 위에 명조 서체의 인용문. 아래에 출처 표기", "motion": "한 줄씩 쌓인다"}, "note": "원문의 셋째 구절(미닫이문에 걸어가 부딪힌다)은 화면 문장에서 덜고 말줄임표를 두었다. 덜어 낸 내용은 c06의 그림에 있다", "t": 33.0}, {"id": "c08", "beat": "b5", "d": 5, "kind": "편집", "lines": ["그 뒤 헷갈리는 문에", "붙은 이름은"], "src": "S1", "visual": {"type": "일러스트", "desc": "윤곽선이던 문 하나가 밝아지며 옆으로 나와 서고, 문 위 빈 이름표 자리가 깜박인다", "carries": "이름이 사람이 아니라 문에 붙는다는 것"}, "note": "S1 1쪽: confusing doors are often called \"Norman doors.\"", "t": 41.0}, {"id": "c09", "beat": "b5", "d": 4, "kind": "이름", "line   function lintView(c){
    var m=c.lint.metrics, u=m.unit, res=c.lint.results, meta=c.script.meta||{};
    var h='<div class="metrics">';
    function met(v,label,sub){ return '<div class="metric"><b>'+v+'</b><span>'+label+'</span>'+(sub?'<small>'+sub+'</small>':'')+'</div>'; }
    h+=met(fmt(m.total_seconds),'전체 길이','목표 '+fmt(m.target_seconds||0));
    h+=met(m.cards_edit+'장','편집 문장 카드','인용 '+m.cards_quote+'장');
    h+=met(m.edit_size+u,'편집 문장 총량','초당 '+m.density+u);
    h+=met(m.avg_card_size+u,'카드 한 장 평균','평균 '+m.avg_card_seconds+'초 노출');
    h+=met((m.handoff_ratio!=null?m.handoff_ratio:m.open_ratio)+'%','다음 카드로 넘기는 카드','명사로 멈춤 '+(m.noun_ratio!=null?m.noun_ratio:'?')+'%, 끝맺음 '+(m.closed_ratio!=null?m.closed_ratio:'?')+'%');

    function rule(r){ return '<div class="rule"><span class="lv '+LV[r.level]+'">'+r.level+'</span><span class="nm">'+esc(r.title)+'</span><span class="ms">'+esc(r.msg)+(r.cards&&r.cards.length?' <span class="cards">'+r.cards.map(function(id){return '<a data-card="'+esc(id)+'">'+esc(id)+'</a>';}).join('')+'</span>':'')+'</span></div>'; }
    h+='<div class="box"><h3>자동 검수: 고치거나 판단할 것 '+bad.length+'건</h3>'+(bad.length?bad.map(rule).join(''):'<div class="rule"><span class="lv ok">통과</span><span class="nm">모두 통과</span><span class="ms">실패와 주의가 없다</span></div>');

    h+='</div><div>';
    h+='<div class="box"><h3>강조한 말만 차례로 읽기</h3><div class="chain">'+(m.emphasis_chain&&m.emphasis_chain.length?m.emphasis_chain.map(function(e){return '<span>'+esc(e)+'</span>';}).join('<i>/</i>'):'강조한 구절이 없다')+'</div></div>';
    h+='<div class="box" style="margin-top:14px"><h3>사람이 확인할 것 (자동 검수가 못 보는 것)</h3><ul class="manual">'+MANUAL.map(function(t){return '<li><input type="checkbox"><span>'+esc(t)+'</span></li>';}).join('')+'</ul></div>';
    return h+'</div></div>';
  }

  function sources(c){

  function render(){

  function findIdx(c,t){ var cs=cardsOf(c); for(var i=0;i<cs.length;i++){ var a=+cs[i].t||0, b=a+(+cs[i].d||0); if(t>=a&&t<b) return i; } return cs.length-1; }

  function draw(c){
    var cs=cardsOf(c); if(!cs.length) return;
    var T=total(c), t=Math.min(P.t,T), i=findIdx(c,t), k=cs[i], v=k.visual||{};
    var stage=document.getElementById('stage'), txt=document.getElementById('txt');
    if(i!==P.idx){
      P.idx=i; P.lines=-1;
      stage.className='stage v-'+(VT[v.type]||'stock');
      document.getElementById('scene').innerHTML='<span class="vt">'+esc(v.type||'')+'</span><div class="vd">'+esc(v.desc||'')+'</div>'+(v.motion?'<div class="vc">움직임: '+esc(v.motion)+'</div>':'');
      document.getElementById('snd').textContent=k.sound?('소리: '+k.sound):'';
      document.getElementById('turnmark').textContent=k.turn?'꺾임':'';
      document.getElementById('silent').textContent=(k.kind==='무문장')?'문장 없이 장면만':'';
      var cn=document.getElementById('corner'); cn.textContent=k.label||''; cn.classList.remove('on'); if(k.label){ setTimeout(function(){ cn.classList.add('on'); },60); }
      var cls='txt k-'+(KT[k.kind]||'edit')+' '+(POS[k.pos]||'');
      if(k.voice==='독백') cls+=' v-mono';
      txt.className=cls;
      var inner=(k.lines||[]).map(function(l){return '<span class="ln">'+lineHtml(l,k.em)+'</span>';}).join('');
      if(k.attribution&&k.kind==='인용') inner+='<span class="ln att">'+esc(k.attribution)+'</span>';
      txt.innerHTML=inner;
      Array.prototype.forEach.call(document.querySelectorAll('tr.card.cur'),function(r){r.classList.remove('cur');});
      var row=document.getElementById('row-'+k.id);
      if(row){ row.classList.add('cur'); var box=document.getElementById('sheet'); if(box&&box.scrollHeight>box.clientHeight){ var top=row.offsetTop-box.clientHeight*0.35; box.scrollTo({top:Math.max(0,top),behavior:P.playing?'smooth':'auto'}); } }
    }
    var lns=txt.querySelectorAll('.ln'), n=lns.length, el=t-(+k.t||0), d=+k.d||0.001;
    var step=n>1?Math.min(1.4,d/(n+1.2)):0, on=0;
    for(var j=0;j<n;j++){ if(el>=j*step-0.001) on=j+1; }
    if(on!==P.lines){ P.lines=on; for(var q=0;q<n;q++){ lns[q].classList.toggle('on',q<on); } }
    document.getElementById('tc').innerHTML=esc(k.id)+'<br>'+fmt(t);
    document.getElementById('time').textContent=fmt(t)+' / '+fmt(T);
    var tr=document.getElementById('track'); document.getElementById('head').style.left=(T?(t/T)*tr.clientWidth:0)+'px';
  }

  function tick(now){
    var c=DATA.cases[cur], T=total(c);
    if(!P.playing) return;
    var dt=(now-P.last)/1000; P.last=now; P.t+=dt*P.speed;
    if(P.t>=T){ P.t=T-0.001; draw(c); stop(); return; }
    draw(c); P.raf=requestAnimationFrame(tick);
  }
  function play(){ var c=DATA.cases[cur]; if(P.t>=total(c)-0.05) P.t=0; P.playing=true; P.last=performance.now(); document.getElementById('bPlay').textContent='멈춤'; P.raf=requestAnimationFrame(tick); }
  function stop(){ P.playing=false; cancelAnimationFrame(P.raf); var b=document.getElementById('bPlay'); if(b) b.textContent='재생'; }
  function seek(t){ var c=DATA.cases[cur]; P.t=Math.max(0,Math.min(t,total(c)-0.001)); draw(c); }
  function stepCard(dir){ var c=DATA.cases[cur], cs=cardsOf(c), i=findIdx(c,P.t)+dir; i=Math.max(0,Math.min(cs.length-1,i)); stop(); seek((+cs[i].t||0)+(+cs[i].d||0)-0.01); }

  function bind(c){
    document.getElementById('bPlay').onclick=function(){ P.playing?stop():play(); };
    document.getElementById('bFirst').onclick=function(){ stop(); seek(0); };
    document.getElementById('bPrev').onclick=function(){ stepCard(-1); };
    document.getElementById('bNext').onclick=function(){ stepCard(1); };
    var sp=document.getElementById('speed'); sp.value=String(P.speed); sp.onchange=function(){ P.speed=+sp.value; };
    var tr=document.getElementById('track');
    tr.onclick=function(e){ var r=tr.getBoundingClientRect(); seek(((e.clientX-r.left)/r.width)*total(c)); };
    Array.prototype.forEach.call(document.querySelectorAll('tr.card'),function(row){ row.onclick=function(){ var k=cardsOf(c)[+row.dataset.i]; stop(); seek((+k.t||0)+(+k.d||0)-0.01); }; });
    Array.prototype.forEach.call(document.querySelectorAll('a[data-card]'),function(a){ a.onclick=function(){ var id=a.dataset.card, cs=cardsOf(c); for(var i=0;i<cs.length;i++){ if(cs[i].id===id){ stop(); seek((+cs[i].t||0)+(+cs[i].d||0)-0.01); var row=document.getElementById('row-'+id); if(row){ document.getElementById('stage').scrollIntoView({block:'center'}); } break; } } }; });
  }
  document.addEventListener('keydown',function(e){
    var tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='select'||tag==='textarea') return;
    if(e.code==='Space'){ e.preventDefault(); P.playing?stop():play(); }
    else if(e.code==='ArrowRight'){ e.preventDefault(); stepCard(1); }
    else if(e.code==='ArrowLeft'){ e.preventDefault(); stepCard(-1); }
  });
  window.addEventListener('resize',function(){ draw(DATA.cases[cur]); });
  window.__sheet={ seek:seek, play:play, stop:stop, state:P };
  render();
})();
</script>
</body>
</html>
