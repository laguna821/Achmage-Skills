<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English scripts: Espresso (C), Desire Paths (D1), Cheonggyecheon (B)</title>
<style>
:root{
  --paper:#f4f1ea; --panel:#fffdf8; --ink:#1d1b18; --muted:#6d675e; --line:#dcd6ca; --soft:#ebe6dc;
  --accent:#a8431f; --ok:#2c6a4d; --warn:#946200; --fail:#b3261e;
  --stage:#0f1113; --stage-ink:#f4f1ea; --stage-em:#ffd166;
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --hand:"Nanum Pen Script","Gaegu","Nanum Brush Script","Malgun Gothic",cursive;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.wrap{max-width:1360px;margin:0 auto;padding:0 28px 80px}
.top{position:sticky;top:0;z-index:20;background:rgba(244,241,234,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-in{max-width:1360px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:-.01em}
.brand small{font-weight:400;color:var(--muted);margin-left:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab .fam{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--soft);color:var(--muted)}
.tab[aria-selected="true"] .fam{background:#3a3733;color:#ddd}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.fail{background:var(--fail)}

.case-head{padding:26px 0 4px}
.eyebrow{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow b{color:var(--ink)}
h1{font-size:30px;line-height:1.25;margin:6px 0 4px;letter-spacing:-.02em}
.case-head .row{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;justify-content:space-between}
.pub-title{color:var(--muted);margin:0 0 14px}
.sumrow{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px}
.pill.fail{border-color:#e3b3ae;background:#fbeeed;color:var(--fail)}
.pill.warn{border-color:#e4d3a6;background:#fbf5e3;color:var(--warn)}
.pill.ok{border-color:#b9d6c7;background:#edf6f1;color:var(--ok)}

h2{font-size:20px;margin:36px 0 14px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px}
h2 .n{font-size:13px;color:var(--muted);font-weight:500}
h2 small{font-size:13px;font-weight:400;color:var(--muted)}

.decisions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.dcard.wide{grid-column:span 2}
.dcard.full{grid-column:1/-1}
.dcard h3{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.dcard p{margin:0;font-size:15px}
.dcard .big{font-size:18px;font-weight:600;line-height:1.45}
.dcard ul{margin:0;padding-left:18px}
.tagline{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;background:var(--soft);border-radius:4px;padding:2px 8px;color:#4a453e}

.bench{display:grid;grid-template-columns:minmax(0,46fr) minmax(0,54fr);gap:20px;align-items:start}
.player{position:sticky;top:66px}
.stage{position:relative;aspect-ratio:16/9;background:var(--stage);color:var(--stage-ink);border-radius:10px;overflow:hidden;container-type:inline-size;user-select:none}
.stage::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.022) 0 2px,transparent 2px 14px);pointer-events:none}
.stage.v-live{background:linear-gradient(135deg,#27363b,#12181b)}
.stage.v-archive{background:linear-gradient(135deg,#3d3325,#1a1611)}
.stage.v-reenact{background:linear-gradient(135deg,#2c303d,#13141a)}
.stage.v-illust{background:linear-gradient(135deg,#3b2b33,#191216)}
.stage.v-diagram{background-color:#101a2c;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:6.25% 11.11%}
.stage.v-typo{background:#090909}
.stage.v-stock{background:linear-gradient(135deg,#343434,#171717)}
.scene{position:absolute;left:3.2cqw;top:3cqw;max-width:52cqw;z-index:2}
.scene .vt{display:inline-block;font-size:1.5cqw;font-weight:700;letter-spacing:.04em;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:.6cqw;padding:.25cqw .9cqw;margin-bottom:.8cqw}
.scene .vd{font-size:1.75cqw;line-height:1.5;color:rgba(244,241,234,.78)}
.scene .vc{font-size:1.45cqw;line-height:1.45;color:rgba(244,241,234,.5);margin-top:.5cqw}
.tc{position:absolute;right:3cqw;top:3cqw;font-size:1.5cqw;color:rgba(244,241,234,.6);font-variant-numeric:tabular-nums;z-index:2;text-align:right}
.snd{position:absolute;left:3.2cqw;bottom:2.6cqw;font-size:1.4cqw;color:rgba(244,241,234,.5);max-width:60cqw;z-index:2}
.txt{position:absolute;z-index:3;left:8cqw;right:8cqw;top:50%;transform:translateY(-42%);text-align:center;font-size:4.2cqw;font-weight:600;line-height:1.5;letter-spacing:-.01em;text-shadow:0 .15cqw .8cqw rgba(0,0,0,.6)}
.txt.pos-low{top:auto;bottom:11cqw;transform:none}
.txt.pos-left{right:44cqw;text-align:left}
.txt.pos-right{left:44cqw;text-align:right}
.txt .ln{display:block;opacity:0;transform:translateY(.6cqw);transition:opacity .35s ease,transform .35s ease}
.txt .ln.on{opacity:1;transform:none}
.txt em{font-style:normal;color:var(--stage-em)}
.txt.k-title{font-size:6.4cqw;font-weight:800;letter-spacing:-.03em}
.txt.k-name{font-size:5.6cqw;font-weight:800;letter-spacing:-.02em}
.txt.k-quote{font-family:var(--serif);font-weight:500;font-size:3.7cqw}
.corner{position:absolute;right:3cqw;bottom:6cqw;max-width:46cqw;text-align:right;font-size:1.7cqw;line-height:1.45;color:rgba(244,241,234,.82);z-index:3;opacity:0;transition:opacity .4s ease}
.corner.on{opacity:1}
.txt.k-label{font-size:2.1cqw;font-weight:500;color:rgba(244,241,234,.85);top:auto;bottom:6cqw;left:auto;right:4cqw;transform:none;text-align:right}
.txt.v-mono{font-family:var(--hand);font-size:4.6cqw;font-weight:400;color:#ffe9c9}
.txt .att{display:block;margin-top:1.4cqw;font-family:var(--sans);font-size:1.8cqw;font-weight:400;color:rgba(244,241,234,.7)}
.silent{position:absolute;left:0;right:0;bottom:11cqw;text-align:center;font-size:1.5cqw;letter-spacing:.2em;color:rgba(244,241,234,.35);z-index:2}
.turnmark{position:absolute;right:3cqw;bottom:2.6cqw;font-size:1.4cqw;color:var(--stage-em);z-index:2;letter-spacing:.08em}

.ctrl{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:#bdb5a6}
.btn.play{background:var(--ink);color:#fff;border-color:var(--ink);min-width:74px}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);margin-left:auto}
select.btn{padding-right:8px}
.track{position:relative;margin-top:10px;cursor:pointer}
.beats{display:flex;height:26px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.beat{position:relative;background:var(--panel);border-right:1px solid var(--line);font-size:11px;line-height:24px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#4a453e;min-width:0}
.beat:nth-child(even){background:var(--soft)}
.beat:last-child{border-right:0}
.ticks{display:flex;height:9px;margin-top:3px;border-radius:3px;overflow:hidden}
.tick{min-width:0;border-right:1px solid var(--paper)}
.tick.k-edit{background:#8d867a} .tick.k-quote{background:var(--accent)} .tick.k-title{background:var(--ink)} .tick.k-name{background:#4b4740} .tick.k-label{background:#c9c2b4} .tick.k-silent{background:#e3ddd0}
.tick.turn{box-shadow:inset 0 -3px 0 var(--stage-em)}
.head{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--accent);pointer-events:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.hint{font-size:12px;color:var(--muted);margin-top:8px}

.sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 90px)}
table{border-collapse:collapse;width:100%;font-size:13.5px;table-layout:fixed}
col.w-time{width:62px} col.w-text{width:29%} col.w-kind{width:64px} col.w-vis{width:auto} col.w-note{width:17%} col.w-flag{width:11%}
td{overflow-wrap:anywhere}
thead th{position:sticky;top:0;background:#efeadf;text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);z-index:1}
td{padding:9px 10px;border-bottom:1px solid var(--soft);vertical-align:top}
tr.card{cursor:pointer}
tr.card:hover td{background:#faf6ee}
tr.card.cur td{background:#fbf0d9}
tr.beatrow td{background:#efeadf;font-size:12.5px;color:#4a453e;padding:6px 10px;border-bottom:1px solid var(--line)}
tr.beatrow b{color:var(--ink);margin-right:8px}
.c-time{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
.c-time b{display:block;color:var(--ink);font-weight:600}
.c-text{min-width:0}
.c-text .l{display:block;font-size:15px;font-weight:600;line-height:1.5}
.c-text em{font-style:normal;color:var(--accent);background:linear-gradient(transparent 62%,#f6dcc9 62%)}
.c-text.q .l{font-family:var(--serif);font-weight:500}
.c-text.lab .l{font-size:13px;font-weight:500;color:#4a453e}
.c-text.ttl .l{font-size:18px;font-weight:800}
.c-text .att{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.c-text .none{color:#a9a294;font-size:13px}
.kind{display:inline-block;font-size:11.5px;border-radius:4px;padding:1px 7px;border:1px solid var(--line);white-space:nowrap;color:#4a453e}
.kind.k-quote{border-color:#e2bfae;color:var(--accent)}
.kind.k-title{background:var(--ink);color:#fff;border-color:var(--ink)}
.kind.k-name{background:#4b4740;color:#fff;border-color:#4b4740}
.c-text.nm .l{font-size:17px;font-weight:800}
.c-text .lab{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.c-text .lab::before{content:"구석 표기  ";color:#a39b8c}
.c-text .orig{display:block;font-size:11.5px;color:#a39b8c;margin-top:3px;font-style:italic}
tr.beatrow .div{display:block;color:var(--muted);font-size:12px;margin-top:2px}
tr.beatrow .div i{font-style:normal;color:#a39b8c;margin-right:4px}
.kind.k-silent{color:#a9a294}
.meta-s{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.turn{display:inline-block;font-size:11px;color:#7a5a00;background:#fbefc8;border-radius:4px;padding:0 6px;margin-top:3px}
.vtype{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:#3d3933;margin-bottom:2px}
.vtype i{width:9px;height:9px;border-radius:2px;display:inline-block}
.sw-live{background:#3b545c}.sw-archive{background:#7a633f}.sw-reenact{background:#4a5170}.sw-illust{background:#7b4f63}.sw-diagram{background:#24406f}.sw-typo{background:#111}.sw-stock{background:#777}
.c-vis .carr{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.c-vis .carr::before{content:"장면이 맡는 것  ";color:#a39b8c}
.c-note{font-size:12.5px;color:#4a453e}
.c-note .s{display:block;color:var(--muted)}
.c-note .memo{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px;color:#6d675e}
.c-note .memo:hover{-webkit-line-clamp:unset}
.c-note .src{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;color:var(--muted)}
.flag{display:inline-block;font-size:11px;border-radius:4px;padding:0 6px;margin:0 3px 3px 0;white-space:nowrap}
.flag.warn{background:#fbf2d6;color:var(--warn)} .flag.fail{background:#fbe5e3;color:var(--fail)}
.c-flag{min-width:0}
.flag{white-space:normal}

.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.metric b{display:block;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.metric span{font-size:12px;color:var(--muted)}
.metric small{display:block;font-size:11.5px;color:#a39b8c;margin-top:2px}
.lintgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 0}
.box h3{font-size:13px;margin:8px 16px 6px;color:var(--muted);font-weight:600}
.rule{display:grid;grid-template-columns:52px 124px 1fr;gap:10px;padding:8px 16px;border-top:1px solid var(--soft);font-size:13.5px;align-items:baseline}
.rule:first-of-type{border-top:0}
.lv{font-size:12px;font-weight:700}
.lv.ok{color:var(--ok)} .lv.warn{color:var(--warn)} .lv.fail{color:var(--fail)}
.rule .nm{color:#3d3933;font-weight:600}
.rule .cards a{font-size:12px;margin-right:6px;text-decoration:none;border-bottom:1px dotted var(--accent);cursor:pointer}
details.passed summary{cursor:pointer;padding:8px 16px;font-size:13px;color:var(--muted);border-top:1px solid var(--soft)}
.manual{list-style:none;margin:0;padding:0 16px 10px}
.manual li{padding:6px 0;border-top:1px solid var(--soft);font-size:13.5px;display:flex;gap:8px}
.manual li:first-child{border-top:0}
.manual input{margin-top:4px;accent-color:var(--accent)}
.chain{padding:4px 16px 12px;font-size:14px;line-height:1.9}
.chain span{background:linear-gradient(transparent 62%,#f6dcc9 62%);margin-right:4px}
.chain i{color:#b8b0a1;font-style:normal;margin-right:4px}
.notes{padding:0 16px 10px;margin:0 0 0 18px;font-size:13.5px}
.sources{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 18px}
.source{padding:10px 0;border-top:1px solid var(--soft);font-size:13.5px;display:grid;grid-template-columns:40px 1fr;gap:10px}
.source:first-child{border-top:0}
.source .id{font-weight:700;color:var(--muted)}
.source .ck{color:var(--muted);display:block}
footer{margin-top:50px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:1080px){.bench{grid-template-columns:1fr}.player{position:static}.sheet{max-height:none}.decisions{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:repeat(3,1fr)}.lintgrid{grid-template-columns:1fr}}
@media (max-width:640px){.wrap{padding:0 14px 60px}.decisions{grid-template-columns:1fr}.dcard.wide{grid-column:auto}h1{font-size:26px}.metrics{grid-template-columns:repeat(2,1fr)}.rule{grid-template-columns:44px 1fr}.rule .nm{grid-column:2}.rule .ms{grid-column:1/-1}}
@media print{.top,.ctrl,.track,.hint,.legend{display:none}.player{position:static}.sheet{max-height:none;overflow:visible}.bench{grid-template-columns:1fr}}
</style>
</head>

<script>const DATA = {"title": "English scripts: Espresso (C), Desire Paths (D1), Cheonggyecheon (B)", "built": "2026-11-12 17:20", "families": {"A1": "에세이형", "A2": "사건에서 개념으로", "A3": "다시 보기", "B": "사건 중계형", "C": "인물·사물 서사형", "D1": "발견 전달형", "D2": "개념 설명형", "L": "구획형"}, "cases": [{"file": "espresso.json", "script": {"meta": {"title": "Espresso Is Older Than Its Crema | How the espresso machine was invented, 1884 to 1961", "lang": "en", "family": "C", "family_reason": "It follows one object, the espresso machine, in strict time order from its first patent (1884) to the standard it works at today. At 150 seconds the belief-reversal families (A1, A3: 4 to 6 minutes, withheld subject) do not fit; C covers 1 to 6 minutes and opens with the result.", "target_seconds": 150, "hook_mode": "리드", "lead": "The machine is older than the crema by more than fifty years", "logline": "The espresso machine was patented to make coffee instantly; the crema we now read as the mark of espresso arrived more than fifty years later, when a piston replaced steam, and it was first sold under a name other than espresso.", "audience_belief": "Espresso, crema and all, is an old Italian tradition that has always been made this way.", "axis_fact": "The pressure gauge: the first machines pushed water at about 1.5 bar and never passed 2, so they made no crema. Crema appears only after Achille Gaggia's piston (patent of Sept. 5, 1938; lever patent 1947), more than fifty years after the first patent of 1884, and it was sold as 'crema caffè' to set it apart from espresso. Today's standard is 9 bar.", "ending": {"type": "사실", "callback": "fifty years", "callback_kind": "낱말"}, "materials": "Open-license live-action stock (Pexels, Pixabay, Mixkit, Coverr): espresso extraction, cups, hands, lever machine. Vector graphics: pressure gauge, piston cutaway, timeline, typography. Public-domain patent drawings: Moriondo 1884 (Wikimedia Commons), Bezzera U.S. Patent 726,793 (1903). No commissioned shooting, no generated images.", "sources": [{"id": "S1", "label": "Jimmy Stamp, 'The Long History of the Espresso Machine', Smithsonian Magazine, 2012", "url": "https://www.smithsonianmag.com/arts-culture/the-long-history-of-the-espresso-machine-126012814/", "checked": "Moriondo granted a patent in 1884 for 'new steam machinery for the economic and instantaneous confection of coffee beverage'; boiler heated to 1.5 bar; 'purely a bulk brewer'. Early steam machines 'at best, two bars', 1.5 to 2 bar without burning the coffee; burnt or bitter taste. Gaggia a 'Milanese café owner'; lever raises pressure to 8 to 10 bar; crema comes with the lever machine. Faema E61 (1961): motorized pump, nine bar. Also says early machines made 'up to 1,000 cups of coffee per hour' (NOT used: S6 says 150) and that Pavoni bought the patents in 1903 (year not used: S6 gives a deed of 1 Sept. 1902).", "status": "직접 확인"}, {"id": "S2", "label": "Jonathan Morris, 'Making Italian Espresso, Making Espresso Italian', Food and History 8(2), 2010, pp. 155-183 (author's pre-print, University of Hertfordshire)", "url": "https://uhra.herts.ac.uk/id/eprint/2694/1/jm2.pdf", "checked": "pp. 8, 12-18 of the pre-print. The claim that espresso is an unchanging tradition 'does not stand up in historical terms'. Bezzera registered his patent in 1901; Pavoni's Ideale of 1905 was the first espresso machine in commercial production; both exhibited at the 1906 fair in Milan. Pre-war espresso was black, tasted bitter and burnt because of the steam, and 'lacked any of the mousse or crema topping' at around 1.5 bar. Gaggia, 'a Milanese bar owner', patented a rotating-handle piston in 1938, not manufactured; by 1941 Italy 'ceased to import coffee altogether'. 1947 lever patent with a spring: pressure 'from three to twelve atmospheres'; oils and colloids form the crema; the drink was renamed 'crema caffè' to distinguish it from espresso. Machine slogans 'Crema caffè naturale' and 'It works without steam'. 1961 Faema E61: electric pump, 'a relatively constant 9 bars'. INEI standard: 9 bar.", "status": "직접 확인"}, {"id": "S3", "label": "Luigi Bezzera, 'Coffee-Making Machine', U.S. Patent 726,793, patented April 28, 1903 (filed June 10, 1902)", "url": "https://patents.google.com/patent/US726793A/en", "checked": "Patent number, dates, title; heading 'LUIGI BEZZERA, OF MILAN, ITALY, ASSIGNOR TO DESIDERIO PAVONI, OF MILAN, ITALY'; drawing sheet headers; the quoted sentence 'By means of my appliance, on the other hand, the quantity of coffee necessary for a single cup is prepared separately, so that fresh coffee is always served.' Read in the Google Patents text and in the patent PDF (patentimages.storage.googleapis.com/dd/70/81/35aa2b0604438b/US726793.pdf). U.S. patent text and drawings of 1903 are in the public domain.", "status": "직접 확인"}, {"id": "S4", "label": "Gaggia Milano, 'Our History' (manufacturer's history page)", "url": "https://www.gaggia.com/our-history", "checked": "Patent no. 365726 filed Sept. 5, 1938 for 'Lampo': hot water pressure instead of steam, 'a soft layer of crema naturale'. Second patent (1947): lever and spring. 1948: first machine, Tipo Classica. Slogan on the machines: 'Crema caffè naturale - Funziona senza vapore'. DISAGREES with S2 on when crema first appears (1938 here, 1947 lever in S2): the script says 'more than fifty years', true for both (54 and 63).", "status": "직접 확인"}, {"id": "S5", "label": "Gaggia Professional (Evoca Group), 'About Gaggia'", "url": "https://gaggiaprofessional.evocagroup.com/en/about-gaggia", "checked": "1938 patent no. 365726 'for a steam-free coffee machine'; the 1947 lever reached '8-9 atmospheres'; machines bear the words 'Crema caffè naturale funziona senza vapore'. Lever pressure differs across S1 (8-10 bar), S2 (3-12 atm, rising and falling) and here (8-9 atm): no lever pressure figure is used on screen.", "status": "직접 확인"}, {"id": "S6", "label": "Elena Locatelli, 'La Pavoni. Dal 1905 macchine per il caffè' (company monograph, 2005), pp. 5-19", "url": "https://www.lapavoni.com/pdf/la_pavoni_monografia.pdf", "checked": "Official gazette of 13 Jan. 1904: Bezzera's patent 'Innovation in equipment designed to instantly prepare and serve coffee as a drink' (certificate of 5 June 1902) transferred to Desiderio Pavoni by deed of 1 Sept. 1902. Bezzera's machine worked at 1.5 atm. Ideale, 1905. Sign at the 1906 Milan fair: 'Bezzera L. Caffè Espresso'. Says the machines made 'up to 150 cups of coffee per hour' (disagrees with S1's 1,000: no cups-per-hour figure is used). Gives 19 November 1901 for Bezzera's filing where other secondary sources give 19 December: only the year 1901 is used.", "status": "직접 확인"}, {"id": "S7", "label": "Angelo Moriondo, patent drawing, Bollettino delle Privative Industriali, 1884 (Wikimedia Commons file page)", "url": "https://commons.wikimedia.org/wiki/File:Espresso-machine-first-patent-angelo-moriondo.jpg", "checked": "Image viewed: the sheet is headed 'Bollettino delle Privative Industriali - Anno 1884' and carries the printed title 'MORIONDO ANGELO. Nuovi apparecchi a vapore per la confezione economica ed istantanea del caffè in bevanda sistema A. Moriondo'. File description: patent vol. 33 no. 256, dated May 16, 1884. Marked public domain. The date May 16, 1884 rests on this file description and matching secondary pages; S1 confirms the year and the title.", "status": "직접 확인"}, {"id": "S8", "label": "Bezzera, 'Company History' (manufacturer's page)", "url": "https://www.bezzera.it/en/bezzera", "checked": "'1901 Luigi Bezzera patented espresso coffee machine'; first machine shown at the Milan International Fair in 1906. The page dates U.S. Patent 726,793 to 'May 28, 1902', which is the day Bezzera signed the specification; the patent record (S3) gives filing June 10, 1902 and grant April 28, 1903, and the script follows the record.", "status": "직접 확인"}, {"id": "S9", "label": "Italian Espresso National Institute (INEI), 'The Certified Italian Espresso and Cappuccino' (brochure, 2006)", "url": "https://olaszpresszo.hu/wp-content/uploads/2014/04/istituzionale_inei_hq_en.pdf", "checked": "PDF opened (pp. 1-3 read: the Institute, founded 1998, certificate Csqa n. 214 of 24 Sept. 1999). The parameter table 'Entry water pressure 9 bar ± 1' was confirmed from the search excerpt of this PDF and from S2, which reports the same INEI figure.", "status": "직접 확인 (수치 표는 검색 발췌와 S2로 확인)"}, {"id": "S10", "label": "Jonathan Morris, 'The Faema E61 Espresso Machine', Perspectives on History (American Historical Association), Dec. 23, 2020", "url": "https://www.historians.org/perspectives-article/the-faema-e61-espresso-machine-january-2021", "checked": "Search excerpt: the E61's electric volumetric pump passed water through the coffee 'under a constant nine bars of pressure, now the standard parameter for Italian espresso'. Used only as the most recent support (2020) for the present-tense card c27.", "status": "주소가 열리지 않음(403), 발췌로 확인"}], "cast": [{"id": "cup", "look": "Small white espresso cup on a dark counter, dark background, shot close from slightly above rim height so the surface of the coffee is visible. One continuous stock clip of an extraction, at least 12 seconds long.", "fixed": "The same clip is used in c01-c03 and again in c28-c29. The tan foam on the surface must be visible in every one of these cards; the cup sits in the lower third so the center stays dark for the text."}, {"id": "gauge", "look": "Flat vector pressure gauge: round dial, scale 0 to 12 bar, tick marks every 1 bar, heavier marks at 2 and 9. Amber needle. Dark ground.", "fixed": "Always in the right third, same size, in c08, c16, c20, c26, c27. The mark at 9 stays unlabeled until c26. In c20 the needle shows no fixed value."}, {"id": "patent sheets", "look": "Public-domain patent drawings inverted to pale lines on a dark ground: Moriondo 1884 (c05-c07), Bezzera U.S. 726,793 (c09-c13).", "fixed": "Never redrawn or cleaned up beyond inversion and dimming. The part a sentence is about is marked with an amber outline or underline only."}], "visual_code": [{"sign": "amber needle, amber fill, amber arc", "means": "water pressure, in bar"}, {"sign": "pale gray wisps", "means": "steam"}, {"sign": "amber outline or underline on a patent sheet", "means": "the part or the words this card's sentence is about"}, {"sign": "white timeline dot, filled", "means": "a patent or machine that was built"}, {"sign": "white timeline dot, hollow, and dashed gray line", "means": "patented but not built; years without production"}], "type_style": {"pos": "가운데", "face": "thin white sans-serif for editorial lines; serif for quotes (c11, c12, c21); corner labels in the same sans, small", "size": "about 5% of frame height (52-56 px at 1080p), centered, two lines; three-line cards keep the same size; name cards (c04, c15, c25) larger at the same position", "em": "one weight step heavier, no color change", "ground": "dark; stock footage and patent sheets graded down so the white type is the brightest thing on screen; the center of every picture is kept empty"}, "music_brief": {"mood": "hopeful, quietly sentimental; steady and flowing from start to end", "instruments": "solo piano", "tempo": "moderate and even, about 70-90 bpm, a continuous flowing pattern", "avoid": "drums and any percussion, vocals, added strings or pads, big crescendos, sudden stops", "in": "c01", "pause": "c22 앞 1.5초 (optional; if the chosen track has no natural rest there, lower the music by about 6 dB under c22 instead)", "out": "c30", "end": "Let the track reach its own ending on the last line (c29). The start is set in production once the track length is known."}, "review_notes": ["Manual check, scene and sentence: c23 'rose as foam' partly repeats what the glass shows; kept because the sentence's work is the cause (pressure, the coffee's own oils) and the foam is the grammatical end of that cause. c07 shows the Italian title while the sentence gives its English sense; kept as a translation of text in the picture.", "Manual check, English periods: the card spec says editorial lines take no period, but the linter can only see a closed English card by its period. Closed cards therefore end with a period, open cards with a comma or nothing, noun-stop cards (c08, c10, c20, c27) carry end: '명사'.", "Manual check, reading time: the production reading floor is not checked for English. Every text card was checked by hand against words/3 + 2 s (quote cards with attribution + 1.5 s); the shortest margin is c02 (7 words, 4.5 s against 4.3 s).", "Editor pass after skill 0.6.0: footage cards retyped. Footage of espresso itself is 실사 even though it is sourced, not shot; only c17 (plain black coffee standing in for the pre-war drink) is 스톡. Search terms moved from note to visual.footage.", "Editor pass: c10 and c11 lengthened to meet the English reading floor (words/3 + 2 s); the time came from c12, c27 and c29. c16 \"three more decades\" became \"decades more\" so the card carries one figure. c27 sets two figures side by side on purpose (compare: true).", "Positions given in visual.desc for sourced footage (\"cup in the lower third\") are wishes, not conditions. Production crops, shifts and darkens the clip to clear the text zone (04, section 8).", "c04 (name card) was kept as the film's title card although the object is familiar; the writer noted it reads as surplus. It gives the lead a beat to land before the patent sheet.", "After production (2026-11-12, see examples/espresso/production-notes.md): c20 was produced as a diagram, not live action. No clip of a lever being pulled was found on Pexels, Pixabay or Mixkit, so the fallback now written on c20 was used.", "After production: c30 (sources, 16 words in 5 s) is too short to read; the new source-card-time check flags it. It is left as produced. In a revision, give it 7.5 s or split it in two.", "After production: the music could not start on the first frame. The chosen track is 131 s and the film 150 s, so the film opens on the sound of the machine alone and the music enters at 15.5 s; its ending lands on the last line."], "assumptions": ["Length: 150 seconds, taken from the brief ('about 150 seconds').", "Audience belief: the brief's suggestion was kept after research; Morris (S2) describes exactly this belief and says it does not stand up historically.", "Language of the file: on-screen text (lines, label, attribution) is English. Scene descriptions, carries, motion, notes and the design fields in meta are also written in English so that an English-language production and stock search can use them; fields whose values the skill defines as fixed Korean terms (kind, visual.type, hook_mode, ending.type, callback_kind, frame, quote_form, status, pos) keep the Korean values. Beat names keep the Korean names of the C beat sheet with an English gloss.", "Open-license live-action stock is typed as visual.type '스톡'; public-domain patent drawings as '기록'; vector graphics as '도해' or '타이포'.", "English reading time: the production floor in the card spec is defined for Korean only (characters/7 + 2 s). For English this script uses words/3 + 2 s as its own floor, plus 1.5 s on the card that carries an attribution.", "Music tempo (70-90 bpm) is the script's reading of 'steady, flowing'; the user gave mood, instrument and 'no drums' only.", "Arduino, Cremonese, Illy's Illetta and Cimbali are left out; no sentence in the script claims a count of inventors or that Gaggia worked alone."]}, "beats": [{"id": "b1", "name": "리드 (Lead)", "job": "State the result at once: the machine came first, the crema more than fifty years later.", "scene": "What crema is and where it sits: espresso running into a cup and the tan foam forming on top.", "text": "The order in time and the size of the gap (more than fifty years)."}, {"id": "b2", "name": "이름 (Name)", "job": "Give the protagonist's name right after the lead.", "scene": "Nothing but the name.", "text": "The name."}, {"id": "b3", "name": "시간순 전개 (In time order)", "job": "Go back to 1884 and walk forward: Moriondo's steam patent, Bezzera's single cup, Pavoni's production, the 1906 fair where the name appears.", "scene": "What the first machines looked like (the patent drawings themselves), which part made the single cup, the record's own words, how low 1.5 bar is on a dial.", "text": "Who, in which year, for what purpose (economical and instant; fresh for a single cup), and the pressure figure."}, {"id": "b4", "name": "심기 (Planting)", "job": "Plant the repeated fact that the climax will break: for three more decades the needle never passes 2 bar, and the coffee is burned.", "scene": "The needle trembling under the 2 mark while years pass; a cup of flat black coffee with nothing on top.", "text": "How long it lasted, the ceiling (2 bar), the cause (steam) and the taste (bitter)."}, {"id": "b5", "name": "꺾임 (Turn)", "job": "1938: a bar owner replaces steam with a piston. War stops it; in 1947 the lever and spring arrive. The crema appears, and it is not sold as espresso.", "scene": "How a piston pushes water through coffee; the nine-year gap on a timeline; a hand pulling a lever; the crema itself forming in a glass.", "text": "The years, the patent, why nothing was built (war, no coffee imports), the cause of the foam (pressure, the coffee's oils), and the name it was sold under."}, {"id": "b6", "name": "현재 (Now)", "job": "Close the technical story: the 1961 pump holds the pressure steady; 9 bar is today's standard, six times the first machine.", "scene": "The needle settling on 9 and the distance from 1.5 drawn as six steps.", "text": "The year, what replaced the arm, the standard figure and the ratio."}, {"id": "b7", "name": "결말 (Ending)", "job": "Pause, show the first cup again, and set the patent's own word 'instant' against the fifty years.", "scene": "The opening cup and its crema, unchanged.", "text": "One fact: built to be instant, over fifty years to make this."}, {"id": "b8", "name": "참고 자료 (Sources)", "job": "Name the sources on one label card. The one disagreement that touches the lead (first crema in 1938 or 1947) is shown earlier, in the corner label of c03.", "scene": "Small type on a dark frame.", "text": "Source names."}], "cards": [{"id": "c01", "beat": "b1", "d": 2.5, "kind": "무문장", "lines": [], "visual": {"type": "실사", "desc": "Close-up against a dark background: two thin streams of espresso run from a portafilter spout into a small white cup on a dark counter; a tan layer of foam builds on the surface. The cup sits in the lower third of the frame.", "carries": "What crema is and where it sits; the viewer sees it before any word names it.", "motion": "Camera: locked-off close-up / Subject: streams run, foam rises / Cut: none, the shot continues under c02", "frame": "근접", "events": 1, "callback": true, "footage": {"search": ["espresso pouring cup close up dark", "espresso extraction portafilter", "espresso shot crema macro"], "min_len": 12, "must": "dark background, no readable text or logo, crema visibly forming", "fallback": "Any dark-background close-up of espresso leaving the spouts; the cup itself may be out of frame."}}, "sound": "Music in on the first frame: solo piano, steady flowing pattern (see meta.music_brief). No sound effects.", "note": "One continuous clip of at least 12 s is needed for c01-c03; the same clip returns in c28-c29.", "t": 0}, {"id": "c02", "beat": "b1", "d": 4.5, "kind": "편집", "lines": ["The machine is older", "than the crema"], "visual": {"type": "실사", "desc": "(앞 장면 계속) Same shot: the streams thin out and the foam settles on the surface.", "carries": "Which machine and which crema: the picture shows both, the sentence only puts them in order.", "frame": "근접", "events": 1}, "t": 2.5}, {"id": "c03", "beat": "b1", "d": 5, "kind": "편집", "lines": ["by more than", "fifty years."], "em": "fifty years", "label": "1884 patent · crema 1938 or 1947", "src": ["S1", "S4", "S2"], "visual": {"type": "실사", "desc": "(앞 장면 계속) Same shot: the last drops fall and the full cup stands with its foam intact.", "carries": "The finished cup: the thing the fifty years were for.", "frame": "근접", "events": 1}, "note": "Calculation: 1938 - 1884 = 54 (S4: Gaggia dates the first 'crema naturale' to the 1938 patent); 1947 - 1884 = 63 (S2: crema comes with the 1947 lever). 'More than fifty' is true under both, and the corner label shows both years.", "t": 7}, {"id": "c04", "beat": "b2", "d": 3.5, "kind": "이름", "lines": ["The Espresso Machine"], "visual": {"type": "타이포", "desc": "Dark frame. The name alone at the center, larger than the sentence cards.", "motion": "Camera: none / Subject: the name fades in and holds / Cut: cut to the patent sheet"}, "t": 12}, {"id": "c05", "beat": "b3", "d": 3, "kind": "무문장", "lines": [], "visual": {"type": "기록", "desc": "Angelo Moriondo's 1884 patent sheet (public domain; Wikimedia Commons, File:Espresso-machine-first-patent-angelo-moriondo.jpg), inverted to pale lines on a dark ground. The whole sheet is in view; the tall boiler of Fig. 1 stands in the left third.", "carries": "The first machine's shape and age: a tall boiler with pipes and taps, hand-drawn in the 19th century.", "motion": "Camera: very slow drift toward the right / Subject: none / Cut: none, continues under c06", "text_in_picture": ["Bollettino delle Privative Industriali - Anno 1884", "MORIONDO ANGELO", "Nuovi apparecchi a vapore per la confezione economica ed istantanea del caffè in bevanda sistema A. Moriondo"], "frame": "전경", "events": 1}, "sound": "Music continues unchanged.", "t": 15.5}, {"id": "c06", "beat": "b3", "d": 6, "kind": "편집", "lines": ["In 1884, Angelo Moriondo", "patented a coffee machine", "driven by steam,"], "label": "Turin · patent of May 16", "src": ["S1", "S7"], "visual": {"type": "기록", "desc": "(앞 장면 계속) The same sheet in full view; the outline of the boiler in Fig. 1 brightens.", "carries": "How large the machine is: one big boiler, no cup-sized parts.", "frame": "전경", "events": 1}, "t": 18.5}, {"id": "c07", "beat": "b3", "d": 5, "kind": "편집", "lines": ["built to make coffee", "economical and instant."], "em": "instant", "src": ["S1", "S7"], "visual": {"type": "기록", "desc": "(앞 장면 계속) The camera has moved in on the title printed on the sheet, now in the upper third; the words 'economica ed istantanea' are underlined in amber.", "carries": "The patent's own Italian wording: 'instant' is the inventor's word, not the editor's.", "motion": "Camera: slow push in to the printed title, finished before the second line appears / Subject: amber underline draws once / Cut: cut to the gauge", "text_in_picture": ["Nuovi apparecchi a vapore per la confezione economica ed istantanea del caffè in bevanda sistema A. Moriondo"], "frame": "근접", "events": 2}, "note": "Indirect quotation of the patent title; S1 translates it as 'economic and instantaneous confection of coffee beverage'.", "t": 24.5}, {"id": "c08", "beat": "b3", "d": 5.5, "kind": "편집", "lines": ["A bulk brewer,", "working at about 1.5 bar"], "em": "1.5 bar", "end": "명사", "label": "1 bar ≈ the air at sea level", "src": "S1", "visual": {"type": "도해", "desc": "Vector pressure gauge in the right third on a dark ground (see meta.cast 'gauge'): the amber needle rises from 0 and stops at 1.5. Nothing else in the frame.", "carries": "How low 1.5 sits on a dial that runs to 12, with a heavy unlabeled mark far up the scale.", "motion": "Camera: none / Subject: needle rises once and rests / Cut: cut to the second patent sheet", "frame": "중간", "events": 1}, "note": "S1: 'a large boiler, heated to 1.5 bars of pressure'; 'purely a bulk brewer'. An earlier draft drew an urn with cups beside the gauge; removed because it only illustrated the word 'bulk'.", "t": 29.5}, {"id": "c09", "beat": "b3", "d": 2.5, "kind": "무문장", "lines": [], "visual": {"type": "기록", "desc": "A drawing sheet of U.S. Patent 726,793 (public domain; PDF linked from Google Patents), inverted to pale lines on dark. Whole sheet in view, the boiler in the left third.", "carries": "A second, later machine: still a boiler, but with a small fitting on its side.", "motion": "Camera: none / Subject: none / Cut: none, continues under c10", "text_in_picture": ["No. 726,793. PATENTED APR. 28, 1903.", "L. BEZZERA.", "COFFEE MAKING MACHINE.", "APPLICATION FILED JUNE 10, 1902."], "frame": "전경", "events": 1}, "note": "Use the sheet that carries Fig. 2 (the delivery cock with the detachable cup). Check which of the two sheets it is before layout.", "t": 35}, {"id": "c10", "beat": "b3", "d": 6, "kind": "편집", "lines": ["Seventeen years later:", "Luigi Bezzera's machine,", "one cup at a time"], "em": "one cup", "end": "명사", "label": "Milan · patent filed 1901", "src": ["S2", "S8", "S3"], "visual": {"type": "기록", "desc": "(앞 장면 계속) The camera has moved in on Fig. 2: the delivery cock with a small detachable cup hanging under it. The cup is outlined in amber and sits in the right third.", "carries": "How small the brewing part has become: one cup-sized holder with handles, the ancestor of the portafilter.", "motion": "Camera: push in to Fig. 2, finished before the text appears / Subject: amber outline draws once / Cut: none, continues under c11", "frame": "근접", "events": 2}, "note": "Calculation: 1901 - 1884 = 17. Sources differ on the day of the 1901 filing (19 November in S6, 19 December elsewhere), so only the year is used.", "t": 37.5}, {"id": "c11", "beat": "b3", "d": 7, "kind": "인용", "voice": "인용", "lines": ["“the quantity of coffee", "necessary for a single cup", "is prepared separately,"], "src": "S3", "quote_form": "줄임", "original": "By means of my appliance, on the other hand, the quantity of coffee necessary for a single cup is prepared separately, so that fresh coffee is always served.", "visual": {"type": "기록", "desc": "(앞 장면 계속) Fig. 2 held and dimmed; the amber outline stays on the cup.", "carries": "Which part of the machine the sentence is describing.", "frame": "근접", "events": 0}, "note": "The quote runs over c11 and c12: quotation marks open here and close in c12; attribution on c12. Only the opening clause of the sentence is cut ('By means of my appliance, on the other hand,'), so no ellipsis inside.", "t": 43.5}, {"id": "c12", "beat": "b3", "d": 6, "kind": "인용", "voice": "인용", "lines": ["so that fresh coffee", "is always served.”"], "src": "S3", "attribution": "Luigi Bezzera, U.S. Patent 726,793 (1903)", "quote_form": "줄임", "original": "By means of my appliance, on the other hand, the quantity of coffee necessary for a single cup is prepared separately, so that fresh coffee is always served.", "visual": {"type": "기록", "desc": "(앞 장면 계속) The amber outline of the cup slides down a little way off the fitting, as the patent says the vessel is removed and replaced after each cup.", "carries": "'Separately' made visible: the holder comes off after every cup.", "motion": "Camera: none / Subject: the outlined cup detaches once / Cut: cut to the printed specification", "frame": "근접", "events": 1}, "t": 50.5}, {"id": "c13", "beat": "b3", "d": 5, "kind": "편집", "lines": ["Desiderio Pavoni", "put the machine", "into production,"], "em": "into production", "label": "Ideale · Milan, 1905", "src": ["S2", "S6", "S3"], "visual": {"type": "기록", "desc": "First page of the same patent's printed specification, inverted; the heading line is in the upper third and the words 'ASSIGNOR TO DESIDERIO PAVONI' are underlined in amber.", "carries": "The transfer of the patent, in the record's own words; the sentence adds only what Pavoni did with it.", "motion": "Camera: none / Subject: amber underline draws once / Cut: cut to dark", "text_in_picture": ["LUIGI BEZZERA, OF MILAN, ITALY, ASSIGNOR TO DESIDERIO PAVONI, OF MILAN, ITALY."], "frame": "근접", "events": 1}, "note": "S2: Pavoni's Ideale of 1905 is 'generally recognised as the first espresso machine to enter into commercial production'. The year of the purchase is left out: S1 says 1903, S6 quotes a deed of 1 Sept. 1902 registered in 1903.", "t": 56.5}, {"id": "c14", "beat": "b3", "d": 5, "kind": "편집", "lines": ["and at Milan's 1906 fair", "the sign read"], "src": ["S6", "S2", "S8"], "end": "넘김", "visual": {"type": "도해", "desc": "Dark frame. A thin white rectangle, shaped like a signboard, draws itself across the upper third and stays empty.", "carries": "That the next words are lettering on a sign, not the editor's sentence.", "motion": "Camera: none / Subject: the outline draws once / Cut: none, the outline stays under c15", "frame": "중간", "events": 1}, "t": 61.5}, {"id": "c15", "beat": "b3", "d": 3.5, "kind": "이름", "lines": ["Caffè Espresso"], "label": "Stand sign, Milan, 1906", "src": "S6", "visual": {"type": "타이포", "desc": "(앞 장면 계속) The two words appear at the center, larger than sentence cards; the signboard outline above fades out.", "motion": "Camera: none / Subject: words fade in and hold / Cut: cut to the gauge"}, "note": "S6: at the Milan fair of 1906 'the sign still provides for the words \"Bezzera L. Caffè Espresso\"'. No archive photograph is assumed; the words are set as type.", "t": 66.5}, {"id": "c16", "beat": "b4", "d": 5.5, "kind": "편집", "lines": ["For decades more,", "steam alone never", "passed 2 bar,"], "em": "2 bar", "src": ["S1", "S2"], "visual": {"type": "도해", "desc": "The gauge again, right third (meta.cast 'gauge'): the needle trembles just under the 2 mark and never crosses it, while small year numbers under the dial run from 1906 to 1938.", "carries": "The ceiling as a daily fact: how close to 2, how far from the unlabeled heavy mark at 9, and the years going by.", "motion": "Camera: none / Subject: needle trembles, years count up / Cut: cut to the cup", "frame": "중간", "events": 1}, "sound": "Music continues; no change at this beat.", "note": "Calculation: 1938 - 1906 = 32, 'decades more'. S1: the early machines 'could only conjure up, at best, two bars'; no machine brewed 'with more than 1.5-2 bars of pressure without burning the coffee'. S2: 'around 1.5 bar'. The subject is 'steam alone' because S2 also records attempts that did not rely on steam before 1938 (Illy's compressed-air Illetta, 1935); the sentence makes no claim about those.", "t": 70}, {"id": "c17", "beat": "b4", "d": 6.5, "kind": "편집", "lines": ["and the same steam", "burned the coffee", "and left it bitter."], "em": "bitter", "src": ["S2", "S1"], "visual": {"type": "스톡", "desc": "Top-down shot of plain black coffee in a white cup on a dark table: a flat black surface with no foam, a little steam rising. The cup sits in the lower right third.", "carries": "What was missing: a black surface with nothing on top.", "motion": "Camera: locked-off / Subject: steam drifts / Cut: cut to black, then the turn", "frame": "근접", "events": 1, "footage": {"search": ["black coffee cup top view dark", "black coffee steam dark background", "americano cup overhead"], "stand_in": true, "must": "no foam on the surface, no readable text"}}, "note": "S2: the pre-war drink 'was black, rather than brown, and tasted bitter and burnt - a consequence of the steam'; it 'lacked any of the mousse or crema topping'. S1: steam 'had the unfortunate side effect of imbuing the coffee with a burnt or bitter taste'.", "t": 75.5}, {"id": "c18", "beat": "b5", "d": 6, "kind": "편집", "turn": true, "lines": ["But in 1938,", "a Milan bar owner", "patented a piston."], "em": "a piston", "label": "Achille Gaggia · No. 365726", "src": ["S4", "S2", "S5"], "visual": {"type": "도해", "desc": "Vector cutaway on a dark ground, right third: a vertical cylinder in which a piston, turned down by a hand screw, presses a column of water (amber) through a puck of ground coffee. Pale gray steam wisps stay on the boiler side, outside the cylinder.", "carries": "The mechanism: a piston, not steam, does the pushing, and only water meets the coffee.", "motion": "Camera: none / Subject: the piston descends once / Cut: cut to the timeline", "frame": "중간", "events": 2}, "sound": "Music continues. Optional: if the track has a change of register or a new phrase, let it start here.", "note": "S4: patent no. 365726 filed Sept. 5, 1938, 'hot water pressure instead of steam'. S2: 'a rotating handle piston'. The cutaway is a schematic of the principle, not a copy of the patent drawing.", "t": 82}, {"id": "c19", "beat": "b5", "d": 5.5, "kind": "편집", "lines": ["Then war came,", "and Italy's coffee imports", "stopped altogether."], "em": "stopped", "label": "by 1941", "src": "S2", "visual": {"type": "도해", "desc": "A thin white timeline across the lower third: filled dots at 1884, 1901 and 1906, a hollow dot at 1938. From 1938 the line continues as a dashed gray stretch up to 1947.", "carries": "The gap: nine years in which the patent existed and no machine did.", "motion": "Camera: none / Subject: the dashed stretch draws from 1938 to 1947 / Cut: cut to the lever", "frame": "전경", "events": 1}, "note": "S2: 'By 1941 ... the country ceased to import coffee altogether'; the 1938 design was not manufactured commercially. Calculation for the scene: 1947 - 1938 = 9.", "t": 88}, {"id": "c20", "beat": "b5", "d": 6, "kind": "편집", "lines": ["In 1947: a lever", "and a spring", "to do the pushing"], "em": "a lever", "end": "명사", "src": ["S2", "S4"], "visual": {"type": "실사", "desc": "Side view of a hand pulling down the long lever of a chrome lever espresso machine; the machine stands in the left third, the background is dark and out of focus. The vector gauge is overlaid in the right third: its needle swings far past the 2 mark into the upper half of the dial.", "carries": "What a lever machine looks like in use, and that the pressure leaves the old ceiling far behind.", "motion": "Camera: locked-off / Subject: the lever comes down once; the needle swings up once / Cut: cut to dark", "frame": "중간", "events": 2, "footage": {"search": ["lever espresso machine pull", "barista pulling lever espresso", "manual lever coffee machine close up"], "must": "a hand pulling a real lever; any modern lever machine; no brand name in focus", "fallback": "If no clip of a hand pulling a lever is found, do not substitute another machine. Continue the cutaway of c18 and add a lever and a spring to the same cylinder."}}, "note": "The needle must not settle on a number: sources give 8-10 bar (S1), 8-9 atmospheres (S5) and 3 to 12 atmospheres rising and falling (S2). Any modern lever machine will do; the picture stands for the mechanism, not for the 1948 model.", "t": 93.5}, {"id": "c21", "beat": "b5", "d": 5, "kind": "인용", "voice": "인용", "lines": ["“It works without steam”"], "src": ["S2", "S4"], "attribution": "Slogan on Gaggia's lever machines", "quote_form": "번역", "original": "Funziona senza vapore", "visual": {"type": "타이포", "desc": "Dark frame. The slogan alone at the center, in the serif used for quotes.", "motion": "Camera: none / Subject: the line fades in and holds / Cut: cut to the glass"}, "note": "English wording as given in S2 ('It works without steam'); Italian original from S4 and S5 ('Crema caffè naturale - Funziona senza vapore').", "t": 99.5}, {"id": "c22", "beat": "b5", "d": 4, "kind": "무문장", "lines": [], "visual": {"type": "실사", "desc": "Close side view of a small glass espresso cup against a dark background: dark coffee rises in the glass and a tan layer of foam forms on top of it. The glass sits in the lower third.", "carries": "The crema itself, arriving: its color and its thickness, seen through the glass.", "motion": "Camera: locked-off close-up / Subject: the glass fills / Cut: none, continues under c23", "frame": "근접", "events": 1, "footage": {"search": ["espresso glass cup side view crema", "espresso shot glass pouring close up", "espresso layers glass dark background"], "min_len": 14, "must": "glass cup seen from the side so the two layers show; dark background", "fallback": "Two clips are acceptable: one of a glass filling, one of a full glass with the crema layer standing still."}}, "sound": "Optional: a rest of about 1.5 s in the music at the cut into this card. If the chosen track has no natural rest here, lower the music by about 6 dB under this card instead.", "note": "The picture leads here; the sentence follows in c23.", "t": 104.5}, {"id": "c23", "beat": "b5", "d": 5.5, "kind": "편집", "lines": ["Under that pressure,", "the coffee's own oils", "rose as foam,"], "em": "oils", "src": "S2", "visual": {"type": "실사", "desc": "(앞 장면 계속) The glass is nearly full; the tan layer thickens on top of the dark liquid.", "carries": "The result the sentence explains: a second, lighter layer on top.", "frame": "근접", "events": 1}, "note": "S2: higher pressure 'resulted in essential oils and colloids from the coffee creating a mousse or crema on top'. 'Oils' is a simplification of 'essential oils and colloids'.", "t": 108.5}, {"id": "c24", "beat": "b5", "d": 5, "kind": "편집", "lines": ["and the drink", "was not sold", "as espresso."], "em": "not sold", "src": "S2", "visual": {"type": "실사", "desc": "(앞 장면 계속) The full glass stands still: dark below, tan above.", "carries": "The two layers side by side; the tan one is what needed a new name.", "frame": "근접", "events": 0}, "t": 114}, {"id": "c25", "beat": "b5", "d": 4, "kind": "이름", "lines": ["crema caffè"], "label": "“cream coffee”", "src": ["S2", "S4"], "visual": {"type": "타이포", "desc": "Dark frame. The two words alone at the center, larger than sentence cards.", "motion": "Camera: none / Subject: words fade in and hold / Cut: cut to the gauge"}, "note": "S2: 'the new beverage was renamed crema caffè, cream coffee, in order to distinguish it from the extractions produced by the pre-existing espresso machines'.", "t": 119}, {"id": "c26", "beat": "b6", "d": 6, "kind": "편집", "lines": ["In 1961 an electric pump", "replaced the arm", "and steadied the pressure."], "em": "electric pump", "label": "Faema E61", "src": ["S2", "S1"], "visual": {"type": "도해", "desc": "The gauge, right third (meta.cast 'gauge'): the needle sweeps up and settles exactly on the heavy mark, which now receives its label '9'. In the left third, ons": 0, "closed_da": 0, "title_seconds": null, "visual_types": {"실사": 9, "타이포": 5, "기록": 8, "도해": 7, "스톡": 1}, "emphasis_chain": ["fifty years", "instant", "1.5 bar", "one cup", "into production", "2 bar", "bitter", "a piston", "stopped", "a lever", "oils", "not sold", "electric pump", "six times", "fifty years"]}, "summary": {"실패": 0, "주의": 2, "통과": 31}}}, {"file": "desire-paths.json", "script": {"meta": {"title": "The Paths No One Planned | What 5,680 worn trails say to the people who draw the map", "lang": "en", "family": "D1", "family_reason": "One research finding (the first citywide count of desire lines, Foster & Newell 2019) delivered in 90 seconds with the result stated first. D2 was the other candidate, but the film reports who found what and what it changes, not how to recognize a concept. A1/A3 fit a belief-reversal better but are 4 to 6 minute forms.", "target_seconds": 90, "hook_mode": "리드", "lead": "In Detroit, two researchers mapped the footpaths that no one planned.", "logline": "Trails worn by walking are not damage to a plan: counted from the air, they are a record of where people need to go, and some planners pave them.", "audience_belief": "People who cut across the grass are breaking the design.", "axis_fact": "Virginia Tech said the dirt paths on its Drillfield 'were never a planned feature', and in the summer of 2014 it paved three of them.", "ending": {"type": "선언", "callback": "no one planned", "callback_kind": "낱말"}, "materials": "(1) Open-license live-action stock footage (Pexels, Pixabay, Mixkit, Coverr): lawns, footpaths, people walking, snow on a square, aerial views. (2) Vector graphics drawn over or beside the footage: paved line vs walked line, schematic maps, typography. No commissioned shooting, no generated images.", "sources": [{"id": "S1", "label": "Foster, A. & Newell, J. P., Detroit's lines of desire: Footpaths and vacant land in the Motor City, Landscape and Urban Planning 189, 260-273, 2019", "url": "https://css.umich.edu/publications/research-publications/detroits-lines-desire-footpaths-and-vacant-land-motor-city", "checked": "Abstract (on the authors' institute page, DOI 10.1016/j.landurbplan.2019.04.009): 'more than 5680 of these footpaths, totaling more than 150 miles (>240 km)'; method 'remote sensing and spatial analysis with physical audits and interviews'; desire lines 'visible from space'. Journal highlights (ScienceDirect, seen as a search excerpt) say 'citywide census found 5680 desire lines ... over 150 linear miles'. Discrepancy: 'more than 5680' (abstract) vs '5680' (highlights, press release). The script says 'at least 5,680' and 'more than 150 miles', true under both readings.", "status": "직접 확인 (초록과 서지. 논문 본문은 유료라 읽지 못함)"}, {"id": "S2", "label": "University of Michigan News (Michigan News), Visible from outer space, Detroit's unofficial pathways could play important role in land redevelopment, 24 Sep 2019", "url": "https://news.umich.edu/visible-from-outer-space-detroits-unofficial-pathways-could-play-important-role-in-land-redevelopment", "checked": "'mapped 5,680 unofficial footpaths in the city of Detroit, that's 157 linear miles of trails'; authors Joshua Newell (U-M) and Alec Foster (Illinois State); a marked-up aerial image was used as a guide and students documented sites on the ground in 2013; footpaths are 'residents' way of dealing with this reality, creating shortcuts to school, bus lines and other places they need to go'; the Newell quote on cards c10-c11, word for word.", "status": "직접 확인"}, {"id": "S3", "label": "Joel Kurth, In a changing Detroit, footpaths are vanishing across vast, empty lands, Bridge Michigan, 4 Oct 2019", "url": "https://bridgemi.com/urban-affairs/changing-detroit-footpaths-are-vanishing-across-vast-empty-lands", "checked": "The count is for 2010 ('5,680 footpaths ... totaling 157 miles in 2010'; satellite images of 2010 compared with 2016; footpaths declined 13 percent overall by 2016). 'The informal trails are known by urban planners as desire paths'. Paths run 'across vacant land'. Dissent recorded here: Donna Givens (Eastside Community Network) called the study 'patronizing' and 'a nostalgic, poverty porn exercise'.", "status": "직접 확인"}, {"id": "S4", "label": "Virginia Tech News, Dirt paths on Drillfield to be paved, 5 Aug 2014", "url": "https://news.vt.edu/articles/2014/08/080514-vpa-drillfieldpaths.html", "checked": "'three of the dirt pathways crossing the grass area are paved with asphalt' (announced, work to finish before the fall semester); 'The dirt paths were never a planned feature of the Drillfield. They evolved organically as students crossed the area over time'; the new paths 'will join five existing paved paths', five feet wide against twelve; 'a temporary fix'; reason given: mud tracked into buildings.", "status": "직접 확인 (vtx.vt.edu의 같은 글로 열람)"}, {"id": "S5", "label": "Virginia Tech News, Students join the team seeking to find a better path across the Drillfield, 8 Dec 2014", "url": "https://news.vt.edu/articles/2014/12/120814-vpa-drillfieldcommittee.html", "checked": "Confirms the paving happened: 'Several smaller paths were paved this past summer as a temporary remedy until a more permanent solution could be identified.' Gives 'several', not 'three'. Also 'The larger paths were first paved in the late 1970s' (Virginia Tech Magazine says the first two asphalt walks were poured in 1971; that date is not used).", "status": "직접 확인"}, {"id": "S6", "label": "University of Wisconsin-Madison News, Desire paths: the unofficial footpaths that frustrate, captivate campus planners, 24 Apr 2019", "url": "https://news.wisc.edu/desire-paths-the-unofficial-footpaths-that-frustrate-captivate-campus-planners", "checked": "Planners 'can either create an official path along it ..., insert an impediment to the alignment, or modify the topography'. Desire paths 'in the winter, are footsteps pressed into snow' (basis for the snow scene on c10-c11; no claim about planners reading snow is made).", he paving was called temporary.", "c10-c11: the quote is the researcher's interpretation, not a measured result, and is shown as a quote for that reason. Bridge Michigan (S3) records a local critic who called the study patronizing; the script therefore says 'across vacant lots' on c08 and does not present the trails as a good in themselves.", "Finland snowfall claim (planners visit parks after the first snow): every instance found traces back to a 2011 Royal Borough of Kensington and Chelsea document quoted second-hand; no Finnish source was found, so it is not used. The snow scene on c10-c11 shows footprints only.", "English periods: sentence-final cards carry a period so that the linter can tell closed cards from hand-off cards (see test-log).", "Manual check, overlap kept on c13: the diagram shows the same two choices the sentence names. It is kept because it teaches the sign (amber turning white) that c15 relies on; no unsourced extra claim was added to make the picture say more.", "Manual check, overlap kept on c07: the picture is a view from above and the sentence says 'overhead images'. The sentence is kept because the picture alone does not say that this was the method, and it carries the two methods that cannot be filmed.", "Manual check, axis fact: it sits at 66-76 s (the D1 'meaning' row), not in the middle of the film; the first 57 s belong to the finding. The D1 beat sheet has no earlier slot for it.", "Manual check, wording changed after the first lint run: sources call the imagery 'aerial' (press release), 'satellite' (Bridge) and 'remote sensing' (abstract), so the screen says 'overhead images' and the label says '2010 imagery'; 'vacant lots' became 'vacant land' to match the sources.", "Manual check, c10-c11: snow is brighter than white type. The clip must be overcast or dusk and graded down, or the quote will not read.", "Editor pass after skill 0.6.0: every live-action card here is a stand-in (스톡): the study's own imagery and the Drillfield are no arget_seconds": 89, "hook_mode": "정점", "logline": "Seoul removed a highway that carried over 100,000 vehicles a day to uncover a buried stream; the feared traffic disaster was milder than expected, the stream brought measurable gains, and it still has to be pumped full every day.", "audience_belief": "Remove a highway from the middle of a city and the traffic gets worse.", "axis_fact": "Twelve lanes of road (4 elevated + 8 at street level) were cut to four, on a corridor used by about 168,000 vehicles a day (Seoul Metropolitan Government, June 2003).", "ending": {"type": "사실", "callback": "every day", "callback_kind": "낱말"}, "materials": "Open-license live-action stock (Pexels, Pixabay, Mixkit, Coverr): Cheonggyecheon today, Seoul streets and traffic, generic elevated highway and demolition, people by water at night. Vector graphics: simple map, before/after cross-section, numbers, typography. No commissioned shooting, no generated images, no news archive footage.", "sources": [{"id": "S1", "label": "Seoul Metropolitan Government, 'Cheonggyecheon' (official English page), viewed 2026-11", "url": "https://english.seoul.go.kr/service/amusement/stream/1-cheonggyecheon", "checked": "Restoration period July 2003 to September 2005 (two years, three months); restored length 5.84 km; cost KRW 386.739 billion (as of 2005); covering project began after the 1950s.", "status": "직접 확인"}, {"id": "S2", "label": "Landscape Performance Series (Landscape Architecture Foundation), 'Cheonggyecheon Stream Restoration Project' case study brief", "url": "https://www.landscapeperformance.org/case-study-briefs/cheonggyecheon-stream-restoration-project", "checked": "3.6 miles (5.84 km); temperatures along the stream 3.3 to 5.9 C cooler than on a parallel road 4-7 blocks away; fish species 4 to 25 between 2003 and end of 2008; 'contributed to' a 15.1% increase in bus ridership and 3.3% in subway ridership in Seoul between 2003 and end of 2008; average 64,000 visitors daily; budget about $380 million. Note: the brief's '639%' is the ratio of all counted species after/before (626/98), not a rise 'from 62 to 864'; 62 to 308 is plants only.", "status": "직접 확인"}, {"id": "S3", "label": "Seoul Metropolitan Government newsroom (내 손안에 서울), '청계천 주변교통 걱정되시죠?', 2003-06-26", "url": "https://mediahub.seoul.go.kr/archives/138445", "checked": "Daily traffic 168,000 vehicles = Cheonggye elevated highway 102,000 (4 lanes, both directions) + Cheonggyecheon-ro 66,000 (8 lanes); works start July 1, 2003; the elevated highway is removed and only 4 of the 8 street lanes remain; the press was warning of '교통대란' (traffic chaos/disaster); the city's worst-case simulation had downtown speed falling from 21.0 to 18.3 km/h.", "status": "직접 확인"}, {"id": "S4", "label": "Seoul Solution (Seoul Metropolitan Government policy archive), 'Removal of Overpasses in Seoul to Improve the Cityscape & Transportation Environment', 2015", "url": "https://seoulsolution.kr/en/content/removal-overpasses-seoul-improve-cityscape-transportation-environment", "checked": "'The removal of this first overpass resulted in a better cityscape and traffic congestion was not as severe as had been expected'; 'some worried about severe congestion ... but the current condition near the stream is not severe'; Table 1 lists 13 overpasses removed after the Cheonggye Overpass, through July 2014. The same page lists the overpass as built in 1969 and calls it a '5 km stretch' (differs from other sources, see S8).", "status": "직접 확인"}, {"id": "S5", "label": "The Guardian, 'Everyone thought it would cause gridlock: the highway that Seoul turned into a stream', 2025-01-17", "url": "https://www.theguardian.com/world/2025/jan/17/seoul-cheonggyecheon-motorway-turned-into-a-stream", "checked": "Quote of local resident Park Byung-chul: 'Initially, everyone thought it would cause gridlock. But people adapted. Now we can't imagine the highway ever being here.'; start ceremony July 1, 2003; Lee Myung-bak won the 2002 mayoral electio s": "That there are two levels of road, and that something closed lies under the lower one.", "motion": "화면: static / 대상: amber marks drift along both levels / 넘김: hold into c04", "frame": "전경", "events": 1}, "note": "Seoul's June 2003 figures: 102,000 on the elevated highway + 66,000 on the street below = 168,000. ITDP (2003) gives 120,000 for the corridor. 'Over 100,000' for the highway is true under both. The diagram does not draw a number of vehicles to scale."}, {"id": "c04", "beat": "b1", "t": 12, "d": 2, "kind": "무문장", "lines": [], "visual": {"type": "도해", "desc": "(same cross-section) The gray deck and its piers lift out of the drawing and fade. The street and the dark box stay.", "carries": "The act itself: the upper level is gone.", "motion": "화면: static / 대상: deck lifts away / 넘김: cross-dissolve to the map", "frame": "전경", "events": 1}}, {"id": "c05", "beat": "b2", "t": 14, "d": 3, "kind": "표기", "lines": ["July 1, 2003", "Seoul, South Korea"], "src": ["S3", "S5"], "visual": {"type": "도해", "desc": "Map (cast: map): the Han River curve and one short amber line across the old center, north of the river.", "carries": "Where in the city the road runs and how short it is against the river.", "motion": "화면: static / 대상: the amber line draws in from west to east / 넘김: cross-dissolve", "frame": "전경", "events": 1, "text_in_picture": ["Han River"]}, "sound": "Piano enters: steady, flowing."}, {"id": "c06", "beat": "b2", "t": 17, "d": 4.5, "kind": "편집", "lines": ["A stream,", "buried by Seoul", "decades earlier"], "em": "decades earlier", "end": "명사", "label": "Cheonggyecheon · from 1958", "src": ["S1", "S8"], "visual": {"type": "도해", "desc": "Cross-section, deck already gone: the dark box under the street becomes see-through and a thin blue band of water shows inside it.", "carries": "Where the stream is: sealed in a box directly under the street the highway stood on.", "motion": "화면: slow push toward the box / 대상: blue appears inside the box / 넘김: hold into c07", "frame": "중간", "events": 1}, "note": "Dates differ: covering 1958-1978 (Seoul slides), 'in the 1960s' (Guardian), overpass built 1969 (Seoul Solution) or 1968-1976 (Seoul slides). 'Decades earlier' and 'from 1958' (start of covering) are true under all of them."}, {"id": "c07", "beat": "b3", "t": 21.5, "d": 5.5, "kind": "편집", "lines": ["To uncover it,", "the plan cut", "twelve lanes to four,"], "em": "four", "end": "넘김", "label": "Mayor Lee Myung-bak", "src": ["S3", "S5"], "visual": {"type": "도해", "desc": "Cross-section pulls back to full width. Twelve amber lane marks are counted across the deck outline and the street; eight fade, the street splits, and two lanes remain on each side of an open blue channel.", "carries": "Where the twelve lanes were, where the four that remain go, and what takes the place of the rest.", "motion": "화면: pull back to full width, then static / 대상: lanes fade, channel opens / 넘김: straight cut", "frame": "전경", "events": 2}, "note": "Calculated: 4 lanes on the elevated highway + 8 on Cheonggyecheon-ro = 12; 4 of the 8 street lanes remained (S3, the city's plan as of June 2003). Numbers are spelled out, so the automatic number check will not see this card.", "compare": true}, {"id": "c08", "beat": "b3", "t": 27, "d": 4, "kind": "편집", "lines": ["and many feared", "severe congestion."], "em": "severe congestion", "end": "끝맺음", "src": ["S4", "S5"], "visual": {"type": "스톡", "desc": "Evening street packed with stopped cars seen from behind, rows of red brake lights, shot from a footbridge or sidewalk. Darkened, lights kept to the lower third.", "carries": "What the feared outcome looks like.", "motion": "화면: locked off / 대상: cars creep / 넘김: straight cut", "frame": "전경", "events": 1, "footage": {"search": ["Seoul traffic jam night", "brake lights traffic jam", "rush hour traffic city"], "stand_in": true}}, "note": "Generic; not footage of 2003."}, {"id": "c09", "beat": "b4", "t": 31, "d": 4.5, "kind": "편집", "lines": ["The stream opened", "27 months later"], "em": "27 months", "end": "끝맺음", "label": "Oct. 1, 2005 · 3.6 miles", "src": ["S1", "S2", "S5", "S8"], "visual": {"type": "실사", "desc": "Daytime, the real Cheonggyecheon: shallow water running between stone walls below street level, people crossing on stepping stones, office towers above. Darkened; water in the lower third.", "carries": "What replaced the road, and its scale against the buildings.", "motion": "화면: slow lateral move along the water / 대상: people cross / 넘김: straight cut", "frame": "전경", "events": 1, "footage": {"search": ["Cheonggyecheon stream Seoul", "Cheonggyecheon stepping stones", "Seoul stream downtown"]}}, "sound": "Running water comes up under the piano.", "note": "Must be the real location. Calculated: July 1, 2003 to Oct. 1, 2005 = 27 months (S1 gives 'two years, three months')."}, {"id": "c10", "beat": "b4", "t": 35.5, "d": 4.5, "kind": "편집", "turn": true, "lines": ["But what followed", "was milder than feared:"], "em": "milder than feared", "end": "넘김", "label": "Source: Seoul Solution", "src": ["S4", "S8"], "visual": {"type": "스톡", "desc": "Daytime Seoul avenue with cars and buses moving steadily through a green light, shot from the sidewalk. Darkened; vehicles in the lower half.", "carries": "That traffic is moving.", "motion": "화면: locked off / 대상: traffic passes / 넘김: dim to near black for the quote", "frame": "전경", "events": 1, "footage": {"search": ["Seoul street traffic day", "Seoul avenue cars buses", "city traffic moving"], "stand_in": true}}, "note": "S4: 'traffic congestion was not as severe as had been expected'. A 2015 cost-benefit paper (S8) says congestion costs had been underestimated beforehand, so the card says 'milder than feared', not 'no jam'. The colon hands the card over to the resident's quote, which explains it."}, {"id": "c11", "beat": "b4", "t": 40, "d": 7.5, "kind": "인용", "voice": "인용", "lines": ["“Initially, everyone thought", "it would cause gridlock.", "But people adapted.”"], "attribution": "Park Byung-chul, local resident · The Guardian, 2025", "src": "S5", "quote_form": "줄임", "original": "“Initially, everyone thought it would cause gridlock,” said Park Byung-chul, a local resident. “But people adapted. Now we can’t imagine the highway ever being here.”", "visual": {"type": "타이포", "desc": "The previous street shot dimmed almost to black; quote in serif, same center position.", "motion": "화면: static / 대상: none / 넘김: straight cut", "events": 0}, "note": "Shortened at the end only (the third sentence is dropped), nothing removed from the middle. The Guardian published the quote in English; the interview language is not stated, so it may be the reporter's translation."}, {"id": "c12", "beat": "b4", "t": 47.5, "d": 5, "kind": "편집", "lines": ["Citywide, bus ridership", "rose about 15%"], "em": "15%", "end": "끝맺음", "label": "2003–2008", "src": "S2", "visual": {"type": "도해", "desc": "Dark ground. A single thin line rises gently from left to right across the lower third, marked 2003 at its start and 2008 at its end. No scale, no second line.", "carries": "That this is a change over five years, not a single day", "motion": "Camera: fixed / Subject: the line draws from left to right / Cut: none", "frame": "전경", "events": 1}, "note": "S2 says the project 'contributed to' a 15.1% rise in Seoul bus ridership; Seoul also reorganized its bus system in these years, so the card states the rise and does not credit it to the demolition alone. Rounded: 15.1% to 'about 15%'."}, {"id": "c13", "beat": "b4", "t": 52.5, "d": 5, "kind": "편집", "lines": ["The air along the water", "is over 3°C cooler,"], "em": "3°C cooler", "end": "넘김", "label": "5°F+ · vs. nearby streets", "src": ["S2", "S5"], "visual": {"type": "도해", "desc": "Map (cast: map) zoomed to the center: the line, now blue, and a parallel amber street a few blocks away. A cool tint spreads along the blue line only.", "carries": "What it is compared with: a parallel street a few blocks off, not the whole city.", "motion": "화면: static / 대상: tint spreads along the blue line / 넘김: straight cut", "frame": "중간", "events": 1}, "note": "S2 (2008 data): 3.3 to 5.9 C cooler than a parallel road 4-7 blocks away. S5 (Seoul Institute, reported 2025): 3.6 C cooler than nearby streets. 'Over 3 C' is true under both. Calculated: 3.3 C x 1.8 = 5.9 F, so '5 F+'. Tint width is illustrative; do not draw it as a measured area."}, {"id": "c14", "beat": "b4", "t": 57.5, "d": 5, "kind": "편집", "compare": true, "lines": ["and fish species went", "from 4 to 25"], "em": "25", "end": "끝맺음", "label": "2003 vs. 2008", "src": ["S2", "S8"], "visual": {"type": "실사", "desc": "Close shot down into clear shallow running water over stones, small fish holding against the current. Darkened; fish in the lower third.", "carries": "That the water is clear enough and alive.", "motion": "화면: locked off / 대상: fish hold and dart / 넘김: straight cut", "frame": "근접", "events": 1, "footage": {"search": ["Cheonggyecheon fish", "fish shallow stream clear water", "carp stream city"]}}, "note": "Prefer a clip shot at Cheonggyecheon; if generic, keep it close enough that no other location is recognizable."}, {"id": "c15", "beat": "b5", "t": 62.5, "d": 5, "kind": "편집", "lines": ["Seoul then removed", "over a dozen more", "elevated roads"], "em": "over a dozen more", "end": "끝맺음", "label": "16 by 2025", "src": ["S4", "S5"], "visual": {"type": "도해", "desc": "A row of small gray overpass icons in the lower third; they fade out one after another from left to right until the row is empty.", "carries": "The count as a row of things no longer there, and their shape: short overpasses, not full highways.", "motion": "화면: static / 대상: icons fade in sequence as one continuous move / 넘김: straight cut", "frame": "전경", "events": 1}, "note": "S4's table lists 13 overpasses removed after Cheonggye through July 2014; S5 says 16 other elevated highways by 2025. Draw 13 icons, not map positions (locations were not checked). 'A dozen' is spelled out, so the automatic number check will not see this card."}, {"id": "c16", "beat": "b6", "t": 67.5, "d": 5.5, "kind": "편집", "turn": true, "lines": ["But the street vendors", "who worked there", "were cleared out,"], "em": "cleared out", "end": "넘김", "label": "Source: Hong Kal", "src": ["S6", "S7"], "visual": {"type": "스톡", "desc": "A narrow Korean street market: stalls and hand carts under awnings, hands arranging goods, people seen from behind. No faces in close-up. Darkened.", "carries": "What kind of work lined the old road.", "motion": "화면: slow move down the row of stalls / 대상: hands and backs only / 넘김: straight cut", "frame": "중간", "events": 1, "footage": {"search": ["Seoul street market stall", "Korean market vendor hands", "street vendor cart Korea"], "stand_in": true}}, "note": "Generic; these are not the displaced vendors. S6 and S7 could not be opened (bot check, HTTP 403); wording follows the search excerpts: vendors 'evicted', area 'cleared ... by force'. The merchant relocation to Garden Five (S7) is left out for length."}, {"id": "c17", "beat": "b6", "t": 73, "d": 5, "kind": "편집", "lines": ["and the water", "does not arrive on its own"], "em": "on its own", "end": "끝맺음", "src": ["S5", "S8"], "visual": {"type": "실사", "desc": "The head of Cheonggyecheon: water pours over a built stone wall into the channel below street level. Darkened; the fall on the right third.", "carries": "That the water enters from a built outlet, not from a hillside.", "motion": "화면: locked off / 대상: water falls / 넘김: straight cut", "frame": "중간", "events": 1, "footage": {"search": ["Cheonggyecheon waterfall", "Cheonggye Plaza fountain", "Cheonggyecheon start"]}}, "note": "Must be the real location."}, {"id": "c18", "beat": "b6", "t": 78, "d": 2.5, "kind": "무문장", "lines": [], "visual": {"type": "실사", "desc": "Night at Cheonggyecheon: people walk the path beside the water under the bridge lights, reflections on the surface. Walkers small, on the left and right thirds.", "carries": "The stream <script>
