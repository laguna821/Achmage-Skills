<title>Espresso Is Older Than Its Crema (150 s)</title>
<style>

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px}

h2{font-size:20px;margin:36px 0 14px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px}

.bench{display:grid;grid-template-columns:minmax(0,46fr) minmax(0,54fr);gap:20px;align-items:start}
.player{position:sticky;top:66px}
.stage{position:relative;aspect-ratio:16/9;background:var(--stage);color:var(--stage-ink);border-radius:10px;overflow:hidden;container-type:inline-size;user-select:none}

.stage.v-illust{background:linear-gradient(135deg,#3b2b33,#191216)}
.stage.v-diagram{background-color:#101a2c;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:6.25% 11.11%}
.stage.v-typo{background:#090909}
.stage.v-stock{background:linear-gradient(135deg,#343434,#171717)}
.scene{position:absolute;left:3.2cqw;top:3cqw;max-width:52cqw;z-index:2}
.scene .vt{display:inline-block;font-size:1.5cqw;font-weight:700;letter-spacing:.04em;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:.6cqw;padding:.25cqw .9cqw;margin-bottom:.8cqw}
.scene .vd{font-size:1.75cqw;line-height:1.5;color:rgba(244,241,234,.78)}
.scene .vc{font-size:1.45cqw;line-height:1.45;color:rgba(244,241,234,.5);margin-top:.5cqw}
.tc{position:absolute;right:3cqw;top:3cqw;font-size:1.5cqw;color:rgba(244,241,234,.6);font-variant-numeric:tabular-nums;z-index:2;text-align:right}
.snd{position:absolute;left:3.2cqw;bottom:2.6cqw;font-size:1.4cqw;color:rgba(244,241,234,.5);max-width:60cqw;z-index:2}
.txt{position:absolute;z-index:3;left:8cqw;right:8cqw;top:50%;transform:translateY(-42%);text-align:center;font-size:4.2cqw;font-weight:600;line-height:1.5;letter-spacing:-.01em;text-shadow:0 .15cqw .8cqw rgba(0,0,0,.6)}
.txt.pos-low{top:auto;bottom:11cqw;transform:none}
.txt.pos-left{right:44cqw;text-align:left}
.txt.pos-right{left:44cqw;text-align:right}
.txt .ln{display:block;opacity:0;transform:translateY(.6cqw);transition:opacity .35s ease,transform .35s ease}
.txt .ln.on{opacity:1;transform:none}
.txt em{font-style:normal;color:var(--stage-em)}
.txt.k-title{font-size:6.4cqw;font-weight:800;letter-spacing:-.03em}
.txt.k-name{font-size:5.6cqw;font-weight:800;letter-spacing:-.02em}
.txt.k-quote{font-family:var(--serif);font-weight:500;font-size:3.7cqw}
.corner{position:absolute;right:3cqw;bottom:6cqw;max-width:46cqw;text-align:right;font-size:1.7cqw;line-height:1.45;color:rgba(244,241,234,.82);z-index:3;opacity:0;transition:opacity .4s ease}
.corner.on{opacity:1}
.txt.k-label{font-size:2.1cqw;font-weight:500;color:rgba(244,241,234,.85);top:auto;bottom:6cqw;left:auto;right:4cqw;transform:none;text-align:right}
.txt.v-mono{font-family:var(--hand);font-size:4.6cqw;font-weight:400;color:#ffe9c9}
.txt .att{display:block;margin-top:1.4cqw;font-family:var(--sans);font-size:1.8cqw;font-weight:400;color:rgba(244,241,234,.7)}
.silent{position:absolute;left:0;right:0;bottom:11cqw;text-align:center;font-size:1.5cqw;letter-spacing:.2em;color:rgba(244,241,234,.35);z-index:2}
.turnmark{position:absolute;right:3cqw;bottom:2.6cqw;font-size:1.4cqw;color:var(--stage-em);z-index:2;letter-spacing:.08em}

.ctrl{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:#bdb5a6}
.btn.play{background:var(--ink);color:#fff;border-color:var(--ink);min-width:74px}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);margin-left:auto}
select.btn{padding-right:8px}
.track{position:relative;margin-top:10px;cursor:pointer}
.beats{display:flex;height:26px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.beat{position:relative;background:var(--panel);border-right:1px solid var(--line);font-size:11px;line-height:24px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#4a453e;min-width:0}
.beat:nth-child(even){background:var(--soft)}
.beat:last-child{border-right:0}
.ticks{display:flex;height:9px;margin-top:3px;border-radius:3px;overflow:hidden}
.tick{min-width:0;border-right:1px solid var(--paper)}
.tick.k-edit{background:#8d867a} .tick.k-quote{background:var(--accent)} .tick.k-title{background:var(--ink)} .tick.k-name{background:#4b4740} .tick.k-label{background:#c9c2b4} .tick.k-silent{background:#e3ddd0}
.tick.turn{box-shadow:inset 0 -3px 0 var(--stage-em)}
.head{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--accent);pointer-events:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.hint{font-size:12px;color:var(--muted);margin-top:8px}

.sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 90px)}
table{border-collapse:collapse;width:100%;font-size:13.5px;table-layout:fixed}
col.w-time{width:62px} col.w-text{width:29%} col.w-kind{width:64px} col.w-vis{width:auto} col.w-note{width:17%} col.w-flag{width:11%}
td{overflow-wrap:anywhere}
thead th{position:sticky;top:0;background:#efeadf;text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);z-index:1}
td{padding:9px 10px;border-bottom:1px solid var(--soft);vertical-align:top}
tr.card{cursor:pointer}
tr.card:hover td{background:#faf6ee}
tr.card.cur td{background:#fbf0d9}
tr.beatrow td{background:#efeadf;font-size:12.5px;color:#4a453e;padding:6px 10px;border-bottom:1px solid var(--line)}
tr.beatrow b{color:var(--ink);margin-right:8px}
.c-time{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
.c-time b{display:block;color:var(--ink);font-weight:600}
.c-text{min-width:0}
.c-text .l{display:block;font-size:15px;font-weight:600;line-height:1.5}
.c-text em{font-style:normal;color:var(--accent);background:linear-gradient(transparent 62%,#f6dcc9 62%)}
.c-text.q .l{font-family:var(--serif);font-weight:500}
.c-text.lab .l{font-size:13px;font-weight:500;color:#4a453e}
.c-text.ttl .l{font-size:18px;font-weight:800}
.c-text .att{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.c-text .none{color:#a9a294;font-size:13px}
.kind{display:inline-block;font-size:11.5px;border-radius:4px;padding:1px 7px;border:1px solid var(--line);white-space:nowrap;color:#4a453e}
.kind.k-quote{border-color:#e2bfae;color:var(--accent)}
.kind.k-title{background:var(--ink);color:#fff;border-color:var(--ink)}
.kind.k-name{background:#4b4740;color:#fff;border-color:#4b4740}
.c-text.nm .l{font-size:17px;font-weight:800}
.c-text .lab{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.c-text .lab::before{content:"구석 표기  ";color:#a39b8c}
.c-text .orig{display:block;font-size:11.5px;color:#a39b8c;margin-top:3px;font-style:italic}
tr.beatrow .div{display:block;color:var(--muted);font-size:12px;margin-top:2px}
tr.beatrow .div i{font-style:normal;color:#a39b8c;margin-right:4px}
.kind.k-silent{color:#a9a294}
.meta-s{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.turn{display:inline-block;font-size:11px;color:#7a5a00;background:#fbefc8;border-radius:4px;padding:0 6px;margin-top:3px}
.vtype{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:#3d3933;margin-bottom:2px}
.vtype i{width:9px;height:9px;border-radius:2px;display:inline-block}
.sw-live{background:#3b545c}.sw-archive{background:#7a633f}.sw-reenact{background:#4a5170}.sw-illust{background:#7b4f63}.sw-diagram{background:#24406f}.sw-typo{background:#111}.sw-stock{background:#777}
.c-vis .carr{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.c-vis .carr::before{content:"장면이 맡는 것  ";color:#a39b8c}
.c-note{font-size:12.5px;color:#4a453e}
.c-note .s{display:block;color:var(--muted)}
.c-note .memo{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px;color:#6d675e}
.c-note .memo:hover{-webkit-line-clamp:unset}
.c-note .src{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;color:var(--muted)}
.flag{display:inline-block;font-size:11px;border-radius:4px;padding:0 6px;margin:0 3px 3px 0;white-space:nowrap}
.flag.warn{background:#fbf2d6;color:var(--warn)} .flag.fail{background:#fbe5e3;color:var(--fail)}
.c-flag{min-width:0}
.flag{white-space:normal}

.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.metric b{display:block;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.metric span{font-size:12px;color:var(--muted)}
.metric small{display:block;font-size:11.5px;color:#a39b8c;margin-top:2px}
.lintgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 0}
.box h3{font-size:13px;margin:8px 16px 6px;color:var(--muted);font-weight:600}
.rule{display:grid;grid-template-columns:52px 124px 1fr;gap:10px;padding:8px 16px;border-top:1px solid var(--soft);font-size:13.5px;align-items:baseline}
.rule:first-of-type{border-top:0}
.lv{font-size:12px;font-weight:700}
.lv.ok{color:var(--ok)} .lv.warn{color:var(--warn)} .lv.fail{color:var(--fail)}
.rule .nm{color:#3d3933;font-weight:600}
.rule .cards a{font-size:12px;margin-right:6px;text-decoration:none;border-bottom:1px dotted var(--accent);cursor:pointer}
details.passed summary{cursor:pointer;padding:8px 16px;font-size:13px;color:var(--muted);border-top:1px solid var(--soft)}
.manual{list-style:none;margin:0;padding:0 16px 10px}
.manual li{padding:6px 0;border-top:1px solid var(--soft);font-size:13.5px;display:flex;gap:8px}
.manual li:first-child{border-top:0}
.manual input{margin-top:4px;accent-color:var(--accent)}
.chain{padding:4px 16px 12px;font-size:14px;line-height:1.9}
.chain span{background:linear-gradient(transparent 62%,#f6dcc9 62%);margin-right:4px}
.chain i{color:#b8b0a1;font-style:normal;margin-right:4px}
.notes{padding:0 16px 10px;margin:0 0 0 18px;font-size:13.5px}
.sources{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 18px}
.source{padding:10px 0;border-top:1px solid var(--soft);font-size:13.5px;display:grid;grid-template-columns:40px 1fr;gap:10px}
.source:first-child{border-top:0}
.source .id{font-weight:700;color:var(--muted)}
.source .ck{color:var(--muted);display:block}
footer{margin-top:50px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:1080px){.bench{grid-template-columns:1fr}.player{position:static}.sheet{max-height:none}.decisions{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:repeat(3,1fr)}.lintgrid{grid-template-columns:1fr}}
@media (max-width:640px){.wrap{padding:0 14px 60px}.decisions{grid-template-columns:1fr}.dcard.wide{grid-column:auto}h1{font-size:26px}.metrics{grid-template-columns:repeat(2,1fr)}.rule{grid-template-columns:44px 1fr}.rule .nm{grid-column:2}.rule .ms{grid-column:1/-1}}
@media print{.top,.ctrl,.track,.hint,.legend{display:none}.player{position:static}.sheet{max-height:none;overflow:visible}.bench{grid-template-columns:1fr}}
</style>

<script>const DATA = {"title": "Espresso Is Older Than Its Crema (150 s)", "built": "2026-11-12 17:20", "families": {"A1": "에세이형", "A2": "사건에서 개념으로", "A3": "다시 보기", "B": "사건 중계형", "C": "인물·사물 서사형", "D1": "발견 전달형", "D2": "개념 설명형", "L": "구획형"}, "cases": [{"file": "script.json", "script": {"meta": {"title": "Espresso Is Older Than Its Crema | How the espresso machine was invented, 1884 to 1961", "lang": "en", "family": "C", "family_reason": "It follows one object, the espresso machine, in strict time order from its first patent (1884) to the standard it works at today. At 150 seconds the belief-reversal families (A1, A3: 4 to 6 minutes, withheld subject) do not fit; C covers 1 to 6 minutes and opens with the result.", "target_seconds": 150, "hook_mode": "리드", "lead": "The machine is older than the crema by more than fifty years", "logline": "The espresso machine was patented to make coffee instantly; the crema we now read as the mark of espresso arrived more than fifty years later, when a piston replaced steam, and it was first sold under a name other than espresso.", "audience_belief": "Espresso, crema and all, is an old Italian tradition that has always been made this way.", "axis_fact": "The pressure gauge: the first machines pushed water at about 1.5 bar and never passed 2, so they made no crema. Crema appears only after Achille Gaggia's piston (patent of Sept. 5, 1938; lever patent 1947), more than fifty years after the first patent of 1884, and it was sold as 'crema caffè' to set it apart from espresso. Today's standard is 9 bar.", "ending": {"type": "사실", "callback": "fifty years", "callback_kind": "낱말"}, "materials": "Open-license live-action stock (Pexels, Pixabay, Mixkit, Coverr): espresso extraction, cups, hands, lever machine. Vector graphics: pressure gauge, piston cutaway, timeline, typography. Public-domain patent drawings: Moriondo 1884 (Wikimedia Commons), Bezzera U.S. Patent 726,793 (1903). No commissioned shooting, no generated images.", "sources": [{"id": "S1", "label": "Jimmy Stamp, 'The Long History of the Espresso Machine', Smithsonian Magazine, 2012", "url": "https://www.smithsonianmag.com/arts-culture/the-long-history-of-the-espresso-machine-126012814/", "checked": "Moriondo granted a patent in 1884 for 'new steam machinery for the economic and instantaneous confection of coffee beverage'; boiler heated to 1.5 bar; 'purely a bulk brewer'. Early steam machines 'at best, two bars', 1.5 to 2 bar without burning the coffee; burnt or bitter taste. Gaggia a 'Milanese café owner'; lever raises pressure to 8 to 10 bar; crema comes with the lever machine. Faema E61 (1961): motorized pump, nine bar. Also says early machines made 'up to 1,000 cups of coffee per hour' (NOT used: S6 says 150) and that Pavoni bought the patents in 1903 (year not used: S6 gives a deed of 1 Sept. 1902).", "status": "직접 확인"}, {"id": "S2", "label": "Jonathan Morris, 'Making Italian Espresso, Making Espresso Italian', Food and History 8(2), 2010, pp. 155-183 (author's pre-print, University of Hertfordshire)", "url": "https://uhra.herts.ac.uk/id/eprint/2694/1/jm2.pdf", "checked": "pp. 8, 12-18 of the pre-print. The claim that espresso is an unchanging tradition 'does not stand up in historical terms'. Bezzera registered his patent in 1901; Pavoni's Ideale of 1905 was the first espresso machine in commercial production; both exhibited at the 1906 fair in Milan. Pre-war espresso was black, tasted bitter and burnt because of the steam, and 'lacked any of the mousse or crema topping' at around 1.5 bar. Gaggia, 'a Milanese bar owner', patented a rotating-handle piston in 1938, not manufactured; by 1941 Italy 'ceased to import coffee altogether'. 1947 lever patent with a spring: pressure 'from three to twelve atmospheres'; oils and colloids form the crema; the drink was renamed 'crema caffè' to distinguish it from espresso. Machine slogans 'Crema caffè naturale' and 'It works without steam'. 1961 Faema E61: electric pump, 'a relatively constant 9 bars'. INEI standard: 9 bar.", "status": "직접 확인"}, {"id": "S3", "label": "Luigi Bezzera, 'Coffee-Making Machine', U.S. Patent 726,793, patented April 28, 1903 (filed June 10, 1902)", "url": "https://patents.google.com/patent/US726793A/en", "checked": "Patent number, dates, title; heading 'LUIGI BEZZERA, OF MILAN, ITALY, ASSIGNOR TO DESIDERIO PAVONI, OF MILAN, ITALY'; drawing sheet headers; the quoted sentence 'By means of my appliance, on the other hand, the quantity of coffee necessary for a single cup is prepared separately, so that fresh coffee is always served.' Read in the Google Patents text and in the patent PDF (patentimages.storage.googleapis.com/dd/70/81/35aa2b0604438b/US726793.pdf). U.S. patent text and drawings of 1903 are in the public domain.", "status": "직접 확인"}, {"id": "S4", "label": "Gaggia Milano, 'Our History' (manufacturer's history page)", "url": "https://www.gaggia.com/our-history", "checked": "Patent no. 365726 filed Sept. 5, 1938 for 'Lampo': hot water pressure instead of steam, 'a soft layer of crema naturale'. Second patent (1947): lever and spring. 1948: first machine, Tipo Classica. Slogan on the machines: 'Crema caffè naturale - Funziona senza vapore'. DISAGREES with S2 on when crema first appears (1938 here, 1947 lever in S2): the script says 'more than fifty years', true for both (54 and 63).", "status": "직접 확인"}, {"id": "S5", "label": "Gaggia Professional (Evoca Group), 'About Gaggia'", "url": "https://gaggiaprofessional.evocagroup.com/en/about-gaggia", "checked": "1938 patent no. 365726 'for a steam-free coffee machine'; the 1947 lever reached '8-9 atmospheres'; machines bear the words 'Crema caffè naturale funziona senza vapore'. Lever pressure differs across S1 (8-10 bar), S2 (3-12 atm, rising and falling) and here (8-9 atm): no lever pressure figure is used on screen.", "status": "직접 확인"}, {"id": "S6", "label": "Elena Locatelli, 'La Pavoni. Dal 1905 macchine per il caffè' (company monograph, 2005), pp. 5-19", "url": "https://www.lapavoni.com/pdf/la_pavoni_monografia.pdf", "checked": "Official gazette of 13 Jan. 1904: Bezzera's patent 'Innovation in equipment designed to instantly prepare and serve coffee as a drink' (certificate of 5 June 1902) transferred to Desiderio Pavoni by deed of 1 Sept. 1902. Bezzera's machine worked at 1.5 atm. Ideale, 1905. Sign at the 1906 Milan fair: 'Bezzera L. Caffè Espresso'. Says the machines made 'up to 150 cups of coffee per hour' (disagrees with S1's 1,000: no cups-per-hour figure is used). Gives 19 November 1901 for Bezzera's filing where other secondary sources give 19 December: only the year 1901 is used.", "status": "직접 확인"}, {"id": "S7", "label": "Angelo Moriondo, patent drawing, Bollettino delle Privative Industriali, 1884 (Wikimedia Commons file page)", "url": "https://commons.wikimedia.org/wiki/File:Espresso-machine-first-patent-angelo-moriondo.jpg", "checked": "Image viewed: the sheet is headed 'Bollettino delle Privative Industriali - Anno 1884' and carries the printed title 'MORIONDO ANGELO. Nuovi apparecchi a vapore per la confezione economica ed istantanea del caffè in bevanda sistema A. Moriondo'. File description: patent vol. 33 no. 256, dated May 16, 1884. Marked public domain. The date May 16, 1884 rests on this file description and matching secondary pages; S1 confirms the year and the title.", "status": "직접 확인"}, {"id": "S8", "label": "Bezzera, 'Company History' (manufacturer's page)", "url": "https://www.bezzera.it/en/bezzera", "checked": "'1901 Luigi Bezzera patented espresso coffee machine'; first machine shown at the Milan International Fair in 1906. The page dates U.S. Patent 726,793 to 'May 28, 1902', which is the day Bezzera signed the specification; the patent record (S3) gives filing June 10, 1902 and grant April 28, 1903, and the script follows the record.", "status": "직접 확인"}, {"id": "S9", "label": "Italian Espresso National Institute (INEI), 'The Certified Italian Espresso and Cappuccino' (brochure, 2006)", "url": "https://olaszpresszo.hu/wp-content/uploads/2014/04/istituzionale_inei_hq_en.pdf", "checked": "PDF opened (pp. 1-3 read: the Institute, founded 1998, certificate Csqa n. 214 of 24 Sept. 1999). The parameter table 'Entry water pressure 9 bar ± 1' was confirmed from the search excerpt of this PDF and from S2, which reports the same INEI figure.", "status": "직접 확인 (수치 표는 검색 발췌와 S2로 확인)"}, {"id": "S10", "label": "Jonathan Morris, 'The Faema E61 Espresso Machine', Perspectives on History (American Historical Association), Dec. 23, 2020", "url": "https://www.historians.org/perspectives-article/the-faema-e61-espresso-machine-january-2021", "checked": "Search excerpt: the E61's electric volumetric pump passed water through the coffee 'under a constant nine bars of pressure, now the standard parameter for Italian espresso'. Used only as the most recent support (2020) for the present-tense card c27.", "status": "주소가 열리지 않음(403), 발췌로 확인"}], "cast": [{"id": "cup", "look": "Small white espresso cup on a dark counter, dark background, shot close from slightly above rim height so the surface of the coffee is visible. One continuous stock clip of an extraction, at least 12 seconds long.", "fixed": "The same clip is used in c01-c03 and again in c28-c29. The tan foam on the surface must be visible in every one of these cards; the cup sits in the lower third so the center stays dark for the text."}, {"id": "gauge", "look": "Flat vector pressure gauge: round dial, scale 0 to 12 bar, tick marks every 1 bar, heavier marks at 2 and 9. Amber needle. Dark ground.", "fixed": "Always in the right third, same size, in c08, c16, c20, c26, c27. The mark at 9 stays unlabeled until c26. In c20 the needle shows no fixed value."}, {"id": "patent sheets", "look": "Public-domain patent drawings inverted to pale lines on a dark ground: Moriondo 1884 (c05-c07), Bezzera U.S. 726,793 (c09-c13).", "fixed": "Never redrawn or cleaned up beyond inversion and dimming. The part a sentence is about is marked with an amber outline or underline only."}], "visual_code": [{"sign": "amber needle, amber fill, amber arc", "means": "water pressure, in bar"}, {"sign": "pale gray wisps", "means": "steam"}, {"sign": "amber outline or underline on a patent sheet", "means": "the part or the words this card's sentence is about"}, {"sign": "white timeline dot, filled", "means": "a patent or machine that was built"}, {"sign": "white timeline dot, hollow, and dashed gray line", "means": "patented but not built; years without production"}], "type_style": {"pos": "가운데", "face": "thin white sans-serif for editorial lines; serif for quotes (c11, c12, c21); corner labels in the same sans, small", "size": "about 5% of frame height (52-56 px at 1080p), centered, two lines; three-line cards keep the same size; name cards (c04, c15, c25) larger at the same position", "em": "one weight step heavier, no color change", "ground": "dark; stock footage and patent sheets graded down so the white type is the brightest thing on screen; the center of every picture is kept empty"}, "music_brief": {"mood": "hopeful, quietly sentimental; steady and flowing from start to end", "instruments": "solo piano", "tempo": "moderate and even, about 70-90 bpm, a continuous flowing pattern", "avoid": "drums and any percussion, vocals, added strings or pads, big crescendos, sudden stops", "in": "c01", "pause": "c22 앞 1.5초 (optional; if the chosen track has no natural rest there, lower the music by about 6 dB under c22 instead)", "out": "c30", "end": "Let the track reach its own ending on the last line (c29). The start is set in production once the track length is known."}, "review_notes": ["Manual check, scene and sentence: c23 'rose as foam' partly repeats what the glass shows; kept because the sentence's work is the cause (pressure, the coffee's own oils) and the foam is the grammatical end of that cause. c07 shows the Italian title while the sentence gives its English sense; kept as a translation of text in the picture.", "Manual c e alone and the music enters at 15.5 s; its ending lands on the last line."], "assumptions": ["Length: 150 seconds, taken from the brief ('about 150 seconds').", "Audience belief: the brief's suggestion was kept after research; Morris (S2) describes exactly this belief and says it does not stand up historically.", "Language of the file: on-screen text (lines, label, attribution) is English. Scene descriptions, carries, motion, notes and the design fields in meta are also written in English so that an English-language production and stock search can use them; fields whose values the skill defines as fixed Korean terms (kind, visual.type, hook_mode, ending.type, callback_kind, frame, quote_form, status, pos) keep the Korean values. Beat names keep the Korean names of the C beat sheet with an English gloss.", "Open-license live-action stock is typed as visual.type '스톡'; public-domain patent drawings as '기록'; vector graphics as '도해' or '타이포'.", "English reading time: the production floor in the card spec is defined for Korean only (characters/7 + 2 s). For English this script uses words/3 + 2 s as its own floor, plus 1.5 s on the card that carries an attribution.", "Music tempo (70-90 bpm) is the script's reading of 'steady, flowing'; the user gave mood, instrument and 'no drums' only.", "Arduino, Cremonese, Illy's Illetta and Cimbali are left out; no sentence in the script claims a count of inventors or that Gaggia worked alone."]}, "beats": [{"id": "b1", "name": "리드 (Lead)", "job": "State the result at once: the machine came first, the crema more than fifty years later.", "scene": "What crema is and where it sits: espresso running into a cup and the tan foam forming on top.", "text": "The order in time and the size of the gap (more than fifty years)."}, {"id": "b2", "name": "이름 (Name)", "job": "Give the protagonist's name right after the lead.", "scene": "Nothing but the name.", "text": "The name."}, {"id": "b3", "name": "시간순 전개 (In time order)", "job": "Go back to 1884 and walk forward: Moriondo's steam patent, Bezzera's single cup, Pavoni's production, the 1906 fair where the name appears.", "scene": "What the first machines looked like (the patent drawings themselves), which part made the single cup, the record's own words, how low 1.5 bar is on a dial.", "text": "Who, in which year, for what purpose (economical and instant; fresh for a single cup), and the pressure figure."}, {"id": "b4", "name": "심기 (Planting)", "job": "Plant the repeated fact that the climax will break: for three more decades the needle never passes 2 bar, and the coffee is burned.", "scene": "The needle trembling under the 2 mark while years pass; a cup of flat black coffee with nothing on top.", "text": "How long it lasted, the ceiling (2 bar), the cause (steam) and the taste (bitter)."}, {"id": "b5", "name": "꺾임 (Turn)", "job": "1938: a bar owner replaces steam with a piston. War stops it; in 1947 the lever and spring arrive. The crema appears, and it is not sold as espresso.", "scene": "How a piston pushes water through coffee; the nine-year gap on a timeline; a hand pulling a lever; the crema itself forming in a glass.", "text": "The years, the patent, why nothing was built (war, no coffee imports), the cause of the foam (pressure, the coffee's oils), and the name it was sold under."}, {"id": "b6", "name": "현재 (Now)", "job": "Close the technical story: the 1961 pump holds the pressure steady; 9 bar is today's standard, six times the first machine.", "scene": "The needle settling on 9 and the distance from 1.5 drawn as six steps.", "text": "The year, what replaced the arm, the standard figure and the ratio."}, {"id": "b7", "name": "결말 (Ending)", "job": "Pause, show the first cup again, and set the patent's own word 'instant' against the fifty years.", "scene": "The opening cup and its crema, unchanged.", "text": "One fact: built to be instant, over fifty years to make this."}, {"id": "b8", "name": "참고 자료 (Sources)", "job": "Name the sources on one label card. The one disagreement that touches the lead (first crema in 1938 or 1947) is shown earlier, in the corner label of c03.", "scene": "Small type on a dark frame.", "text": "Source names."}], "cards": [{"id": "c01", "beat": "b1", "d": 2.5, "kind": "무문장", "lines": [], "visual": {"type": "실사", "desc": "Close-up against a dark background: two thin streams of espresso run from a portafilter spout into a small white cup on a dark counter; a tan layer of foam builds on the surface. The cup sits in the lower third of the frame.", "carries": "What crema is and where it sits; the viewer sees it before any word names it.", "motion": "Camera: locked-off close-up / Subject: streams run, foam rises / Cut: none, the shot continues under c02", "frame": "근접", "events": 1, "callback": true, "footage": {"search": ["espresso pouring cup close up dark", "espresso extraction portafilter", "espresso shot crema macro"], "min_len": 12, "must": "dark background, no readable text or logo, crema visibly forming", "fallback": "Any dark-background close-up of espresso leaving the spouts; the cup itself may be out of frame."}}, "sound": "Music in on the first frame: solo piano, steady flowing pattern (see meta.music_brief). No sound effects.", "note": "One continuous clip of at least 12 s is needed for c01-c03; the same clip returns in c28-c29.", "t": 0}, {"id": "c02", "beat": "b1", "d": 4.5, "kind": "편집", "lines": ["The machine is older", "than the crema"], "visual": {"type": "실사", "desc": "(앞 장면 계속) Same shot: the streams thin out and the foam settles on the surface.", "carries": "Which machine and which crema: the picture shows both, the sentence only puts them in order.", "frame": "근접", "events": 1}, "t": 2.5}, {"id": "c03", "beat": "b1", "d": 5, "kind": "편집", "lines": ["by more than", "fifty years."], "em": "fifty years", "label": "1884 patent · crema 1938 or 1947", "src": ["S1", "S4", "S2"], "visual": {"type": "실사", "desc": "(앞 장면 계속) Same shot: the last drops fall and the full cup stands with its foam intact.", "carries": "The finished cup: the thing the fifty years were for.", "frame": "근접", "events": 1}, "note": "Calculation: 1938 - 1884 = 54 (S4: Gaggia dates the first 'crema naturale' to the 1938 patent); 1947 - 1884 = 63 (S2: crema comes with the 1947 lever). 'More than fifty' is true under both, and the corner label shows both years.", "t": 7}, {"id": "c04", "beat": "b2", "d": 3.5, "kind": "이름", "lines": ["The Espresso Machine"], "visual": {"type": "타이포", "desc": "Dark frame. The name alone at the center, larger than the sentence cards.", "motion": "Camera: none / Subject: the name fades in and holds / Cut: cut to the patent sheet"}, "t": 12}, {"id": "c05", "beat": "b3", "d": 3, "kind": "무문장", "lines": [], "visual": {"type": "기록", "desc": "Angelo Moriondo's 1884 patent sheet (public domain; Wikimedia Commons, File:Espresso-machine-first-patent-angelo-moriondo.jpg), inverted to pale lines on a dark ground. The whole sheet is in view; the tall boiler of Fig. 1 stands in the left third.", "carries": "The first machine's shape and age: a tall boiler with pipes and taps, hand-drawn in the 19th century.", "motion": "Camera: very slow drift toward the right / Subject: none / Cut: none, continues under c06", "text_in_picture": ["Bollettino delle Privative Industriali - Anno 1884", "MORIONDO ANGELO", "Nuovi apparecchi a vapore per la confezione economica ed istantanea del caffè in bevanda sistema A. Moriondo"], "frame": "전경", "events": 1}, "sound": "Music continues unchanged.", "t": 15.5}, {"id": "c06", "beat": "b3", "d": 6, "kind": "편집", "lines": ["In 1884, Angelo Moriondo", "patented a coffee machine", "driven by steam,"], "label": "Turin · patent of May 16", "src": ["S1", "S7"], "visual": {"type": "기록", "desc": "(앞 장면 계속) The same sheet in full view; the outline of the boiler in Fig. 1 brightens.", "carries": "How large the machine is: one big boiler, no cup-sized parts.", "frame": "전경", "events": 1}, "t": 18.5}, {"id": "c07", "beat": "b3", "d": 5, "kind": "편집", "lines": ["and at Milan's 1906 fair", "the sign read"], "src": ["S6", "S2", "S8"], "end": "넘김", "visual": {"type": "도해", "desc": "Dark frame. A thin white rectangle, shaped like a signboard, draws itself across the upper third and stays empty.", "carries": "That the next words are lettering on a sign, not the editor's sentence.", "motion": "Camera: none / Subject: the outline draws once / Cut: none, the outline stays under c15", "frame": "중간", "events": 1}, "t": 61.5}, {"id": "c15", "beat": "b3", "d": 3.5, "kind": "이름", "lines": ["Caffè Espresso"], "label": "Stand sign, Milan, 1906", "src": "S6", "visual": {"type": "타이포", "desc": "(앞 장면 계속) The two words appear at the center, larger than sentence cards; the signboard outline above fades out.", "motion": "Camera: none / Subject: words fade in and hold / Cut: cut to the gauge"}, "note": "S6: at the Milan fair of 1906 'the sign still provides for the words \"Bezzera L. Caffè Espresso\"'. No archive photograph is assumed; the words are set as type.", "t": 66.5}, {"id": "c16", "beat": "b4", "d": 5.5, "kind": "편집", "lines": ["For decades more,", "steam alone never", "passed 2 bar,"], "em": "2 bar", "src": ["S1", "S2"], "visual": {"type": "도해", "desc": "The gauge again, right third (meta.cast 'gauge'): the needle trembles just under the 2 mark and never crosses it, while small year numbers under the dial run from 1906 to 1938.", "carries": "The ceiling as a daily fact: how close to 2, how far from the unlabeled heavy mark at 9, and the years going by.", "motion": "Camera: none / Subject: needle trembles, years count up / Cut: cut to the cup", "frame": "중간", "events": 1}, "sound": "Music continues; no change at this beat.", "note": "Calculation: 1938 - 1906 = 32, 'decades more'. S1: the early machines 'could only conjure up, at best, two bars'; no machine brewed 'with more than 1.5-2 bars of pressure without burning the coffee'. S2: 'around 1.5 bar'. The subject is 'steam alone' because S2 also records attempts that did not rely on steam before 1938 (Illy's compressed-air Illetta, 1935); the sentence makes no claim about those.", "t": 70}, {"id": "c17", "beat": "b4", "d": 6.5, "kind": "편집", "lines": ["and the same steam", "burned the coffee", "and left it bitter."], "em": "bitter", "src": ["S2", "S1"], "visual": {"type": "스톡", "desc": "Top-down shot of plain black coffee in a white cup on a dark table: a flat black surface with no foam, a little steam rising. The cup sits in the lower right third.", "carries": "What was missing: a black surface with nothing on top.", "motion": "Camera: locked-off / Subject: steam drifts / Cut: cut to black, then the turn", "frame": "근접", "events": 1, "footage": {"search": ["black coffee cup top view dark", "black coffee steam dark background", "americano cup overhead"], "stand_in": true, "must": "no foam on the surface, no readable text"}}, "note": "S2: the pre-war drink 'was black, rather than brown, and tasted bitter and burnt - a consequence of the steam'; it 'lacked any of the mousse or crema topping'. S1: steam 'had the unfortunate side effect of imbuing the coffee with a burnt or bitter taste'.", "t": 75.5}, {"id": "c18", "beat": "b5", "d": 6, "kind": "편집", "turn": true, "lines": ["But in 1938,", "a Milan bar owner", "patented a piston."], "em": "a piston", "label": "Achille Gaggia · No. 365726", "src": ["S4", "S2", "S5"], "visual": {"type": "도해", "desc": "Vector cutaway on a dark ground, right third: a vertical cylinder in which a piston, turned down by a hand screw, presses a column of water (amber) through a puck of ground coffee. Pale gray steam wisps stay on the boiler side, outside the cylinder.", "carries": "The mechanism: a piston, not steam, does the pushing, and only water meets the coffee.", "motion": "Camera: none / Subject: the piston descends once / Cut: cut to the timeline", "frame": "중간", "events": 2}, "sound": "Music continues. Optional: if the track has a change of register or a new phrase, let it start here.", "note": "S4: patent no. 365726 filed Sept. 5, 1938, 'hot water pressure instead of steam'. S2: 'a rotating handle piston'. The cutaway is a schematic of the principle, not a copy of the patent drawing.", "t": 82}, {"id": "c19", "beat": "b5", "d": 5.5, "kind": "편집", "lines": ["Then war came,", "and Italy's coffee imports", "stopped altogether."], "em": "stopped", "label": "by 1941", "src": "S2", "visual": {"type": "도해", "desc": "A thin white timeline across the lower third: filled dots at 1884, 1901 and 1906, a hollow dot at 1938. From 1938 the line continues as a dashed gray stretch up to 1947.", "carries": "The gap: nine years in which the patent existed and no machine did.", "motion": "Camera: none / Subject: the dashed stretch draws from 1938 to 1947 / Cut: cut to the lever", "frame": "전경", "events": 1}, "note": "S2: 'By 1941 ... the country ceased to import coffee altogether'; the 1938 design was not manufactured commercially. Calculation for the scene: 1947 - 1938 = 9.", "t": 88}, {"id": "c20", "beat": "b5", "d": 6, "kind": "편집", "lines": ["In 1947: a lever", "and a spring", "to do the pushing"], "em": "a lever", "end": "명사", "src": ["S2", "S4"], "visual": {"type": "실사", "desc": "Side view of a hand pulling down the long lever of a chrome lever espresso machine; the machine stands in the left third, the background is dark and out of focus. The vector gauge is overlaid in the right third: its needle swings far past the 2 mark into the upper half of the dial.", "carries": "What a lever machine looks like in use, and that the pressure leaves the old ceiling far behind.", "motion": "Camera: locked-off / Subject: the lever comes down once; the needle swings up once / Cut: cut to dark", "frame": "중간", "events": 2, "footage": {"search": ["lever espresso machine pull", "barista pulling lever espresso", "manual lever coffee machine close up"], "must": "a hand pulling a real lever; any modern lever machine; no brand name in focus", "fallback": "If no clip of a hand pulling a lever is found, do not substitute another machine. Continue the cutaway of c18 and add a lever and a spring to the same cylinder."}}, "note": "The needle must not settle on a number: sources give 8-10 bar (S1), 8-9 atmospheres (S5) and 3 to 12 atmospheres rising and falling (S2). Any modern lever machine will do; the picture stands for the mechanism, not for the 1948 model.", "t": 93.5}, {"id": "c21", "beat": "b5", "d": 5, "kind": "인용", "voice": "인용", "lines": ["“It works without steam”"], "src": ["S2", "S4"], "attribution": "Slogan on Gaggia's lever machines", "quote_form": "번역", "original": "Funziona senza vapore", "visual": {"type": "타이포", "desc": "Dark frame. The slogan alone at the center, in the serif used for quotes.", "motion": "Camera: none / Subject: the line fades in and holds / Cut: cut to the glass"}, "note": "English wording as given in S2 ('It works without steam'); Italian original from S4 and S5 ('Crema caffè naturale - Funziona senza vapore').", "t": 99.5}, {"id": "c22", "beat": "b5", "d": 4, "kind": "무문장", "lines": [], "visual": {"type": "실사", "desc": "Close side view of a small glass espresso cup against a dark background: dark coffee rises in the glass and a tan layer of foam forms on top of it. The glass sits in the lower third.", "carries": "The crema itself, arriving: its color and its thickness, seen through the glass.", "motion": "Camera: locked-off close-up / Subject: the glass fills / Cut: none, continues under c23", "frame": "근접", "events": 1, "footage": {"search": ["espresso glass cup side view crema", "espresso shot glass pouring close up", "espresso layers glass dark background"], "min_len": 14, "must": "glass cup seen from the side so the two layers show; dark background", "fallback": "Two clips are acceptable: one of a glass filling, one of a full glass with the crema layer standing still."}}, "sound": "Optional: a rest of about 1.5 s in the music at the cut into this card. If the chosen track has no natural rest here, lower the music by about 6 dB under this card instead.", "note": "The picture leads here; the sentence follows in c23.", "t": 104.5}, {"id": "c23", "beat": "b5", "d": 5.5, "kind": "편집", "lines": ["Under that pressure,", "the coffee's own oils", "rose as foam,"], "em": "oils", "src": "S2", "visual": {"type": "실사", "desc": "(앞 장면 계속) The glass is nearly full; the tan layer thickens on top of the dark liquid.", "carries": "The result the sentence explains: a second, lighter layer on top.", "frame": "근접", "events": 1}, "note": "S2: higher pressure 'resulted in essential oils and colloids from the coffee creating a mousse or crema on top'. 'Oils' is a simplification of 'essential oils and colloids'.", "t": 108.5}, {"id": "c24", "beat": "b5", "d": 5, "kind": "편집", "lines": ["and the drink", "was not sold", "as espresso."], "em": "not sold", "src": "S2", "visual": {"type": "실사", "desc": "(앞 장면 계속) The full glass stands still: dark below, tan above.", "carries": "The two layers side by side; the tan one is what needed a new name.", "frame": "근접", "events": 0}, "t": 114}, {"id": "c25", "beat": "b5", "d": 4, "kind": "이름", "lines": ["crema caffè"], "label": "“cream coffee”", "src": ["S2", "S4"], "visual": {"type": "타이포", "desc": "Dark frame. The two words alone at the center, larger than sentence cards.", "motion": "Camera: none / Subject: words fade in and hold / Cut: cut to the gauge"}, "note": "S2: 'the new beverage was renamed crema caffè, cream coffee, in order to distinguish it from the extractions produced by the pre-existing espresso machines'.", "t": 119}, {"id": "c26", "beat": "b6", "d": 6, "kind": "편집", "lines": ["In 1961 an electric pump", "replaced the arm", "and steadied the pressure."], "em": "electric pump", "label": "Faema E61", "src": ["S2", "S1"], "visual": {"type": "도해", "desc": "The gauge, right third (meta.cast 'gauge'): the needle sweeps up and settles exactly on the heavy mark, which now receives its label '9'. In the left third, a line icon of a small pump wi <script>

  function beatsRange(c){

    var cs=cardsOf(c), flags=c.lint.flags||{}, bmap={};
    (c.script.beats||[]).forEach(function(b){ bmap[b.id]=b; });
    var h='<div class="sheet" id="sheet"><table><colgroup><col class="w-time"><col class="w-text"><col class="w-kind"><col class="w-vis"><col class="w-note"><col class="w-flag"></colgroup><thead><tr><th>시각</th><th>화면 문장</th><th>구분</th><th>장면 제안</th><th>소리, 출처, 메모</th><th>검수</th></tr></thead><tbody>';
    var lastBeat=null;
    cs.forEach(function(k,i){
      if(k.beat!==lastBeat){ var b=bmap[k.beat]||{name:k.beat,job:''}; h+='<tr class="beatrow"><td colspan="6"><b>'+esc(b.name)+'</b>'+esc(b.job||'')+((b.scene||b.text)?'<span class="div"><i>장면이 말할 것</i>'+esc(b.scene||'')+'　<i>문장이 말할 것</i>'+esc(b.text||'')+'</span>':'')+'</td></tr>'; lastBeat=k.beat; }
      var kt=KT[k.kind]||'edit', v=k.visual||{}, vt=VT[v.type]||'stock';
      var cls=k.kind==='인용'?' q':k.kind==='표기'?' lab':k.kind==='제목'?' ttl':k.kind==='이름'?' nm':'';
      var text=(k.lines&&k.lines.length)?k.lines.map(function(l){return '<span class="l">'+lineHtml(l,k.em)+'</span>';}).join(''):'<span class="none">(문장 없이 장면만)</span>';
      if(k.attribution) text+='<span class="att">'+esc(k.attribution)+(k.quote_form&&k.quote_form!=='원문'?' ('+esc(k.quote_form)+')':'')+'</span>';
      if(k.original) text+='<span class="orig">'+esc(k.original)+'</span>';
      if(k.label) text+='<span class="lab">'+esc(k.label)+'</span>';
      var note='';
      if(k.sound) note+='<span class="s">소리: '+esc(k.sound)+'</span>';
      if(k.src) note+=[].concat(k.src).map(function(s){return '<span class="src">'+esc(s)+'</span>';}).join('');
      if(k.note) note+='<span class="memo" title="'+esc(k.note)+'">'+esc(k.note)+'</span>';
      var fl=(flags[k.id]||[]).map(function(f){return '<span class="flag '+LV[f.level]+'" title="'+esc(f.code)+'">'+esc(f.title)+'</span>';}).join('');
      h+='<tr class="card" id="row-'+esc(k.id)+'" data-i="'+i+'"><td class="c-time"><b>'+fmt(+k.t||0)+'</b>'+(+k.d||0)+'초<span class="meta-s">'+esc(k.id)+'</span></td>';
      h+='<td class="c-text'+cls+'">'+text+'</td>';
      h+='<td><span class="kind k-'+kt+'">'+esc(k.kind)+'</span>'+(k.voice&&k.voice!=='서사'?'<span class="meta-s">'+esc(k.voice)+'</span>':'')+(k.turn?'<br><span class="turn">꺾임</span>':'')+'</td>';
      h+='<td class="c-vis"><span class="vtype"><i class="sw-'+vt+'"></i>'+esc(v.type||'')+'</span><br>'+esc(v.desc||'')+(v.motion?'<span class="meta-s">움직임: '+esc(v.motion)+'</span>':'')+(v.frame?'<span class="meta-s">화면 범위: '+esc(v.frame)+'</span>':'')+(v.events!==undefined?'<span class="meta-s">사건 수: '+esc(String(v.events))+'</span>':'')+(v.text_in_picture&&v.text_in_picture.length?'<span class="meta-s">화면 속 글자: '+esc(v.text_in_picture.join(', '))+(v.legible===false?' (아직 읽히지 않게)':'')+'</span>':'')+(v.footage?'<span class="meta-s">찾을 영상: '+esc((v.footage.search||[]).join(', '))+(v.footage.reuse?' (다시 씀: '+esc(v.footage.reuse)+')':'')+(v.footage.stand_in?' · 대역':'')+(v.footage.min_len?' · '+esc(String(v.footage.min_len))+'초 이상':'')+(v.footage.must?' · 꼭: '+esc(v.footage.must):'')+(v.footage.fallback?' · 없으면: '+esc(v.footage.fallback):'')+(v.footage.source?' · 찾음: '+esc(v.footage.source):'')+'</span>':'')+(v.overlay?'<span class="meta-s">위에 겹칠 그림: '+esc(v.overlay)+'</span>':'')+(v.carries?'<span class="carr">'+esc(v.carries)+'</span>':'')+'</td>';
      h+='<td class="c-note">'+note+'</td><td class="c-flag">'+fl+'</td></tr>';
    });
    return h+'</tbody></table></div>';
  }

  function lintView(c){
    var m=c.lint.metrics, u=m.unit, res=c.lint.results, meta=c.script.meta||{};
    var h='<div class="metrics">';
    function met(v,label,sub){ return '<div class="metric"><b>'+v+'</b><span>'+label+'</span>'+(sub?'<small>'+sub+'</small>':'')+'</div>'; }
    h+=met(fmt(m.total_seconds),'전체 길이','목표 '+fmt(m.target_seconds||0));
    h+=met(m.cards_edit+'장','편집 문장 카드','인용 '+m.cards_quote+'장');
    h+=met(m.edit_size+u,'편집 문장 총량','초당 '+m.density+u);
    h+=met(m.avg_card_size+u,'카드 한 장 평균','평균 '+m.avg_card_seconds+'초 노출');
    h+=met((m.handoff_ratio!=null?m.handoff_ratio:m.open_ratio)+'%','다음 카드로 넘기는 카드','명사로 멈춤 '+(m.noun_ratio!=null?m.noun_ratio:'?')+'%, 끝맺음 '+(m.closed_ratio!=null?m.closed_ratio:'?')+'%');
    h+=met(m.cards_silent+'곳','문장 없는 구간','합계 '+m.silent_seconds+'초');
    h+='</div><div class="lintgrid"><div>';
    var bad=res.filter(function(r){return r.level!=='통과';}), good=res.filter(function(r){return r.level==='통과';});
    function rule(r){ return '<div class="rule"><span class="lv '+LV[r.level]+'">'+r.level+'</span><span class="nm">'+esc(r.title)+'</span><span class="ms">'+esc(r.msg)+(r.cards&&r.cards.length?' <span class="cards">'+r.cards.map(function(id){return '<a data-card="'+esc(id)+'">'+esc(id)+'</a>';}).join('')+'</span>':'')+'</span></div>'; }
    h+='<div class="box"><h3>자동 검수: 고치거나 판단할 것 '+bad.length+'건</h3>'+(bad.length?bad.map(rule).join(''):'<div class="rule"><span class="lv ok">통과</span><span class="nm">모두 통과</span><span class="ms">실패와 주의가 없다</span></div>');
    h+='<details class="passed"><summary>통과한 항목 '+good.length+'건 보기</summary>'+good.map(rule).join('')+'</details></div>';
    if(meta.review_notes&&meta.review_notes.length){ h+='<div class="box" style="margin-top:14px"><h3>주의를 그대로 둔 까닭</h3><ul class="notes">'+meta.review_notes.map(function(n){return '<li>'+esc(n)+'</li>';}).join('')+'</ul></div>'; }
    h+='</div><div>';
    h+='<div class="box"><h3>강조한 말만 차례로 읽기</h3><div class="chain">'+(m.emphasis_chain&&m.emphasis_chain.length?m.emphasis_chain.map(function(e){return '<span>'+esc(e)+'</span>';}).join('<i>/</i>'):'강조한 구절이 없다')+'</div></div>';
    h+='<div class="box" style="margin-top:14px"><h3>사람이 확인할 것 (자동 검수가 못 보는 것)</h3><ul class="manual">'+MANUAL.map(function(t){return '<li><input type="checkbox"><span>'+esc(t)+'</span></li>';}).join('')+'</ul></div>';
    return h+'</div></div>';
  }

  function sources(c){
    var s=(c.script.meta||{}).sources||[];
    if(!s.length) return '<div class="sources"><div class="source"><span class="id"></span><span>출처가 적혀 있지 않다</span></div></div>';
    return '<div class="sources">'+s.map(function(x){ return '<div class="source"><span class="id">'+esc(x.id)+'</span><span>'+esc(x.label)+(x.url?' <a href="'+esc(x.url)+'" target="_blank" rel="noopener">열기</a>':'')+(x.checked?'<span class="ck">확인한 내용: '+esc(x.checked)+'</span>':'')+(x.status?'<span class="ck">확인 방식: '+esc(x.status)+'</span>':'')+'</span></div>'; }).join('')+'</div>';
  }

  function render(){
    buildTabs();
    var c=DATA.cases[cur], m=c.script.meta||{}, s=c.lint.summary, fam=(DATA.families||{})[m.family]||'';
    var h='<section class="case-head"><div class="eyebrow"><b>'+esc(m.family)+' '+esc(fam)+'</b><span>'+fmt(total(c))+'</span><span>'+esc(c.file)+'</span></div>';
    h+='<div class="row"><div><h1>'+esc(String(m.screen_title||m.title).split(/\s*[|｜│]\s*/)[0])+'</h1><p class="pub-title">게시용 제목: '+esc(m.title)+'</p></div>';
    h+='<div class="sumrow" style="margin-bottom:14px"><span class="pill '+(s['실패']?'fail':'ok')+'">실패 '+s['실패']+'</span><span class="pill '+(s['주의']?'warn':'ok')+'">주의 '+s['주의']+'</span><span class="pill ok">통과 '+s['통과']+'</span></div></div></section>';
    h+='<h2><span class="n">1</span>가편집과 풀 시트 <small>왼쪽은 시간대로 재생, 오른쪽은 카드 전체. 행을 누르면 그 카드로 간다</small></h2><div class="bench">'+player(c)+sheet(c)+'</div>';
    h+='<h2><span class="n">2</span>설계 결정 <small>카드를 쓰기 전에 정한 것</small></h2>'+decisions(c);
    h+='<h2><span class="n">3</span>검수</h2>'+lintView(c);
    h+='<h2><span class="n">4</span>출처</h2>'+sources(c);
    h+='<footer>achmage-video-script 가편집 시트. 화면 문장은 실제 시간대로 뜨지만 장면은 글로 적은 제안이다.</footer>';
    app.innerHTML=h;
    bind(c); P.idx=-1; P.lines=-1; draw(c);
  }

  function findIdx(c,t){ var cs=cardsOf(c); for(var i=0;i<cs.length;i++){ var a=+cs[i].t||0, b=a+(+cs[i].d||0); if(t>=a&&t<b) return i; } return cs.length-1; }

  function draw(c){
    var cs=cardsOf(c); if(!cs.length) return;
    var T=total(c), t=Math.min(P.t,T), i=findIdx(c,t), k=cs[i], v=k.visual||{};
    var stage=document.getElementById('stage'), txt=document.getElementById('txt');
    if(i!==P.idx){
      P.idx=i; P.lines=-1;
      stage.className='stage v-'+(VT[v.type]||'stock');
      document.getElementById('scene').innerHTML='<span class="vt">'+esc(v.type||'')+'</span><div class="vd">'+esc(v.desc||'')+'</div>'+(v.motion?'<div class="vc">움직임: '+esc(v.motion)+'</div>':'');
      document.getElementById('snd').textContent=k.sound?('소리: '+k.sound):'';
      document.getElementById('turnmark').textContent=k.turn?'꺾임':'';
      document.getElementById('silent').textContent=(k.kind==='무문장')?'문장 없이 장면만':'';
      var cn=document.getElementById('corner'); cn.textContent=k.label||''; cn.classList.remove('on'); if(k.label){ setTimeout(function(){ cn.classList.add('on'); },60); }
      var cls='txt k-'+(KT[k.kind]||'edit')+' '+(POS[k.pos]||'');
      if(k.voice==='독백') cls+=' v-mono';
      txt.className=cls;
      var inner=(k.lines||[]).map(function(l){return '<span class="ln">'+lineHtml(l,k.em)+'</span>';}).join('');
      if(k.attribution&&k.kind==='인용') inner+='<span class="ln att">'+esc(k.attribution)+'</span>';
      txt.innerHTML=inner;
      Array.prototype.forEach.call(document.querySelectorAll('tr.card.cur'),function(r){r.classList.remove('cur');});
      var row=document.getElementById('row-'+k.id);
      if(row){ row.classList.add('cur'); var box=document.getElementById('sheet'); if(box&&box.scrollHeight>box.clientHeight){ var top=row.offsetTop-box.clientHeight*0.35; box.scrollTo({top:Math.max(0,top),behavior:P.playing?'smooth':'auto'}); } }
    }
    var lns=txt.querySelectorAll('.ln'), n=lns.length, el=t-(+k.t||0), d=+k.d||0.001;
    var step=n>1?Math.min(1.4,d/(n+1.2)):0, on=0;
    for(var j=0;j<n;j++){ if(el>=j*step-0.001) on=j+1; }
    if(on!==P.lines){ P.lines=on; for(var q=0;q<n;q++){ lns[q].classList.toggle('on',q<on); } }
    document.getElementById('tc').innerHTML=esc(k.id)+'<br>'+fmt(t);
    document.getElementById('time').textContent=fmt(t)+' / '+fmt(T);
    var tr=document.getElementById('track'); document.getElementById('head').style.left=(T?(t/T)*tr.clientWidth:0)+'px';
  }

  function tick(now){
    var c=DATA.cases[cur], T=total(c);
    if(!P.playing) return;
    var dt=(now-P.last)/1000; P.last=now; P.t+=dt*P.speed;
    if(P.t>=T){ P.t=T-0.001; draw(c); stop(); return; }
    draw(c); P.raf=requestAnimationFrame(tick);
  }
  function play(){ var c=DATA.cases[cur]; if(P.t>=total(c)-0.05) P.t=0; P.playing=true; P.last=performance.now(); document.getElementById('bPlay').textContent='멈춤'; P.raf=requestAnimationFrame(tick); }
  function stop(){ P.playing=false; cancelAnimationFrame(P.raf); var b=document.getElementById('bPlay'); if(b) b.textContent='재생'; }
  function seek(t){ var c=DATA.cases[cur]; P.t=Math.max(0,Math.min(t,total(c)-0.001)); draw(c); }
  function stepCard(dir){ var c=DATA.cases[cur], cs=cardsOf(c), i=findIdx(c,P.t)+dir; i=Math.max(0,Math.min(cs.length-1,i)); stop(); seek((+cs[i].t||0)+(+cs[i].d||0)-0.01); }

  function bind(c){
    document.getElementById('bPlay').onclick=function(){ P.playing?stop():play(); };
    document.getElementById('bFirst').onclick=function(){ stop(); seek(0); };
    document.getElementById('bPrev').onclick=function(){ stepCard(-1); };
    document.getElementById('bNext').onclick=function(){ stepCard(1); };
    var sp=document.getElementById('speed'); sp.value=String(P.speed); sp.onchange=function(){ P.speed=+sp.value; };
    var tr=document.getElementById('track');
    tr.onclick=function(e){ var r=tr.getBoundingClientRect(); seek(((e.clientX-r.left)/r.width)*total(c)); };
    Array.prototype.forEach.call(document.querySelectorAll('tr.card'),function(row){ row.onclick=function(){ var k=cardsOf(c)[+row.dataset.i]; stop(); seek((+k.t||0)+(+k.d||0)-0.01); }; });
    Array.prototype.forEach.call(document.querySelectorAll('a[data-card]'),function(a){ a.onclick=function(){ var id=a.dataset.card, cs=cardsOf(c); for(var i=0;i<cs.length;i++){ if(cs[i].id===id){ stop(); seek((+cs[i].t||0)+(+cs[i].d||0)-0.01); var row=document.getElementById('row-'+id); if(row){ document.getElementById('stage').scrollIntoView({block:'center'}); } break; } } }; });
  }
  document.addEventListener('keydown',function(e){
    var tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='select'||tag==='textarea') return;
    if(e.code==='Space'){ e.preventDefault(); P.playing?stop():play(); }
    else if(e.code==='ArrowRight'){ e.preventDefault(); stepCard(1); }
    else if(e.code==='ArrowLeft'){ e.preventDefault(); stepCard(-1); }
  });
  window.addEventListener('resize',function(){ draw(DATA.cases[cur]); });
  window.__sheet={ seek:seek, play:play, stop:stop, state:P };
  render();
})();
</script>
</body>
