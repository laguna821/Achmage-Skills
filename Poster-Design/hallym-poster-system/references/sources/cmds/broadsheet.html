<script id="design-docs" type="application/json">{"control-room": "# Control Room — DESIGN\n\n> [!info] 한 줄 정의\n> 계기판은 장식이 아니라 실제 텔레메트리다\n\n## 1. 언제 쓰나 / 쓰지 말 것\n\n세션·에이전트·로그·색인처럼 시스템이 스스로를 계측하는 이야기를 할 때. 어두운 강당·기술 청중·라이브 데모가 있는 강의에 맞다.\n\n- 엔진: `stage` · 계보: v7 Cinema → v13 Control Room · 원본: `v13-control-room`\n- 이 문서는 스타일 층만 기술한다. 발표 기능(P/F/N/A/T)과 마크업 계약은 덱 이식 계약과 덱 시스템 DESIGN가 정본.\n\n## 2. 시그니처 결정 5\n\n1. 계기판은 장식이 아니라 실제 텔레메트리다 — 스트립과 레일은 theme.js 훅으로 api.state()를 읽어 그린다\n2. 상단 56px 상태 스트립: 브랜드 · SLIDE nn/NN · STEP n/N · CLK · THEME · NOTES · LOG(마지막 이벤트 1건)\n3. 하단 64px 타임코드 바: TC 경과 시간 + 슬라이드 수만큼의 세그먼트(past dim · current accent×스텝 비율 · future line)\n4. 절제된 계기판 — 1px 괘선 · 패널 면 · 소문자 모노 라벨 · tabular-nums · 네온·스캔라인 없음\n5. 다크 우선(핑크 액센트) · 라이트는 관제실 조명을 켠 상태(밝은 회색 패널 위 그린)\n\n## 3. 토큰\n\n| 토큰 | 라이트 | 다크 |\n|------|--------|------|\n| `accent` | `#134538` | `#E985A2` |\n| `accentOn` | `#FFFFFF` | `#1B1B1B` |\n| `bg` | `#E3E5E1` | `#0B0C0D` |\n| `dim` | `#4B4F4A` | `#A3A7A1` |\n| `faint` | `#7E827D` | `#6B6F6A` |\n| `fg` | `#131513` | `#ECEDE9` |\n| `line` | `#C2C6C0` | `#2A2E33` |\n| `line2` | `#D4D7D2` | `#1E2226` |\n| `panel` | `#F1F2EF` | `#121416` |\n| `panel2` | `#FAFAF8` | `#181B1E` |\n\n- 스트립/레일 높이: `--cr-strip 56px` `--cr-tc 64px` (16:10 에서도 고정, 여분은 본문이 흡수)\n- 지면 여백: `--pad-x 120px` `--pad-t 40px` `--pad-b 36px` `--gap 28px`\n- 모든 계기 라벨은 모노 + `.14em` 자간 + `tabular-nums`\n\n## 4. 콘텐츠 클래스 → 이 테마의 해석\n\n| kind | 내용 | 해석 |\n|------|------|------|\n| `k-cover 01` | 표지 | 계기판이 부팅되는 화면, 스트립에 SLIDE 01/24 |\n| `k-section 03·09·14·20` | 섹션 표지 | 섹션 진입은 LOG 에 SECTION 이벤트로 남고 지면은 큰 활자만 |\n| `k-statement 04·17` | 선언 | 한 문장 + 하단 타임코드 |\n| `k-steps 05` | 4단 프로세스 | 4개 모듈 패널 |\n| `k-ladder 15` | 세로 사다리 | 세로 스택, 강조 행은 액센트 좌측 바 |\n| `k-grid 02·06·22` | 그리드 4열·3×3 | 계기 타일 그리드 |\n| `k-cards 21` | 카드 3장 | 카드 3장이 서브시스템 패널 |\n| `k-stats 07` | 카운터 통계 | 큰 수치 + 단위, tabular-nums |\n| `k-table 08·16` | 표 | 표는 텔레메트리 로그 테이블 |\n| `k-quote 10` | 인용 | 인용은 패널 위 큰 활자 |\n| `k-diagram 11` | SVG 도해 | 도해는 배선도 |\n| `k-compare 12` | 2열 대비 | 두 열이 A/B 채널 |\n| `k-terminal 13` | 터미널 | 터미널이 이 테마의 본거지 — 패널 면 그대로 |\n| `k-timeline 18` | 타임라인 5틱 | 타임라인이 타임코드 눈금과 같은 문법 |\n| `k-bars 19` | 가로 막대 | 막대가 게이지 |\n| `k-toggle 23` | 관점 토글 | 토글이 물리 스위치 |\n| `k-outro 24` | 아웃트로 | 세션 종료 로그 |\n\n## 5. 모션·순차 공개\n\n계기판은 애니메이션하지 않는다(값만 바뀐다). 본문 `[data-step]` 은 코어 기본 모션 + `--ease cubic-bezier(.2,.7,.2,1)`. LOG 는 마지막 1건만 표시하며 슬라이드·스텝·테마·모드·비율 변경 시 갱신.\n\n## 6. 크롬·진행 표시\n\n**상단 56px 상태 스트립** — 브랜드 · `SLIDE nn/NN` · `STEP n/N` · `CLK` · `THEME` · `NOTES` · `LOG`. **하단 64px 타임코드 바** — `TC` 경과 시간 + 슬라이드 수만큼의 세그먼트(지난 것 dim, 현재는 스텝 비율만큼 액센트, 남은 것 line). 둘 다 `theme.js` 가 `api.state()` 를 읽어 그리므로 실제 엔진 상태다.\n\n## 7. 금지\n\n- 네온·스캔라인·글로우 (원본 NOTES 의 금지 항목)\n- 계기판에 가짜 수치를 넣지 않는다 — 모든 값은 api 상태에서 온다\n- 스트립을 슬라이드 밖(코어 패널)으로 옮기지 않는다 — stage 모드에서 사라진다\n\n## 8. 복사해서 쓰는 법\n\n1. `themes/control-room/theme.css`(+`theme.js`)를 자기 프로젝트의 같은 경로에 둔다.\n2. 콘텐츠를 덱 이식 계약 §3의 슬라이드 종류로 쓴다. 이 테마가 특별히 요구하는 것: 슬라이드 수는 `api.slides.length` 로 자동 계산된다. 하드코딩된 24 는 없다.\n3. `python3 build.py --themes control-room` → `dist/control-room/index.html` 단일 파일. 검증은 `tools/verify.py` 4조합.\n\n## 9. 계보\n\n`v13-control-room` (3차 변주, 2026-09-09) → 최종 R1 이식. 원본 덱은 `../v13-control-room/index.html`에 그대로 보존돼 있다.\n", "typographic-poster": "# Typographic Poster — DESIGN\n\n## 1. 한 줄 정의\n슬라이드 한 장 = 스위스 활자 포스터 한 장. 헤드라인이 1700px 측정폭에 잠기고, 표·카드·차트는 1px 괘선의 활자 행으로 해체되며, 네 장의 색 면이 섹션 리듬을 만든다.\n\n## 2. 언제 쓰나 / 쓰지 말 것\n- **쓴다**: 한 장에 한 메시지를 던지는 강연·키노트. 선언·구조·리듬이 핵심인 발표. 인쇄(PDF) 배포까지 같은 파일로 끝내야 할 때.\n- **쓰지 말 것**: 한 장에 표 두 개·차트 두 개가 들어가야 하는 데이터 덱. 이미지·사진이 주인공인 덱(이 테마는 이미지 슬롯이 없다). 8줄 넘는 리스트가 흔한 콘텐츠(활자 행이 세로로 넘친다).\n\n## 3. 시그니처 결정 5개\n\n| # | 무엇 | 왜 | 어떻게 (CSS 값) |\n|---|------|----|----------------|\n| 1 | **측정폭 잠금** | 포스터의 활자는 격자 모서리에 닿아야 힘이 생긴다. 넘치지 않게 '줄이기만' 하면 폰트 폴백에도 안전하다 | `.slide{padding:72px 110px 40px}` → 콘텐츠 폭 1700. `.headline{white-space:nowrap}` + 종류별 상한 px(§4) + `theme.js fitHeads()`가 `scrollWidth > 1700`이면 비율만큼 축소 |\n| 2 | **무게 대비** | 800 헤드라인 옆에 400 리드, 그 옆에 21px 모노 라벨. 대비가 위계를 만든다 | `.headline{font-weight:800; line-height:1.02; letter-spacing:-.045em}` · `.lead{400 32px/1.42}` · `.kicker .tp-no .cell-no{mono 19~21px; letter-spacing:.14em}` |\n| 3 | **색 면 4장** | 섹션 디바이더가 그대로 솔리드 액센트 면. 라이트=그린+흰 글자, 다크=핑크+`#1B1B1B` | `.k-section{background:var(--accent); color:var(--accent-on)}` + 면 안의 `--fg/--dim/--line/--hair`를 `color-mix(accent-on N%)`로 재정의. 면 위 강조는 색 대신 밑줄 `.055em` |\n| 4 | **활자 행** | 표·카드·바 차트를 그리드 박스가 아니라 괘선 행으로. 강조 행은 여백까지 번지는 스트립 | 행 = `border-top:1px solid var(--fg)`(첫 줄) + `border-bottom:1px solid var(--line)`. 강조 = `.ladder .step.hi{margin:0 -110px; padding:30px 110px; background:var(--accent)}` |\n| 5 | **포스터 안의 진행 표시** | 크롬이 아니라 인쇄물에 찍히는 탤리 틱 + 시트 번호. JS가 없어도 남는다 | `theme.js`가 시트마다 `footer.tp-base` 주입: `.tp-ticks i{34×8px; gap 6}` N개(`api.slides.length`), `i.on` = 현재까지, `.tp-no{\"NN / N\"}` |\n\n## 4. 토큰\n\n### 4.1 색\n\n| 토큰 | Light | Dark | 용도 |\n|------|-------|------|------|\n| `--bg` | `#F3F1EA` | `#0F0F0E` | 시트 바탕 (색 면에서는 `--accent`) |\n| `--fg` | `#12110F` | `#F1EFE8` | 헤드라인·본문·괘선(굵은) |\n| `--dim` | `#5A5852` | `#A8A59D` | 리드 보조·라벨·각주 |\n| `--faint` | `#8F8C85` | `#6C695F` | 예비 |\n| `--line` | `#C9C6BD` | `#33322E` | 행 괘선 |\n| `--hair` | `#DEDBD2` | `#242320` | 탤리 틱 off · 바 트랙 |\n| `--accent` | `#134538` | `#E985A2` | 강조 활자 · 색 면 · 액센트 스트립 |\n| `--accent-on` | `#FFFFFF` | `#1B1B1B` | 색 면 위 글자 |\n\n터미널 블록만 테마 무관 `#0B0B0B` 바탕 + `#F2F0EB` 글자 + 핑크 프롬프트(v14 그대로).\n\n### 4.2 타이포 스케일 (px · 1920 기준 · 헤드라인은 상한이며 측정폭에 맞춰 줄어든다)\n\n| 요소 | 크기 |\n|------|------|\n| 표지 헤드라인 | 230 (2줄) |\n| 색 면 헤드라인 / `.sub` | 380 / 64 |\n| 선언(04 / 17) | 140 / 200 |\n| 4단(05) · 격자(02 / 06 / 21 / 22) · 터미널(13) | 150 · 200 / 150 / 150 / 102 · 150 |\n| 통계(07) · 표(08 / 16) · 인용(10) · 도해(11) | 140 · 110 / 92 · 140 · 160 |\n| 대비(12) · 사다리(15) · 시각표(18) · 막대(19) · 토글(23) · 아웃트로(24) | 140 · 130 · 120 · 110 · 170 · 180 |\n| 리드 | 32 (표지 36, 통계·막대 28) |\n| 셀 제목 / 단 제목 / 사다리 제목 | 52 (4열 46) / 52 / 56 |\n| 셀 본문·단 본문 | 24 |\n| 행 본문 (표·대비·리스트·막대) | 30 / 34 / 34 / 30 |\n| 거대 숫자 / 보조 숫자 | 250 / 100 |\n| 마스트·시트 번호·라벨 (모노) | 21 / 19 / 20 |\n| 각주 `.foot` / `.foot-src` | 22 / 19 mono |\n\n### 4.3 간격 · 선\n\n| 항목 | 값 |\n|------|----|\n| 여백 · 측정폭 · 거터 | 110 · 1700 · 20 (12열 123.33) |\n| 마스트 아래 / 블록 위 | `--mast-gap` 48 (16x10: 64) / `--block-gap` 36 (16x10: 48) |\n| 마스트 괘선 / 행 괘선 / 바닥 괘선 | 2px `--fg` / 1px `--line` / 1px `--line` |\n| 강조 단 상단선 | 3px `--accent` |\n| 탤리 틱 | 34×8, gap 6 |\n\n## 5. 콘텐츠 클래스 → 해석\n\n| kind | 해석 |\n|------|------|\n| `k-cover` | 마스트 + 230px 2줄 헤드라인 + 36px 리드. `.foot`은 바닥, `.foot-src` 앞에 액센트 원형 마크 |\n| `k-section` | **색 면**. 380px 상한 헤드라인(측정폭까지) + 64px `.sub` + 모노 28px 리드. `.tp-base`가 바닥으로 |\n| `k-statement` | 3줄 헤드라인(`em` = 액센트) + 리드 + `.body-list` 활자 행(`b` 266px 폭 라벨) |\n| `k-steps` | 4열, 각 열 `border-top 1px fg` + 모노 번호 + 52px 제목 + 24px 본문. `.hi`는 3px 액센트 상단선 |\n| `k-ladder` | `266 / 410 / 1fr` 3열 행 4개. `.hi` 행 = 여백까지 번지는 액센트 스트립 |\n| `k-grid` / `k-cards` / `k-outro` | 3·4열 괘선 셀. `.nine`은 3×3, `.constellation`·`.links` 제목은 모노(핸들·URL) |\n| `k-stats` | 첫 통계 = 250px 액센트 거대 숫자(좌 983px), 나머지 3개 = 100px 세로 행(우) |\n| `k-table` | thead = 모노 20px 라벨 행, 행 30px, 첫 열 모노 dim, `.hi` = 액센트 800 + 액센트 밑선 |\n| `k-quote` | 140px 상한 800 인용문(측정폭 잠금) + 모노 cite + 리드 |\n| `k-diagram` | SVG 1200×420 → 1700 폭. 층 rect 1.5px fg 테두리, 가운데(Wiki) 층은 액센트 면 + accent-on 글자. 화살표 3px 액센트, 라벨 14 단위 모노. lint 루프는 `--line` 1.5px |\n| `k-compare` | 2열 활자 행. `.a` 본문 dim, `.b h3` 액센트 |\n| `k-terminal` | 검은 블록 26px/1.75 모노. prompt 핑크 · dim 회색 · ok 흰 600 |\n| `k-timeline` | 5열. 시각 56px 모노, Lv 모노 액센트, 본문 24 |\n| `k-bars` | 행 `1fr / 600 / 120`. 라벨 30, 트랙 14px `--hair`, 채움 `--fg`(`.hi`는 액센트), 값 모노 30 |\n| `k-toggle` | 사각 버튼(pressed = fg 바탕) + 4열 72px 라벨 셀 + 34px 판정문(harness 뷰에서 액센트) |\n\n## 6. 모션 · 순차 공개\n- 시트 진입: 시트 전체 페이드 `.45s` + 직계 자식 `tpRise .6s`(22px 상승) 80ms 스태거 (nth-child 1~6). `.tp-base`는 제외.\n- `[data-step]`: 18px 상승 페이드 `.5s cubic-bezier(.2,.7,.2,1)` (코어 기본 12px를 덮어씀). SVG 안은 transform 없음.\n- `prefers-reduced-motion`: 라이즈·시트 페이드 모두 `animation:none`. 카운터·스텝은 코어가 처리.\n- 인쇄: 모든 애니메이션 `none !important`, `print-color-adjust:exact`(색 면이 찍힌다).\n\n## 7. 크롬 · 진행 표시\n- **마스트** = 콘텐츠의 `.kicker`를 재사용. 왼쪽 원문(아이브로우), 오른쪽 `::after{content:attr(data-tp-right)}` = `\"{섹션코드} / {섹션명}\"`(theme.js가 세팅). 2px `--fg` 괘선.\n- **바닥 괘선** = `footer.tp-base` (theme.js 주입, `aria-hidden`). 탤리 틱 N개 + `NN / N`. N은 `api.slides.length`.\n- 코어 패널은 `--dk-panel-bg`(bg 94%) `--dk-panel-fg` `--dk-panel-line` `--dk-font`(mono) `--dk-accent`로 재스킨만. stage 모드에서는 숨겨지므로 포스터 안의 진행 표시가 유일한 크롬이 된다.\n\n## 8. 금지 목록\n- 그라디언트·그림자·둥근 모서리(버튼 `border-radius:0`)·이모지·아이콘 SVG.\n- 헤드라인에 `white-space:normal` — 줄바꿈은 콘텐츠의 `<br/>`만. 자연 wrap을 허용하면 측정폭 잠금이 무너진다.\n- 색 면 위에서 액센트 색 강조(같은 색이라 사라진다) — 밑줄로.\n- 세 번째 색. 회색은 `--dim/--faint/--line/--hair` 4단만.\n- 표를 박스 그리드로 되돌리기 — 이 테마의 표는 항상 괘선 행이다.\n- 자체 키 리스너·슬라이드 이동 로직 — 코어 API만 읽는다.\n\n## 9. 복사해서 쓰는 법\n1. `theme.css` + `theme.js` + `theme.json`을 `themes/{slug}/`에 두고 `python3 build.py --themes {slug}` — 코어·콘텐츠는 손대지 않는다.\n2. 콘텐츠는 §5의 `k-*` 클래스 계약(CONTRACT.md §3)을 지키면 된다. 헤드라인 줄바꿈은 `<br/>`로 명시하고, 한 줄이 1700px을 넘으면 theme.js가 알아서 줄인다.\n3. 슬라이드 수가 바뀌어도 탤리 틱·시트 번호는 자동. 섹션 디바이더에 `k-section`을 붙이면 그 장이 색 면이 된다.\n\n마크업 계약 요약: `.slide.k-*` 안에 `.kicker`(마스트) → `.headline`(`<br/>`·`em`·`.sub`) → 본문 블록 → `.lead` → `.foot(.foot-note .foot-src)`. 순차 공개는 `[data-step]`, 카운터는 `[data-count]`.\n\n## 10. 계보 · 출처\n- 원본: `../v14-typographic-poster/index.html` + `NOTES.md` (v7 Cinema 고정 무대 계보 위의 스위스 포스터 변주, 2026-09-09).\n- 이식 대상: `final/core/deck-core.{css,js}` R1 + `final/content.html` 24장.\n- 시각 규약: DESIGN.md §1 CI 토큰 · §2 Anti-Slop.\n- 검증·잔여 이슈: 같은 폴더 `NOTES.md`.\n", "field-notebook": "# Field Notebook — DESIGN\n\n> [!info] 한 줄 정의\n> 책상 위 종이 한 장: 슬라이드마다 --frame 만큼 안쪽에 종이(--paper)가 놓이고 바깥은 책상(--desk) 색이다\n\n## 1. 언제 쓰나 / 쓰지 말 것\n\n연구·강의 자료처럼 '읽히는' 덱, 각주와 출처가 많은 발표에 쓴다. 화면 크기가 제각각인 자리(노트북 화면 공유·자유 비율)에서도 한 화면 한 장으로 스냅된다. 큰 무대의 시네마틱 연출이나 정확한 1920 캔버스 재현이 필요하면 stage 엔진 테마를 쓴다.\n\n- 엔진: `scroll` · 계보: v8 Blueprint (fluid scroll-snap) → v12 Field Notebook · 원본: `v12-field-notebook`\n- 이 문서는 스타일 층만 기술한다. 발표 기능(P/F/N/A/T)과 마크업 계약은 덱 이식 계약과 덱 시스템 DESIGN가 정본.\n\n## 2. 시그니처 결정 5\n\n1. 책상 위 종이 한 장: 슬라이드마다 --frame 만큼 안쪽에 종이(--paper)가 놓이고 바깥은 책상(--desk) 색이다\n2. 5mm 모눈: 20px 피치 SVG 선 패턴을 종이에 깔되 알파를 라이트 .05 · 다크 .038 로 낮춰 선이 아니라 질감으로만 읽힌다 (원본의 절반)\n3. 여백이 두 번째 지면: 본문 컬럼 | 우측 마진 컬럼 2단. .foot-note/.foot-src 와 data-source 는 본문에 없고 마진에 붙은 메모(※)로 산다\n4. 고무 스탬프 크롬: 좌상단 날짜·이름 스탬프(-1.6° 회전, 이중 테두리, 라이트에선 multiply), 우하단 페이지 스탬프 + 접힌 귀, 우측 가장자리 색인 탭\n5. 형광펜 강조: 강조는 색 글자가 아니라 --tint 띠(box-decoration-break: clone)와 .hi 행의 틴트 배경으로 처리한다\n\n## 3. 토큰\n\n| 토큰 | 라이트 | 다크 |\n|------|--------|------|\n| `accent` | `#134538` | `#E985A2` |\n| `accentOn` | `#FFFFFF` | `#1B1B1B` |\n| `desk` | `#DCD6C7` | `#0A0B0A` |\n| `dim` | `#525B55` | `#A7ADA4` |\n| `faint` | `#8A928B` | `#6F766F` |\n| `grid` | `rgba(19,69,56,.05)` | `rgba(233,133,162,.038)` |\n| `ink` | `#182019` | `#EDEEE8` |\n| `paper` | `#F5F1E6` | `#141614` |\n| `rule` | `#D5CEBC` | `#2B302B` |\n| `strip` | `#FBF9F2` | `#1B1E1B` |\n\n- 유동 단위: `--uw calc(--dk-w / 100)` `--u calc(--dk-h / 100)` — 모든 크기가 덱 프레임에 비례\n- 종이: `--frame clamp(12px, 1.1uw, 18px)` `--pad clamp(44px, 5uw, 96px)`\n- **모눈 알파 라이트 .05 / 다크 .038** (원본 .11 의 절반 이하 — 사용자 지적 반영)\n- 마진 컬럼: 본문 : 마진 = 약 3 : 1\n\n## 4. 콘텐츠 클래스 → 이 테마의 해석\n\n| kind | 내용 | 해석 |\n|------|------|------|\n| `k-cover 01` | 표지 | 노트 표지, 날짜 스탬프 |\n| `k-section 03·09·14·20` | 섹션 표지 | 간지 한 장 |\n| `k-statement 04·17` | 선언 | 본문 한 문단 + 마진 메모 |\n| `k-steps 05` | 4단 프로세스 | 4개 항목이 번호 매긴 관찰 기록 |\n| `k-ladder 15` | 세로 사다리 | 세로 목록, 강조 행은 형광펜 틴트 |\n| `k-grid 02·06·22` | 그리드 4열·3×3 | 모눈 위 표 형태 기록 |\n| `k-cards 21` | 카드 3장 | 카드 3장이 붙인 메모지 |\n| `k-stats 07` | 카운터 통계 | 측정값 기록 |\n| `k-table 08·16` | 표 | 표는 실험 기록표 |\n| `k-quote 10` | 인용 | 인용은 인용 카드(들여쓰기 + 좌측 규칙선) |\n| `k-diagram 11` | SVG 도해 | 도해는 손그림 스케치 영역 |\n| `k-compare 12` | 2열 대비 | 두 열이 대조 관찰 |\n| `k-terminal 13` | 터미널 | 터미널은 붙여넣은 로그 |\n| `k-timeline 18` | 타임라인 5틱 | 타임라인이 일지 |\n| `k-bars 19` | 가로 막대 | 막대가 측정 눈금 |\n| `k-toggle 23` | 관점 토글 | 토글이 관점 스위치 |\n| `k-outro 24` | 아웃트로 | 마지막 장 + 색인 탭 |\n\n## 5. 모션·순차 공개\n\n종이에 붙이듯 `[data-step]` 이 아래에서 짧게 올라온다. 스크롤 엔진이라 슬라이드 간 이동은 스냅.\n\n## 6. 크롬·진행 표시\n\n좌상단 고무 스탬프(날짜·이름, -1.6° 회전), 우하단 페이지 스탬프 + 접힌 귀, 우측 가장자리 색인 탭이 현재 섹션을 표시. **우측 마진 컬럼**이 이 테마의 핵심 — `.foot-note` `.foot-src` `data-source` 가 본문에서 빠져 마진 메모(※)로 산다.\n\n## 7. 금지\n\n- 모눈을 다시 진하게 하지 않는다 (사용자 지적)\n- 마진 메모를 본문 폭으로 늘리지 않는다\n- 손글씨 폰트 (CI 폰트 규칙)\n\n## 8. 복사해서 쓰는 법\n\n1. `themes/field-notebook/theme.css`(+`theme.js`)를 자기 프로젝트의 같은 경로에 둔다.\n2. 콘텐츠를 덱 이식 계약 §3의 슬라이드 종류로 쓴다. 이 테마가 특별히 요구하는 것: `data-source` 를 채우면 마진에 출처 메모가 자동으로 붙는다. 각주가 없는 슬라이드는 마진이 비어도 격자는 유지된다.\n3. `python3 build.py --themes field-notebook` → `dist/field-notebook/index.html` 단일 파일. 검증은 `tools/verify.py` 4조합.\n\n## 9. 계보\n\n`v12-field-notebook` (3차 변주, 2026-09-09) → 최종 R1 이식. 원본 덱은 `../v12-field-notebook/index.html`에 그대로 보존돼 있다.\n", "intertitle": "# Intertitle — DESIGN\n\n## 1. 한 줄 정의\n무성영화의 자막 카드. 1920 무대 안에 2.39:1 픽처 밴드(804px)를 두고, 위아래 검정 바가 씬 슬레이트·진행·각주를 나르며, 밴드 안에는 문장 하나가 정중앙에 선다. 공개는 컷이다.\n\n## 2. 언제 쓰나 / 쓰지 말 것\n- **쓴다** — 대활자 선언·인용·섹션 전환이 발표의 리듬인 강연. 한 화면에 한 문장을 크게 세우고 컷을 넘기며 말할 때. 다크 룸 투사.\n- **쓰지 말 것** — 표·그리드가 주가 되는 자료(밴드 높이 804px가 상한이라 8행 표·9칸 그리드가 한계다). 손에 들고 보는 PDF 핸드아웃(바 영역이 지면의 26%를 차지한다). 데이터 밀도가 높은 대시보드형 덱.\n\n## 3. 시그니처 결정 5개\n### 3.1 레터박스 밴드\n- **무엇** — 슬라이드 = 바(`--bars`) + 밴드(`--bg`). 밴드는 항상 804px, 바는 남는 세로를 흡수한다.\n- **왜** — 촬영된 프레임의 인상. 16:10에서도 밴드가 커지지 않고 바가 자라는 것이 레터박스의 자연스러운 동작이다.\n- **어떻게** — `--bar:138px`(16:9) / `198px`(16:10), `.slide::before{top:var(--bar);height:804px;background:var(--bg)}`, 슬라이드 패딩 `calc(var(--bar) + 34px + 30px) 100px`.\n### 3.2 씬 슬레이트\n- **무엇** — 상단 좌측 모노 `SC 05 · TAKE 02 / 04`. TAKE는 공개된 `[data-step]` 수, 분모는 전체 스텝 수(스텝 없는 장은 `01 / 01`).\n- **왜** — 발표자가 시연으로 화면을 나갔다 돌아와도 어느 컷인지 즉시 잡힌다.\n- **어떻게** — theme.js가 슬라이드마다 `header.it-top`을 주입, `slide`·`step` 훅에서 DOM의 `.in` 개수를 읽어 갱신.\n### 3.3 센터 대활자\n- **무엇** — 커버 144px · 섹션 140px · 선언 92px · 인용 80px · 나머지 52px. 전부 밴드 정중앙, 액센트는 `em`/`b` 한 조각.\n- **왜** — 자막 카드는 문장이 곧 화면이다. 콘텐츠 장도 같은 축(중앙 정렬)을 유지해 덱 전체가 한 장르로 읽힌다.\n- **어떻게** — `.headline{font:700 52px/1.12 var(--font-display);letter-spacing:-.035em;text-wrap:balance}` + kind별 크기 오버라이드.\n### 3.4 헤어라인 프레임\n- **무엇** — 밴드 안쪽 34px 인셋에 1px 선 하나. 셀·표·단계·타임라인도 전부 1px 헤어라인만 쓴다.\n- **왜** — 채움·그림자·그라디언트 없이 \"프레임 안\"을 만든다. Anti-Slop.\n- **어떻게** — `.slide::after{inset:calc(var(--bar)+34px) 34px;border:1px solid var(--line)}`, 셀 `border:1px solid var(--line)`.\n### 3.5 컷 공개와 릴\n- **무엇** — 스텝은 14px 상승 페이드로 들어오고, 리스트·타임라인에서는 지나간 컷이 dim으로 물러난다(릴 모드).\n- **왜** — v10의 \"교체형 자막\"을 코어 계약(모든 스텝 유지) 안에서 재현하는 방법. 최신 컷만 살아 있다.\n- **어떻게** — `html.js [data-step]{opacity:0;transform:translateY(14px)}` / `.in{opacity:1}`, `li[data-step].in:has(~ [data-step].in){color:var(--dim)}`.\n\n## 4. 토큰 표\n\n| 토큰 | Light | Dark | 용도 |\n|------|-------|------|------|\n| `--bars` | `#E6E1D5` | `#000000` | 상·하 바, body 배경 |\n| `--bg` | `#F6F3EC` | `#0B0B0B` | 픽처 밴드 |\n| `--fg` | `#1B1B1B` | `#F2F0EB` | 본문·대활자 |\n| `--dim` | `#5A574F` | `#A9A59D` | 리드·부연·지나간 컷 |\n| `--faint` | `#948F86` | `#6A6760` | 슬레이트·인덱스·표 헤더 |\n| `--line` | `#D5CFC2` | `#2A2825` | 헤어라인 전부 |\n| `--surface` | `#ECE8DE` | `#161513` | 도해 박스·다크 터미널 |\n| `--accent` | `#134538` | `#E985A2` | 단 하나의 강조색 |\n| `--accent-on` | `#FFFFFF` | `#1B1B1B` | 액센트 위 글자 |\n\n타이포 스케일(px, 1920 기준): 슬레이트·바 17 mono · 각주 18 · 셀 본문 20~22 · 표 26 · 리드 28~32 · 셀 제목 28~34 · 헤드라인 52 · 선언 92 · 인용 80 · 섹션 140 · 커버 144 · 숫자 156. 간격: 슬라이드 gap 40 · 그리드 gap 14 · 단계 gap 24. 선: 전부 1px (`.step.hi` 상단만 2px).\n\n## 5. 콘텐츠 클래스 → 해석\n\n| kind | 해석 |\n|------|------|\n| `k-cover` | 144px 2행 대활자 정중앙 + 리드(dim 32). 각주는 하단 바로 내려간다 |\n| `k-section` | 140px 제목 + `.sub` 44px dim + 리드는 모노 액센트 letterspaced(`Connect · Merge …`) |\n| `k-statement` | 92px 3행 선언, `em` 액센트. 17의 리스트는 릴 자막(모노 라벨 + 문장) |\n| `k-steps` | 4열, 상단 헤어라인, 모노 라벨 → 34px 제목 → 23px dim 본문, 중앙 정렬 |\n| `k-ladder` | 세로 4행 `120 / 300 / 1fr` 그리드, `.hi` 행은 액센트 라벨 pill + 액센트 제목 |\n| `k-grid` | 헤어라인 셀, 셀 안 중앙 정렬. `nine`은 3×3 190px 행, `constellation`은 모노 핸들 |\n| `k-cards` | 셀 번호가 액센트 pill(`HOW`·`WHY`·`VISUAL`), 스텝으로 한 장씩 |\n| `k-stats` | 156px 액센트 숫자 + 52px 단위, 콘텐츠 폭 열(`10,000+`가 절대 안 꺾인다) |\n| `k-table` | 헤어라인 행, 모노 대문자 헤더, `.hi` 열 액센트 볼드. 8행이 밴드 안에 든다 |\n| `k-quote` | 80px 인용 + `— cite` 모노 + 리드 dim |\n| `k-diagram` | SVG 높이 460 캡, 박스 `--surface`+헤어라인, 화살표·동사 액센트 모노 |\n| `k-compare` | 2열, 왼쪽(RAG) dim, 오른쪽 제목·밑줄·불릿 액센트 |\n| `k-terminal` | 라이트=검정 터미널(v10), 다크=`--surface` 터미널. 프롬프트·히트 핑크 |\n| `k-timeline` | 5열, 모노 시점 액센트, 지나간 틱은 릴 dim |\n| `k-bars` | 헤어라인 행, 12px 트랙, `.hi` 행만 액센트(나머지 dim 막대) |\n| `k-toggle` | 버튼 pill(눌림=액센트), 4셀 헤어라인, 판정문 harness 관점이면 액센트 |\n| `k-outro` | 링크 제목 모노 액센트, 리드 dim |\n\n공통: `.kicker` → 상단 바 중앙 아이브로우(액센트 대시 + 모노), `.foot` → 하단 바(각주 좌 · 출처 우), 슬레이트·인덱스·진행은 theme.js 주입.\n\n## 6. 모션·순차 공개 규칙\n- 스텝 진입 `.28s` 상승 페이드, 공개 `.45s` + `.1s` 지연(v10 값). SVG 스텝은 transform 없음.\n- 릴 dim은 `.body-list li`·`.tick`에만. 격자·막대·카드·도해는 dim하지 않는다(구조가 주인공).\n- 밴드는 슬라이드 진입 시 `.32s` 페이드(`.slide[data-active]::before`), `prefers-reduced-motion: no-preference`에서만.\n- 자체 키 리스너 없음. 공개 상태는 코어의 `.in`만 읽는다.\n\n## 7. 크롬·진행 표시\n- 상단 바: 좌 슬레이트 `SC NN · TAKE k / n` · 중앙 kicker 아이브로우 · 우 `섹션문자 · 섹션명`.\n- 하단 바: 좌 `NN / 24` + 240px 진행 트랙(액센트 채움 `scaleX(i/24)`) · 중앙 각주(`.foot-note`) · 우 출처(`.foot-src`).\n- 코어 패널은 `--dk-panel-*`로 바 색·헤어라인·모노 폰트에 맞춰 재스킨. stage 모드에서는 슬라이드 안 크롬만 남는다.\n\n## 8. 금지 목록\n- id 선택자(`#sNN`) — v10 3차 검증의 자막 비표시 결함 원인. 이 테마는 0개.\n- `html.js [data-step].in`보다 강한 선택자로 스텝 가시성 건드리기.\n- 그라디언트·그림자·비네트·채움 배경(밴드·터미널·도해 박스·pill 제외).\n- 세 번째 색. 액센트는 하나, 나머지는 fg/dim/faint 톤.\n- 밴드 높이 변경(804px 고정). 내용이 안 들면 타입 스케일로 푼다.\n- 바에 콘텐츠 본문 넣기(각주·출처·슬레이트·진행만).\n\n## 9. 복사해서 쓰는 법\n1. `themes/intertitle/{theme.json,theme.css,theme.js}`를 새 덱의 `themes/` 아래에 복사하고 `build.py --themes intertitle`.\n2. 콘텐츠는 `CONTRACT.md §3` 마크업(`section.slide.k-*` + `.kicker .headline .lead .foot`)을 지키면 된다. `.kicker`와 `.foot`는 자동으로 바에 올라간다.\n3. 슬레이트·인덱스는 theme.js가 `window.CmdsDeck`을 보고 자기 부팅한다. 다른 코어를 쓰면 `init(api)`만 직접 불러주면 된다.\n\n## 10. 계보·출처\n- 원본 `../v10-intertitle/index.html` + `NOTES.md` (2026-09-09, 3차 검증 포함). 계보: v7 Cinema 고정 무대 → v10 자막 카드 → 본 테마(코어 이식).\n- 색·타이포·슬레이트·프레임 값은 v10 그대로. 바뀐 것은 `NOTES.md` 이식 요약 참조.\n", "broadsheet": "# Broadsheet — DESIGN\n\n> [!info] 한 줄 정의\n> 마스트헤드가 크롬이다\n\n## 1. 언제 쓰나 / 쓰지 말 것\n\n긴 호흡의 강의·에세이형 발표, 인쇄본(PDF)까지 같이 나가는 덱. 마스트헤드·폴리오가 지면에 인쇄돼 JS 없이도 진행이 남는다.\n\n- 엔진: `stage` · 계보: v7 Cinema → v11 Broadsheet · 원본: `v11-broadsheet`\n- 이 문서는 스타일 층만 기술한다. 발표 기능(P/F/N/A/T)과 마크업 계약은 덱 이식 계약과 덱 시스템 DESIGN가 정본.\n\n## 2. 시그니처 결정 5\n\n1. 마스트헤드가 크롬이다 — 제호·귀·폴리오·이중 괘선(4px+1px)이 매 면 지면 위에 인쇄되고, 굵은 괘선의 액센트 구간이 진행을 말한다\n2. 6단 격자 위 1px 괘선으로만 나눈다 — 카드·그림자·둥근 모서리 없음, 강조는 잉크 반전 한 가지\n3. 세리프 없이 신문 위계 — SF Pro/Pretendard 800 헤드라인(-.04em) · 400 데크 · 모노 슬러그와 폴리오\n4. 각주는 매 면 하단 밴드(3px 괘선) — 24면이 같은 문법으로 읽힌다\n5. 인쇄는 항상 신문지 라이트 — 다크(야간판)가 켜져 있어도 잉크 반전으로 찍지 않는다\n\n## 3. 토큰\n\n| 토큰 | 라이트 | 다크 |\n|------|--------|------|\n| `accent` | `#134538` | `#E985A2` |\n| `accentOn` | `#FFFFFF` | `#1B1B1B` |\n| `dim` | `#56534B` | `#ABA79B` |\n| `faint` | `#6E6A60` | `#8A867B` |\n| `ink` | `#17160F` | `#EDE8DC` |\n| `paper` | `#F3F0E8` | `#121212` |\n| `rule` | `#C9C4B5` | `#3A3831` |\n| `tint` | `#EAE6DA` | `#1B1A17` |\n\n- 격자: `--pad-x 96px` `--gut 36px` `--col calc((1920 - 96*2 - 36*5) / 6)` = 6단\n- 여백: `--pad-t 52px` `--pad-b 60px` `--body-gap 32px`\n- 괘선 3종: 4px 제호 굵은 괘선 · 3px 각주 밴드 · 1px 본문 괘선\n\n## 4. 콘텐츠 클래스 → 이 테마의 해석\n\n| kind | 내용 | 해석 |\n|------|------|------|\n| `k-cover 01` | 표지 | 1면 제호 + 톱기사 헤드라인 |\n| `k-section 03·09·14·20` | 섹션 표지 | 섹션 프런트(경제/과학면 같은 면 머리) |\n| `k-statement 04·17` | 선언 | 전면 사설 |\n| `k-steps 05` | 4단 프로세스 | 4단 기사 컬럼 |\n| `k-ladder 15` | 세로 사다리 | 세로 리스트, 강조 행은 잉크 반전 |\n| `k-grid 02·06·22` | 그리드 4열·3×3 | 6단 격자 위 셀, 괘선만으로 분리 |\n| `k-cards 21` | 카드 3장 | 카드 3장이 박스 기사, 마지막은 잉크 반전 |\n| `k-stats 07` | 카운터 통계 | 큰 수치 리드 |\n| `k-table 08·16` | 표 | 표는 신문 표 조판(모노 헤더 + 1px 괘선) |\n| `k-quote 10` | 인용 | 인용은 큰 활자 발췌문 |\n| `k-diagram 11` | SVG 도해 | 도해는 잉크 인포그래픽 |\n| `k-compare 12` | 2열 대비 | 두 열이 좌우 사설 대비 |\n| `k-terminal 13` | 터미널 | 터미널은 조판된 리스팅 박스 |\n| `k-timeline 18` | 타임라인 5틱 | 타임라인이 연표 |\n| `k-bars 19` | 가로 막대 | 막대가 지표 그래프 |\n| `k-toggle 23` | 관점 토글 | 토글이 판형 전환 |\n| `k-outro 24` | 아웃트로 | 마지막 면 폴리오 + 안내 |\n\n## 5. 모션·순차 공개\n\n신문은 움직이지 않는다. `[data-step]` 은 코어 기본보다 짧은 페이드만. 마스트헤드·폴리오는 `theme.js` 가 init 에서 한 번 그려 DOM 에 고정하므로 JS 가 죽어도, 인쇄해도 남는다.\n\n## 6. 크롬·진행 표시\n\n**마스트헤드가 크롬이다.** 매 면 상단에 제호·귀(edition)·폴리오(`섹션 · nn / 24`)가 인쇄되고, 굵은 괘선의 액센트 구간 길이가 진행을 말한다. 하단에는 각주 밴드(3px 괘선). 코어 패널은 신문지 톤으로 재스킨.\n\n## 7. 금지\n\n- 세리프 폰트 (신문 느낌은 괘선·격자·웨이트로 낸다 — CI 폰트 규칙)\n- 카드·그림자·둥근 모서리\n- 다크(야간판)로 인쇄하지 않는다 — 인쇄는 항상 신문지 라이트\n\n## 8. 복사해서 쓰는 법\n\n1. `themes/broadsheet/theme.css`(+`theme.js`)를 자기 프로젝트의 같은 경로에 둔다.\n2. 콘텐츠를 덱 이식 계약 §3의 슬라이드 종류로 쓴다. 이 테마가 특별히 요구하는 것: `data-section-name` 이 폴리오의 면 이름이 된다. 6단 격자가 모든 kind 의 바탕 measure 다.\n3. `python3 build.py --themes broadsheet` → `dist/broadsheet/index.html` 단일 파일. 검증은 `tools/verify.py` 4조합.\n\n## 9. 계보\n\n`v11-broadsheet` (3차 변주, 2026-09-09) → 최종 R1 이식. 원본 덱은 `../v11-broadsheet/index.html`에 그대로 보존돼 있다.\n", "section-drawing": "# Section Drawing — DESIGN\n\n> [!info] 한 줄 정의\n> 좌측 세로 눈금자가 절단선 A–A′ 그 자체이며 24개 스테이션 눈금이 진행 표시다\n\n## 1. 언제 쓰나 / 쓰지 말 것\n\n구조·시스템·프로세스를 '단면'으로 보여주는 강의·컨설팅 덱. 임원 대상 기술 설명, 아키텍처·워크플로 설명, 도면 같은 정밀함이 신뢰를 주는 자리에 쓴다. 감성적 스토리텔링이나 이미지 중심 덱에는 맞지 않는다.\n\n- 엔진: `stage` · 계보: v7 Cinema (fixed 1920 stage) + v8 Blueprint (drawing language) · 원본: `v9-section-drawing`\n- 이 문서는 스타일 층만 기술한다. 발표 기능(P/F/N/A/T)과 마크업 계약은 덱 이식 계약과 덱 시스템 DESIGN가 정본.\n\n## 2. 시그니처 결정 5\n\n1. 좌측 세로 눈금자가 절단선 A–A′ 그 자체이며 24개 스테이션 눈금이 진행 표시다 — 프로그레스 바가 아니라 절단선 위 깊이 측정\n2. 치수 버블이 현재 스테이션 번호를 정확히 덮어 대체한다(이중 번호 없음), 지시 삼각형 + 420px 안에서 사라지는 datum 선\n3. 제도 벨럼 지면: 32px 피치 수평 눈금 결이 눈금자 쪽에서만 보이고 본문 쪽으로 mask 로 사라진다 + 이중 도면 프레임 + 우하단 표제 SHEET NN / 24 · 1:1\n4. 층이 있는 콘텐츠는 단면처럼 쌓인다 — 1.5px 잉크 외곽선 베이, 강조 층은 틴트 + 45° 해치, 치수선 끝 눈금(::before/::after 13px)\n5. 라이트 = 벨럼 `#FAF9F3` + 녹색 잉크 `#134538` · 다크 = 슬레이트 `#0D1211` + 분홍 잉크 `#E985A2`, 헤드라인 800 웨이트 -.035em, 라벨은 모노 .14em\n\n## 3. 토큰\n\n| 토큰 | 라이트 | 다크 |\n|------|--------|------|\n| `accent` | `#134538` | `#E985A2` |\n| `accentOn` | `#FFFFFF` | `#1B1B1B` |\n| `bg` | `#FAF9F3` | `#0D1211` |\n| `faint` | `#8B938A` | `#606860` |\n| `fg` | `#131813` | `#EDEFEA` |\n| `line` | `#D3D6CC` | `#242B27` |\n| `line2` | `#E7E9E0` | `#171C19` |\n| `muted` | `#4C554D` | `#9BA39C` |\n| `panel` | `#F1F0E7` | `#131917` |\n| `tint` | `rgba(19,69,56,.06)` | `rgba(233,133,162,.10)` |\n\n- 눈금자 기하: `--rul-w 244px` `--rul-x 150px` `--rul-top/-bottom 150px`\n- 지면 여백: `--pad-t 118px` `--pad-b 132px` `--pad-r 150px`\n- 결(수평 눈금) 피치 32px, 눈금자 쪽에서만 보이고 본문으로 mask 페이드\n- 선: 본문 1px `--line` · 베이 외곽 1.5px 잉크 · 섹션 눈금 26px 폭\n\n## 4. 콘텐츠 클래스 → 이 테마의 해석\n\n| kind | 내용 | 해석 |\n|------|------|------|\n| `k-cover 01` | 표지 | 제호 없이 눈금자 상단 A 에서 시작, 표제란만 |\n| `k-section 03·09·14·20` | 섹션 표지 | 섹션 문자(A~D)가 눈금자에 굵은 눈금으로 찍히고 지면은 비운다 |\n| `k-statement 04·17` | 선언 | 헤드라인만 남기고 datum 선 한 줄 |\n| `k-steps 05` | 4단 프로세스 | 4개 베이가 가로로 이어진 단면 |\n| `k-ladder 15` | 세로 사다리 | 층이 위에서 아래로 쌓인 단면, 강조 층은 45° 해치 |\n| `k-grid 02·06·22` | 그리드 4열·3×3 | 격자 셀이 도면 부품 칸, 셀 번호가 부품 번호 |\n| `k-cards 21` | 카드 3장 | 카드 3장이 상세 단면 3개 |\n| `k-stats 07` | 카운터 통계 | 치수 숫자처럼 큰 활자 + 단위 라벨 |\n| `k-table 08·16` | 표 | 표는 부품표(BOM) 조판, 헤더는 모노 대문자 |\n| `k-quote 10` | 인용 | 인용은 도면 여백의 주기(註記) |\n| `k-diagram 11` | SVG 도해 | SVG 도해에 화살촉을 theme.js 가 붙여 지시선으로 |\n| `k-compare 12` | 2열 대비 | 두 열이 좌우 단면 A/B |\n| `k-terminal 13` | 터미널 | 터미널은 계산서 박스 |\n| `k-timeline 18` | 타임라인 5틱 | 타임라인 5틱이 치수선, 끝 눈금 13px |\n| `k-bars 19` | 가로 막대 | 막대가 치수선, 값은 우측 정렬 모노 |\n| `k-toggle 23` | 관점 토글 | 토글 버튼이 도면 옵션 스위치 |\n| `k-outro 24` | 아웃트로 | 표제란만 남기고 A′ 로 닫는다 |\n\n## 5. 모션·순차 공개\n\n`[data-step].in` 은 코어 기본(12px 상승 페이드)을 `--ease cubic-bezier(.22,.78,.28,1)` 로 바꿔 쓴다. 치수 버블은 슬라이드 전환마다 `--p` 로 눈금자를 따라 미끄러진다. 감축 모드에서는 전부 즉시 표시.\n\n## 6. 크롬·진행 표시\n\n좌측 눈금자가 진행 표시 그 자체다. 스테이션 24개, 섹션 경계(A~D)는 굵은 눈금 + 문자 라벨. 현재 위치는 치수 버블이 **그 스테이션 번호를 덮어 대체**하므로 숫자가 겹치지 않는다. 우하단 표제 `SECTION A–A′ · SHEET nn / 24 · 1:1`, 각 시트 우상단에 섹션 코드/이름.\n\n## 7. 금지\n\n- 눈금자 밖에 별도 진행 바를 두지 않는다 (이중 표시)\n- 버블과 스테이션 번호를 동시에 보이지 않는다\n- 결(수평선)을 본문 영역까지 끌고 가지 않는다 — 사용자 지적 사항\n\n## 8. 복사해서 쓰는 법\n\n1. `themes/section-drawing/theme.css`(+`theme.js`)를 자기 프로젝트의 같은 경로에 둔다.\n2. 콘텐츠를 덱 이식 계약 §3의 슬라이드 종류로 쓴다. 이 테마가 특별히 요구하는 것: `data-section`(A~D)이 있어야 눈금자에 섹션 눈금이 찍힌다. 슬라이드 수가 바뀌면 스테이션은 자동으로 재계산된다.\n3. `python3 build.py --themes section-drawing` → `dist/section-drawing/index.html` 단일 파일. 검증은 `tools/verify.py` 4조합.\n\n## 9. 계보\n\n`v9-section-drawing` (3차 변주, 2026-09-09) → 최종 R1 이식. 원본 덱은 `../v9-section-drawing/index.html`에 그대로 보존돼 있다.\n", "blueprint": "# Blueprint — DESIGN\n\n## ① 한 줄 정의\n발표 자체를 **도면**으로 만든 테마. 점 격자 지면, 한 가지 잉크, 시트 프레임, 치수선, 그리고 우하단 표제란(도면 표제란)이 슬라이드마다 실제 설계·구분 메타데이터를 싣는다.\n\n## ② 언제 쓰나 / 쓰지 말 것\n- **쓴다**: 시스템·아키텍처·프로세스를 설명하는 발표. 표제란의 SHEET·SECTION·TYPE·SOURCE 가 \"그냥 워딩\"이 아니라 의미 있는 구분 정보로 읽힐 때 가치가 최대. `k-diagram`·`k-terminal`·`k-table`·`k-ladder` 가 많은 덱에 특히 강하다.\n- **쓰지 말 것**: 감정·서사·브랜드 무드가 앞서야 하는 발표(제품 런칭 티저, 시네마틱 오프닝). 도면 어휘는 차갑고 정연해서 그런 자리에는 과하다.\n\n## ③ 시그니처 결정 5개\n\n1. **지면 = 점 격자 텍스처 (색 그라디언트 아님).** 왜: 제도판의 방안지를 종이 위 잉크 한 겹으로 환원해 Anti-Slop 을 지킨다. 어떻게: `.slide{ background-image:radial-gradient(var(--bp-dot) calc(1.4px*var(--u)),transparent calc(1.7px*var(--u))); background-size:calc(24px*var(--u)) ... }`, `--bp-dot` 는 잉크의 7~8% 알파.\n2. **시트 프레임 + 내부 안전선.** 왜: 모든 슬라이드를 한 장의 도면 시트로 읽히게 한다. 어떻게: `.slide::before{ inset:var(--bp-frame); border:1px solid var(--bp-rule) }` + `.slide::after{ inset:calc(var(--bp-frame)+6px*var(--u)); border:1px solid var(--bp-rule2) }`. 클로징(`k-outro`)만 2px 강조 프레임.\n3. **잉크는 한 가지.** 왜: CI 두 토큰만으로 도면의 절제를 만든다. 어떻게: 라이트 녹색 `#134538`, 다크 분홍 `#E985A2` — 코어의 `--accent` 스왑을 그대로 상속(`--bp-acc:var(--accent)`). 카드·그림자·이모지·그라디언트 없음.\n4. **구조는 괘선·치수선·틱으로.** 왜: 박스/카드 대신 제도 관례로 정보를 세운다. 어떻게: `.step` 상단 2px 괘선 + 좌측 틱, `.stat`/`.tick` 상단 치수선 + 양끝 세로 틱(`::before`/`::after` 11px), 표는 1px 전체 괘선.\n5. **우하단 표제란(theme.js).** 왜: 소유자 지침 — \"우측 하단 네모칸이 의미 있는 설계·구분 정보를 줄 때 가치가 있다.\" 어떻게: `theme.js` 가 슬라이드마다 `data-section`/`data-section-name`/`data-kind`/`data-source` + 덱 메타(`rev`/`author`)로 6행 그리드를 만들어 슬라이드 안(`position:absolute; right/bottom:frame`)에 넣는다 → 무대·인쇄에 그대로 나온다.\n\n## ④ 토큰 표\n\n| 토큰 | 라이트 | 다크 |\n|------|--------|------|\n| paper(`--bg`) | `#F6F5F0` | `#111311` |\n| ink(`--fg`) | `#1B1B1B` | `#F2F1EC` |\n| acc(`--accent`) | `#134538` | `#E985A2` |\n| rule(`--line`) | ink 14% | ink 16% |\n| dot(`--bp-dot`) | ink 7% | ink 8% |\n| term-acc | `#2FB488` | `#E985A2` |\n\n타이포 스케일(1920 폭 기준, `calc(px * var(--u))`):\n\n| 역할 | px |\n|------|----|\n| 헤드라인(cover) | 84 |\n| 헤드라인(statement) | 58 |\n| 통계 숫자 | 88 |\n| lead | 28 |\n| kicker(mono) | 15 |\n| 표제란(mono) | 11 |\n\n- 간격: 시트 프레임 `--bp-frame:20px`, 좌우 여백 `--bp-gut:120px`, 하단 여백 216px(표제란/폴리오 확보), 셀 간 괘선 1px.\n- 선 굵기: 프레임/괘선 1px, 강조 프레임 2px, 다이어그램 rect 1.5px · arrow 2.5px.\n- **스케일 단위 `--u = calc(var(--dk-w)/1920px)`** — 스크롤 엔진에서 폭 비례. 16x9·16x10 은 폭이 같아 동일 레이아웃, 세로 여분은 `justify-content:center` + `.foot{margin-top:auto}` 로 흡수. `verify`(1920 폭)에서 `--u=1`.\n\n## ⑤ 콘텐츠 클래스 → 이 테마의 해석 (§3 kind 전부)\n\n| kind | Blueprint 해석 |\n|------|----------------|\n| `k-cover` | 대활자 + 측정 치수선(theme.js 가 헤드라인 실제 렌더 폭 px 을 표기) |\n| `k-section` | kicker=SECTION nn, 헤드라인 + `.sub` 부제, lead |\n| `k-statement` | 대활자 선언 + `body-list` 는 지시선(1px 틱) 달린 항목 |\n| `k-steps` | 4열, 각 step 상단 2px 괘선 + 좌측 틱, `.hi` 는 accent |\n| `k-ladder` | 세로 입면 표(60px 라벨열 + 본문), `.hi`(v3) accent 괘선 |\n| `k-grid` | 1px 괘선 스케줄(3·4·9칸), 셀 사이는 rule 배경으로 1px 선 |\n| `k-cards` | 3칸 스케줄, 순차 공개, no 는 mono accent |\n| `k-stats` | 각 숫자 위 치수선 + 양끝 틱, mono accent 숫자 |\n| `k-table` | 전체 괘선 도면 표, `.hi` 열은 accent 텍스트 + 헤더 tint |\n| `k-quote` | 좌측 2px accent 괘선 인용 |\n| `k-diagram` | 종이-잉크 스키매틱(rect paper fill + ink stroke, arrow accent, loop dashed) |\n| `k-compare` | 2평면 괘선 도해, b열 accent 제목·불릿 |\n| `k-terminal` | 지시선 없는 `DETAIL` 라벨 인셋, 다크 터미널, 라이트에선 밝은 녹색 잉크 |\n| `k-timeline` | 5틱 치수선(상단 rule + 시작 accent 틱) |\n| `k-bars` | 치수 바(rule 트랙 + accent 채움 `--w%`), `.hi` accent |\n| `k-toggle` | mono 토글 버튼(pressed=accent bg) + 괘선 그리드 + 지시선 판정 |\n| `k-outro` | 2px accent 강조 프레임 시트 + mono accent 링크 3칸 |\n\n## ⑥ 모션·순차 공개 규칙\n`html.js [data-step]{ opacity:0; transform:translateY(calc(8px*var(--u))) }` → `.in` 에서 해제(0.42s ease). `svg [data-step]` 는 이동 없이 페이드만(코어 규약). `prefers-reduced-motion` 은 코어·테마 양쪽에서 즉시 공개. **첫 페인트는 스크롤 위치에 의존하지 않는다** — 스텝의 초기 상태는 CSS 만으로 결정되고, 코어가 최초 슬라이드에 `data-active`·첫 스텝 공개를 준다.\n\n## ⑦ 크롬·진행 표시\n- 슬라이드 내부에 자체 진행 표시를 둔다(무대 모드에서 코어 패널이 숨겨져도 보이게): 우하단 **표제란**(SHEET nn/NN 포함) + 좌하단 **폴리오**(SHEET nn/NN + 1px 진행 바 `scaleX((i+1)/total)`).\n- 코어 패널은 `--dk-font:var(--font-mono)` · `--dk-panel-bg` · `--dk-panel-line:var(--bp-rule)` · `--dk-accent:var(--bp-acc)` 로 재스킨만 한다(구조 변경·숨김 없음).\n\n## ⑧ 금지 목록\n- 그라디언트 배경, 카드 그림자, 이모지 장식, 라운드 코너(도면은 직각).\n- 두 CI 토큰 밖의 색. 라이트 지면 위 진한 녹색 터미널 텍스트(안 읽힘 → `--bp-term-acc` 밝은 녹색 사용).\n- 인라인 `style=\"color\"`(테마 전환 불가). SVG 로 사람·사물 그리기.\n- 표제란에 발명한 숫자·필러(SCALE `1:1` 같은 크롬 라벨은 넣지 않는다 — v8 NOTES 알려진 문제 `#1` 회피). 모든 표제란 값은 슬라이드 실 메타.\n- 100vh(스크롤 엔진에선 `var(--dk-h)` 만).\n\n## ⑨ 복사해서 쓰는 법\n1. `theme.css` + `theme.js` 를 새 콘텐츠에 얹고 `theme.json` 의 `\"engine\":\"scroll\"` 을 유지한다(코어가 `#deck`·`.slide` 를 `--dk-w`×`--dk-h` 로 세운다).\n2. 콘텐츠는 §3 마크업 계약을 그대로 따른다 — 특히 각 `section.slide` 에 `data-section`·`data-section-name`·`data-kind`·`data-source` 를 채워야 표제란이 의미를 갖는다.\n3. 색은 `--accent`/`--accent-on` 만 갈아끼우면 잉크가 통째로 바뀐다. 폭이 1920 이 아닌 곳에 얹어도 `--u` 가 전 크기를 비례 조정한다.\n\n## ⑩ 계보·출처\n- 원본: `../v8-blueprint/index.html` + `NOTES.md` (단일 파일 · 유동 타이포 · scroll-snap).\n- 상위 계보: v1 Document(단일 파일 문서 모델) → v8 Blueprint(제도판 어휘).\n- 시각 규약 정본: DESIGN.md (CI 토큰 · Anti-Slop). CMDS 덱 코어: `../../final/core/`.\n", "editorial-scroll": "# Editorial Scroll — DESIGN\n\n> [!info] 한 줄 정의\n> 유동 타이포\n\n## 1. 언제 쓰나 / 쓰지 말 것\n\n링크·USB로 던져주고 발표 뒤에도 웹 문서로 계속 살아야 하는 자료. 리허설한 줄바꿈이 그대로 나와야 하는 고위험 무대에는 stage 엔진 테마를 쓴다.\n\n- 엔진: `scroll` · 계보: 손상현 scroll-snap deck → v1 Editorial Scroll (CMDS CI) · 원본: `v1-editorial-scroll`\n- 이 문서는 스타일 층만 기술한다. 발표 기능(P/F/N/A/T)과 마크업 계약은 덱 이식 계약과 덱 시스템 DESIGN가 정본.\n\n## 2. 시그니처 결정 5\n\n1. 유동 타이포 — 모든 크기는 덱 프레임(--dk-w/--dk-h)의 1/100 단위(--uw/--uh)에 clamp()로 묶는다\n2. 헤어라인 규칙 — 1px line / 1.5px rule 두 굵기만으로 격자·표·리스트를 나눈다 (박스 없음)\n3. 넉넉한 거터 — 좌우 clamp(28px, 7uw, 112px), 콘텐츠 최대 1180~1696px, 세로는 중앙 정렬\n4. 진행 점 — 슬라이드 수만큼의 점을 덱 우측에 세로로, 현재 점은 액센트·1.45배, 섹션 사이 간격, 클릭하면 이동\n5. 액센트 지면 클로징 — 마지막 스프레드만 acc-bg 로 지면을 물들이고 규칙선은 acc-line 으로\n\n## 3. 토큰\n\n| 토큰 | 라이트 | 다크 |\n|------|--------|------|\n| `accent` | `#134538` | `#E985A2` |\n| `accentBg` | `#F1F7F4` | `#2B1922` |\n| `accentLine` | `#BAD9C9` | `#4A2C38` |\n| `card` | `#FFFFFF` | `#0D1411` |\n| `faint` | `#8A938E` | `#626A66` |\n| `ink` | `#0B0D0C` | `#F2F4F3` |\n| `line` | `#E6E8E6` | `#1A231F` |\n| `muted` | `#4A544F` | `#9AA39D` |\n| `onAccent` | `#FFFFFF` | `#1B1B1B` |\n| `paper` | `#FBFBFA` | `#0B0F0D` |\n| `rule` | `#D0D3D0` | `#26302A` |\n| `soft` | `#F5F6F4` | `#0A1110` |\n\n- 유동 단위: `--uw` `--uh` = 덱 프레임의 1/100, 모든 타이포는 `clamp()` 로 상·하한을 묶는다\n- 거터: 좌우 `clamp(28px, 7uw, 112px)` · 콘텐츠 최대 1180~1696px\n- 규칙선 2종만: 1px `--ed-line` · 1.5px `--ed-rule`\n\n## 4. 콘텐츠 클래스 → 이 테마의 해석\n\n| kind | 내용 | 해석 |\n|------|------|------|\n| `k-cover 01` | 표지 | 큰 제목 + 부제, 여백 넉넉 |\n| `k-section 03·09·14·20` | 섹션 표지 | 간지, 섹션 번호만 |\n| `k-statement 04·17` | 선언 | 한 문단 에세이 |\n| `k-steps 05` | 4단 프로세스 | 4열 또는 접히는 목록 |\n| `k-ladder 15` | 세로 사다리 | 세로 목록, 강조 행 액센트 |\n| `k-grid 02·06·22` | 그리드 4열·3×3 | 헤어라인으로 나눈 격자 |\n| `k-cards 21` | 카드 3장 | 카드 3장(테두리 없이 규칙선만) |\n| `k-stats 07` | 카운터 통계 | 큰 숫자 4개 |\n| `k-table 08·16` | 표 | 표는 헤어라인 표 |\n| `k-quote 10` | 인용 | 인용은 큰 활자 + 출처 |\n| `k-diagram 11` | SVG 도해 | 도해는 SVG 그대로, 유동 크기 |\n| `k-compare 12` | 2열 대비 | 두 열 대비 |\n| `k-terminal 13` | 터미널 | 터미널 블록 |\n| `k-timeline 18` | 타임라인 5틱 | 타임라인 5틱 |\n| `k-bars 19` | 가로 막대 | 막대 5행 |\n| `k-toggle 23` | 관점 토글 | 토글 세그먼트 |\n| `k-outro 24` | 아웃트로 | 액센트 지면으로 물든 클로징 스프레드 |\n\n## 5. 모션·순차 공개\n\n`--ed-ease cubic-bezier(.22,.8,.3,1)` 로 부드럽게. 스크롤 스냅이 기본 전환이고, `[data-step]` 은 짧은 상승 페이드.\n\n## 6. 크롬·진행 표시\n\n**우측 세로 진행 점** — 슬라이드 수만큼의 점, 현재 점은 액센트 + 1.45배, 섹션 사이에 간격, 클릭하면 그 장으로 이동(`api.go`). 사용자가 원본에서 가장 좋다고 한 요소라 그대로 살렸다. 코어 패널은 종이 톤으로 재스킨.\n\n## 7. 금지\n\n- 박스·카드 배경 (규칙선만으로 나눈다)\n- 점 진행 표시를 지우지 않는다 — 이 테마의 시그니처\n- 한글 헤드라인을 자연 wrap 에 맡기지 않는다 (고아 글자)\n\n## 8. 복사해서 쓰는 법\n\n1. `themes/editorial-scroll/theme.css`(+`theme.js`)를 자기 프로젝트의 같은 경로에 둔다.\n2. 콘텐츠를 덱 이식 계약 §3의 슬라이드 종류로 쓴다. 이 테마가 특별히 요구하는 것: `data-section` 이 있으면 점이 섹션별로 묶인다. 헤드라인의 `<br/>` 는 콘텐츠에 이미 들어 있고, `clamp()` 상한이 1920 폭에서 넘치지 않게 잡혀 있다.\n3. `python3 build.py --themes editorial-scroll` → `dist/editorial-scroll/index.html` 단일 파일. 검증은 `tools/verify.py` 4조합.\n\n## 9. 계보\n\n`v1-editorial-scroll` (3차 변주, 2026-09-09) → 최종 R1 이식. 원본 덱은 `../v1-editorial-scroll/index.html`에 그대로 보존돼 있다.\n", "datadriven": "# Data-Driven — DESIGN\n\n## 1. 한 줄 정의\n눈이 아니라 데이터가 결정한 덱. 간격·타입·색 대비·모션의 모든 수치가 `ui-ux-pro-max` 데이터셋의 행(styles.csv / ux-guidelines.csv / motion.csv / design_system.py DIAL_TIERS)을 출처로 갖는 합리적 UI 시스템 룩이다. 카드는 그림자 없이 면색 세 단계와 헤어라인으로 층을 만들고, 액센트는 하나만, 강조와 의미 경계에만 쓴다.\n\n## 2. 언제 쓰나 / 쓰지 말 것\n- **쓴다** — 숫자·표·비교·바 차트가 많은 기술 발표. 개발자·분석가·임원 중 \"왜 이렇게 생겼나\"에 근거를 묻는 청중. 발표 후 그대로 웹 문서로 공유할 덱. 다크모드가 필요한 자리.\n- **쓰지 않는다** — 편집 디자인·감성이 본체인 자리(→ Editorial Scroll·Typographic Poster). 사진·일러스트 중심 덱. 장식 자체가 메시지인 키노트.\n\n## 3. 시그니처 결정 5개\n\n### 3.1 간격 스케일 4/8/24/32/48/64/96\n- **무엇** — 모든 패딩·갭·마진이 일곱 값 중 하나.\n- **왜** — `design_system.py` DIAL_TIERS density 1-3 \"Spacious\" 티어 값 그대로. 정보 4층 이상인 장(9그리드·표·바·타임라인·사다리·터미널·토글·카드)은 density 4-7 \"Standard\"(md 24→16, lg 32→24, xl 48→32, gap 32→24)로 한 칸 내린다.\n- **어떻게** — `--sp-xs:4px --sp-sm:8px --sp-md:24px --sp-lg:32px --sp-xl:48px --sp-2xl:64px --sp-3xl:96px; --gap:32px` (swiss `gap:2rem`). dense: `.k-grid:not(#s02), .k-table, .k-bars, .k-timeline, .k-ladder, .k-terminal, .k-toggle, .k-cards{ --sp-md:16px; --sp-lg:24px; --sp-xl:32px; --gap:24px }`. 슬라이드 패딩 `80 / 112 / 64`(원본 `clamp(2.5rem,6vw,8rem)`@1920 = 115 → 8px 격자 정렬).\n\n### 3.2 타입 램프 Perfect Fourth (1.333)\n- **무엇** — 8단 램프, 단 간 비율 1.333.\n- **왜** — `styles.csv` exaggerated-minimalism의 `clamp(3rem,10vw,12rem)` 앵커를 1.333 하향 전개한 원본 램프. 원본 clamp 를 1920×1080 에서 평가하면 120/80/52/36/28/22/16/17 인데 이는 *읽기 거리* 앵커라 1080 캔버스의 아래 절반이 비었다(1차 스크린샷 실측). **무대 거리용으로 같은 램프를 정확히 한 단(×1.333) 올렸다** — 비율·단 수·역할은 원본 그대로, 앵커만 한 칸 위.\n- **어떻게** — `--t-display:160 --t-h1:107 --t-h2:69 --t-h3:48 --t-lead:37 --t-body:29 --t-caption:21 --t-mono:23`. 행간 `display 1.15 / h1 1.2 / h2 1.28 / body 1.65 / caption 1.5`(ux-guidelines Line Height 1.5–1.75). 자간 `display -.035em / h1 -.025em / h2 -.02em / body -.01em`(데이터셋 -.05em 은 한글에 과함 → 완화). 굵기 `display 800`(900 은 한글 속공간 막힘).\n\n### 3.3 radius 0 · shadow none · 면색 3단 층위\n- **무엇** — 모서리 0, 그림자 0. 층위는 `bg → surface → surface-2` 세 면색과 1px 헤어라인.\n- **왜** — `styles.csv` minimalism-and-swiss-style Design System Variables `--border-radius:0px; --shadow:none`. \"subtle elevation\" 은 그림자가 아니라 면색 단계로 표현하는 것이 이 행의 결정.\n- **어떻게** — `.cell/.step/.tick/.tg/.compare .col/.body-list li{ background:var(--surface); border:1px solid var(--hairline); border-radius:0 }`. 강조(`.hi`·`.b`·마지막 항목)는 `background:var(--tint-2); border-left:3px solid var(--acc)`.\n\n### 3.4 액센트 하나 원칙\n- **무엇** — 라이트 green `#134538`, 다크 pink `#E985A2` 하나만. 강조·의미 경계·진행 표시에만.\n- **왜** — 같은 swiss 행 `--accent-color: single primary only`. `ux-guidelines` Color Only [High]: 선택 상태는 색 + 모양(✓ 글리프, 도트 8×8→8×18) 으로.\n- **어떻게** — 비강조 바 채움은 `var(--rule)` 중성, `.bar.hi` 만 `var(--acc)`. 토글 선택 버튼 `background:var(--acc); color:var(--on-acc)` + `::before{content:\"✓ \"}`. 액센트 위 글자는 라이트 `#FFFFFF`(10.85:1) / 다크 `#1B1B1B`(6.84:1).\n\n### 3.5 모션 Subtle 티어\n- **무엇** — 순차 공개 340ms 상승 12px, 슬라이드 진입 260ms, 호버 180ms, stagger 30ms, exit 0ms.\n- **왜** — `motion.csv` Subtle tier: Page Transition 200–300 / Scroll Reveal 300–400 / Hover Micro 150–200 / y offset 8–16px / stagger 0.02–0.04s. exit < entrance(비대칭) 는 같은 파일 Performance Notes.\n- **어떻게** — `--dur-in:260ms --dur-reveal:340ms --dur-hover:180ms --reveal-y:12px --stagger:30ms; --ease-out:cubic-bezier(.25,.46,.45,.94)`(power1.out) `--ease-io:cubic-bezier(.455,.03,.515,.955)`(power1.inOut). `html.js [data-step]` 을 덮어써 코어 기본(.45s ease) 대신 340ms power1.out.\n\n## 4. 토큰 표\n\n### 4.1 색 (CI 색상 · 원본 대비 목표 유지)\n원본은 slate 중성(`#0F172A` / `#F8FAFC` 계열)을 썼다. 계약 §4.2(CI 두 토큰과 톤 변주만)에 맞춰 **색상은 CI green 으로 재산출하고 원본이 확정한 대비 목표(본문 AAA · 보조 AAA · 캡션 AA · 의미 경계 3:1+)는 그대로 지켰다.** 대비는 bg 기준 실측.\n\n| 토큰 | 라이트 | 대비 | 다크 | 대비 | 역할 |\n|------|--------|-----:|------|-----:|------|\n| `--bg` | `#F6F8F7` | — | `#0E1512` | — | 슬라이드 바탕 (green @4% / green-black) |\n| `--surface` | `#FFFFFF` | — | `#182019` | — | 카드·표 헤더·패널 |\n| `--surface-2` | `#E7ECEB` | — | `#232C26` | — | 바 트랙·도판 박스 |\n| `--fg` | `#0E1F1B` | 16.0 | `#F3F5F3` | 16.9 | 본문 (원본 목표 ≥13.9 / ≥17) |\n| `--fg-2` | `#45554F` | 7.39 | `#C8D1CC` | 11.85 | 보조 (원본 목표 ≥7.0 AAA) |\n| `--fg-3` | `#66756F` | 4.54 | `#94A29B` | 6.96 | 캡션·라벨 전용 (AA) |\n| `--hairline` | `#DEE5E3` | 1.2 | `#3D4842` | 1.94 | 장식 구획선 전용 |\n| `--rule` | `#66756F` | 4.54 | `#6E7D77` | 3.82 | 의미를 전달하는 경계 (≥3:1) |\n| `--acc` | `#134538` | 10.17 | `#E985A2` | 7.35 | 액센트 하나 |\n| `--on-acc` | `#FFFFFF` | 10.85* | `#1B1B1B` | 6.84* | 액센트 채움 위 글자 (*acc 기준) |\n| `--tint-1/2/3` | `#F6F8F7 / #ECF0EF / #E3E9E7` | | `#1B1C1B / #242020 / #312729` | | acc @4/8/12% (라이트) · @6/10/16% (다크) |\n\n### 4.2 타이포 (px, 1920 캔버스)\n\n| 단 | 크기 | 행간 | 용도 |\n|----|-----:|-----:|------|\n| display | 160 | 1.15 | 표지·섹션 헤드라인 |\n| h1 | 107 | 1.2 | 선언(statement)·인용·클로징 헤드라인·stat 숫자 |\n| h2 | 69 | 1.28 | 콘텐츠 장 헤드라인·토글 라벨 |\n| h3 | 48 | 1.3 | 카드·스텝·틱 제목 |\n| lead | 37 | 1.5–1.62 | 리드·비교 리스트·바 값 |\n| body | 29 | 1.55–1.65 | 카드 본문·표·바 라벨 |\n| caption | 21 | 1.5 | 각주·kicker·status |\n| mono | 23 | 1.4–1.75 | 번호·라벨·터미널 |\n\n### 4.3 간격 · 선\n- 간격: §3.1. 슬라이드 패딩 `80/112/64`, 16:10 은 `96/112/80`.\n- 선: 장식 `1px`(hairline) · 의미 경계 `1.5px`(rule, 세그먼트 컨트롤) · 강조 좌측 `3px`(acc) · stat·틱 상단 `2px` · 진행바 `2px`.\n\n## 5. 콘텐츠 클래스 → 이 테마의 해석\n\n| kind | 해석 |\n|------|------|\n| `k-cover` | display 160 헤드라인, kicker 는 fg-3 모노, 리드 h3, 푸터 모노 캡션. 콘텐츠 블록 세로 중앙 |\n| `k-section` | display 헤드라인 + h2 sub(fg-2) + 96px 2px 액센트 괘선 + 모노 리드(fg-3) |\n| `k-statement` | h1 107 / 800, `em` 은 액센트. `.body-list` 는 헤어라인 패널 3단, 마지막 항목 tint-2 + 액센트 좌측 3px |\n| `k-steps` | 4열 surface 패널, 좌측 3px 헤어라인, 패널 사이 `→`, 마지막 아래 `⟲` (원본 .loop) |\n| `k-ladder` | 세로 4단 `140px 380px 1fr` 그리드 패널, `.hi` 는 tint-2 + 액센트 좌측선 (원본 .ladder) |\n| `k-grid` / `k-cards` | `.cell` = surface 패널. nine 은 dense 티어. constellation·links 제목은 모노(코드 식별자) |\n| `k-stats` | 액센트 2px 상단 괘선, 숫자 h1 107 액센트 tabular-nums, 단위 h3, 라벨 body fg-2 (원본 .counter) |\n| `k-table` | 헤어라인 행, thead 모노 대문자 fg-3 + rule 하단선, `.hi` 열 tint-2 + 액센트 좌측 3px + fg 600 |\n| `k-quote` | 액센트 좌측 3px, p 는 h1 107 / 800, cite 모노 fg-3 |\n| `k-diagram` | svg 를 surface 패널에 담음. rect surface-2 + rule 1.4, 가운데 층 tint-2 + acc 1.6, 화살표 acc 2px, 루프 rule 점선 |\n| `k-compare` | 2열 패널, 우측(`.b`) tint-2 + 액센트, 불릿은 8px 사각(rule/acc) |\n| `k-terminal` | tint-2(라이트)/tint-1(다크) + rule 1px, 모노 23/1.75, prompt·ok 액센트, dim fg-3 |\n| `k-timeline` | 5열 패널, 상단 2px. 30·60·90 틱만 액센트 상단선, 90일은 tint-2 (발표자 노트 \"본체\" 반영) |\n| `k-bars` | 대시보드: 행 패널 `1fr 640px 96px`, 트랙 12px surface-2, 채움 rule(비강조)/acc(`.hi`), 값 모노 lead. 스텝 공개 시 width 0→값 340ms |\n| `k-toggle` | 세그먼트 컨트롤: rule 1.5px 외곽, 버튼 min 44×44, 선택 = acc 채움 + ✓. `.tg` 상단 2px, harness 뷰에서 액센트 |\n| `k-outro` | h1 헤드라인, links 제목 모노 34 액센트 밑줄, 리드 600 fg |\n\n## 6. 모션 · 순차 공개 규칙\n- `[data-step]`: 340ms power1.out, 12px 상승. SVG 내부는 변위 0.\n- 스텝이 없는 묶음(`.cell`·`.stat`·`.tbl tbody tr`·`.compare .col`)은 슬라이드 진입 시 30ms stagger 로 함께 뜬다(Stagger List Subtle).\n- 슬라이드 진입 260ms power1.inOut 페이드+12px, exit 0ms(비대칭).\n- `.bar-track i` 는 `.in` 전 width 0.\n- `prefers-reduced-motion`: 코어가 스텝을 즉시 공개, 테마는 슬라이드 진입·stagger 애니메이션을 끈다.\n\n## 7. 크롬 · 진행 표시\n- 슬라이드 안(theme.js 주입, 원본 .kicker/.status/.rail/.progress): 우상단 `섹션코드 / 섹션명`(fg-3 모노), 좌하단 `NN / 24 · 제목`(fg-2 모노), 우측 24×24 히트영역 도트 레일(8×8 헤어라인, 섹션 시작 rule, 활성 acc 8×18), 하단 2px 액센트 진행바.\n- 코어 패널 재스킨: `--dk-panel-bg:surface --dk-panel-fg:fg-2 --dk-panel-line:hairline --dk-font:mono --dk-accent:acc`, 버튼 radius 0, 호버 acc.\n\n## 8. 금지 목록\n- radius > 0, box-shadow, 그라디언트 배경.\n- 액센트 2색 동시 사용, 비강조 요소에 액센트 채움.\n- 데이터셋 7값 밖의 간격(예: 20px·40px).\n- Inter/Roboto/Arial/Fraunces. 웹폰트·CDN·이미지.\n- 이모지 prefix(🏛📖📚🏷)를 슬라이드 본문에.\n- 코어 패널 구조 변경·숨김, 자체 키 리스너.\n\n## 9. 복사해서 쓰는 법\n1. `themes/datadriven/theme.css` + `theme.js` 를 새 덱 폴더에 복사하고 `theme.json` 의 `name`만 바꾼다.\n2. 콘텐츠는 CONTRACT §3 마크업 계약을 지킨다 — `section.slide.k-*` + `.kicker .headline .lead .foot`, 컴포넌트는 `.cell/.step/.stat/.tick/.tg/.bar` 와 `data-step`.\n3. `python3 build.py --themes {slug}` → `tools/verify.py` 로 overflow/overlap 0 확인. 정보 4층 이상인 새 kind 는 dense 셀렉터 목록에 추가한다.\n\n## 10. 계보 · 출처\n- 원본: `../v3-uiux-datadriven/index.html` + `NOTES.md` (2026-09-02 2차 수리본). 데이터 출처 표는 원본 NOTES \"데이터 근거\" 절이 정본.\n- 데이터셋: `ui-ux-pro-max` — styles.csv(minimalism-and-swiss-style · exaggerated-minimalism · editorial-grid-magazine), ux-guidelines.csv, motion.csv, colors.csv, design_system.py DIAL_TIERS.\n- 상위 규약: DESIGN.md §1 CI 토큰 · §2 Anti-Slop. 계약: `final/CONTRACT.md`.\n"}</script>
