mily="P400" font-size="21" fill="#16334A">these associations as population causal effects.</text><text x="613.7007874015749" y="1139.9111606299216" font-family="P700" font-size="23.520000000000003" fill="#087F7B">04 / Reproduction record</text><text x="613.7007874015749" y="1179.5927606299217" font-family="P400" font-size="21" fill="#16334A">Estimates and intervals are copied unchanged from</text><text x="613.7007874015749" y="1209.4127606299216" font-family="P400" font-size="21" fill="#16334A">the public-data 0.7 analysis cache. This typesetting</text><text x="613.7007874015749" y="1239.2327606299218" font-family="P400" font-size="21" fill="#16334A">exercise is not a new statistical recomputation and</text><text x="613.7007874015749" y="1269.0527606299217" font-family="P400" font-size="21" fill="#16334A">does not extend the earlier numeric validation.</text><line x1="79.37007874015748" y1="1534.7480314960633" x2="1122.51968503937" y2="1534.7480314960633" stroke="#16334A" stroke-width=".8"/><text x="79.37007874015748" y="1562.468031496063" font-family="P400" font-size="18" fill="#526573">Data: statsmodels ANES96 · https://www.statsmodels.org/stable/datasets/generated/anes96.html</text><text x="79.37007874015748" y="1589.468031496063" font-family="P400" font-size="18" fill="#526573">Pele 1.6.0 · https://pele.run/ · data and rendering contributions are distinguished.</text></svg>