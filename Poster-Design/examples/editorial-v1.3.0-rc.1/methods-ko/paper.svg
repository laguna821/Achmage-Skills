</svg><text x="79.37007874015748" y="509.1829411506951" font-family="P400" font-size="18" fill="#526573">Pele 1.6.0 기본 배치. 화살표는 분석 절차이며 인과관계를 뜻하지 않는다.</text><line x1="79.37007874015748" y1="533.872941150695" x2="1122.51968503937" y2="533.872941150695" stroke="#BFCED3" stroke-width=".8"/><text x="79.37007874015748" y="567.2797411506951" font-family="P700" font-size="23.520000000000003" fill="#087F7B">01 / 표본과 측정</text><text x="79.37007874015748" y="606.9613411506951" font-family="P400" font-size="21" fill="#16334A">944명. 비가중 탐색 분석이며 미국 전체 유권자의 모집단</text><text x="79.37007874015748" y="636.7813411506952" font-family="P400" font-size="21" fill="#16334A">추정으로 해석하지 않는다. TV 뉴스는 주당 횟수이며 연령</text><text x="79.37007874015748" y="666.6013411506951" font-family="P400" font-size="21" fill="#16334A">효과는 10년 단위다.</text><text x="613.7007874015749" y="567.2797411506951" font-family="P700" font-size="23.520000000000003" fill="#087F7B">02 / 분석 계약</text><line x1="613.7007874015749" y1="589.3213411506952" x2="1122.5196850393702" y2="589.3213411506952" stroke="#BFCED3" stroke-width=".8"/><text x="623.7007874015749" y="614.4413411506952" font-family="P700" font-size="18" fill="#16334A">항목</text><text x="793.3070866141733" y="614.4413411506952" font-family="P700" font-size="18" fill="#16334A">고정 조건</text><line x1="613.7007874015749" y1="634.5213411506952" x2="1122.5196850393702" y2="634.5213411506952" stroke="#BFCED3" stroke-width=".8"/><text x="623.7007874015749" y="659.6413411506952" font-family="P400" font-size="18" fill="#16334A">추정</text><text x="793.3070866141733" y="659.6413411506952" font-family="P400" font-size="18" fill="#16334A">조건부 평균 연관성</text><line x1="613.7007874015749" y1="679.7213411506953" x2="1122.5196850393702" y2="679.7213411506953" stroke="#BFCED3" stroke-width=".8"/><text x="623.7007874015749" y="704.8413411506953" font-family="P400" font-size="18" fill="#16334A">불확실성</text><text x="793.3070866141733" y="704.8413411506953" font-family="P400" font-size="18" fill="#16334A">계수별 95% 신뢰구간</text><line x1="613.7007874015749" y1="724.9213411506953" x2="1122.5196850393702" y2="724.9213411506953" stroke="#BFCED3" stroke-width=".8"/><text x="623.7007874015749" y="750.0413411506953" font-family="P400" font-size="18" fill="#16334A">검증</text><text x="793.3070866141733" y="750.0413411506953" font-family="P400" font-size="18" fill="#16334A">원자료·산식·ID 대응</text><line x1="613.7007874015749" y1="770.1213411506953" x2="1122.5196850393702" y2="770.1213411506953" stroke="#BFCED3" stroke-width=".8"/><line x1="79.37007874015748" y1="803.4213411506953" x2="1122.51968503937" y2="803.4213411506953" stroke="#BFCED3" stroke-width=".8"/><text x="79.37007874015748" y="836.8281411506954" font-family="P700" font-size="23.520000000000003" fill="#087F7B">03 / 결론의 경계</text><text x="79.37007874015748" y="876.5097411506954" font-family="P400" font-size="21" fill="#16334A">정당 집단은 무작위 배정되지 않았다. 회귀계수와 경로</text><text x="79.37007874015748" y="906.3297411506954" font-family="P400" font-size="21" fill="#16334A">방향만으로 인과효과를 주장할 수 없다. 자료 선택·측정·누락</text><text x="79.37007874015748" y="936.1497411506954" font-family="P400" font-size="21" fill="#16334A">요인의 민감도를 별도로 확인해야 한다.</text><text x="613.7007874015749" y="836.8281411506954" font-family="P700" font-size="23.520000000000003" fill="#087F7B">04 / 다음 원고로 옮길 때</text><text x="613.7007874015749" y="876.5097411506954" font-family="P400" font-size="21" fill="#16334A">표본 수만 바꾸지 않는다. 원자료 버전·단위·분모·추정</text><text x="613.7007874015749" y="906.3297411506954" font-family="P400" font-size="21" fill="#16334A">대상·모형·불확실성 계산을 함께 갱신하고 그림의 각 ID를</text><text x="613.7007874015749" y="936.1497411506954" font-family="P400" font-size="21" fill="#16334A">원자료와 대조한다.</text><line x1="79.37007874015748" y1="1534.7480314960633" x2="1122.51968503937" y2="1534.7480314960633" stroke="#16334A" stroke-width=".8"/><text x="79.37007874015748" y="1562.468031496063" font-family="P400" font-size="18" fill="#526573">Data: statsmodels ANES96 · https://www.statsmodels.org/stable/datasets/generated/anes96.html</text><text x="79.37007874015748" y="1589.468031496063" font-family="P400" font-size="18" fill="#526573">Pele 1.6.0 · https://pele.run/ · data and rendering contributions are distinguished.</text></svg>