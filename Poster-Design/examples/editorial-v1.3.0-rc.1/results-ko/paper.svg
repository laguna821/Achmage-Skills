</svg><text x="79.37007874015748" y="707.7859606299213" font-family="P400" font-size="18" fill="#526573">별도 SVG 통계 도표. Pele가 회귀를 계산하거나 이 신뢰구간을 생성한 것은 아니다.</text><line x1="79.37007874015748" y1="732.4759606299212" x2="1122.51968503937" y2="732.4759606299212" stroke="#BFCED3" stroke-width=".8"/><text x="79.37007874015748" y="765.8827606299213" font-family="P700" font-size="23.520000000000003" fill="#087F7B">01 / 읽는 순서</text><text x="79.37007874015748" y="805.5643606299213" font-family="P400" font-size="21" fill="#16334A">점은 계수, 선은 95% 신뢰구간이다. 0 기준선을 먼저</text><text x="79.37007874015748" y="835.3843606299214" font-family="P400" font-size="21" fill="#16334A">확인하고 단위와 비교 기준을 읽는다. 구간이 0을 포함한다는</text><text x="79.37007874015748" y="865.2043606299213" font-family="P400" font-size="21" fill="#16334A">사실을 효과가 없다는 확정으로 바꾸지 않는다.</text><text x="613.7007874015749" y="765.8827606299213" font-family="P700" font-size="23.520000000000003" fill="#087F7B">02 / 비교 기준</text><line x1="613.7007874015749" y1="787.9243606299214" x2="1122.5196850393702" y2="787.9243606299214" stroke="#BFCED3" stroke-width=".8"/><text x="623.7007874015749" y="813.0443606299214" font-family="P700" font-size="18" fill="#16334A">변수</text><text x="793.3070866141733" y="813.0443606299214" font-family="P700" font-size="18" fill="#16334A">단위·기준</text><line x1="613.7007874015749" y1="833.1243606299214" x2="1122.5196850393702" y2="833.1243606299214" stroke="#BFCED3" stroke-width=".8"/><text x="623.7007874015749" y="858.2443606299214" font-family="P400" font-size="18" fill="#16334A">Age</text><text x="793.3070866141733" y="858.2443606299214" font-family="P400" font-size="18" fill="#16334A">10 years</text><line x1="613.7007874015749" y1="878.3243606299214" x2="1122.5196850393702" y2="878.3243606299214" stroke="#BFCED3" stroke-width=".8"/><text x="623.7007874015749" y="903.4443606299214" font-family="P400" font-size="18" fill="#16334A">Education</text><text x="793.3070866141733" y="903.4443606299214" font-family="P400" font