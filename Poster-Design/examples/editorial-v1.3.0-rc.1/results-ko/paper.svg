><text x="613.7007874015749" y="1179.9527606299218" font-family="P400" font-size="21" fill="#16334A">검사의 범위를 확대하지 않는다.</text><line x1="79.37007874015748" y1="1534.7480314960633" x2="1122.51968503937" y2="1534.7480314960633" stroke="#16334A" stroke-width=".8"/><text x="79.37007874015748" y="1562.468031496063" font-family="P400" font-size="18" fill="#526573">Data: statsmodels ANES96 · https://www.statsmodels.org/stable/datasets/generated/anes96.html</text><text x="79.37007874015748" y="1589.468031496063" font-family="P400" font-size="18" fill="#526573">Pele 1.6.0 · https://pele.run/ · data and rendering contributions are distinguished.</text></svg>