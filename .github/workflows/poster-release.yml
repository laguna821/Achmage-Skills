name: Validate poster release
on:
  pull_request:
    paths: ['Poster-Design/**', '.github/workflows/poster-release.yml', '.claude-plugin/marketplace.json']
  push:
    branches: [main]
    paths: ['Poster-Design/**', '.github/workflows/poster-release.yml', '.claude-plugin/marketplace.json']
permissions:
  contents: read
jobs:
  poster:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Poster-Design/hallym-poster-system/requirements.txt
      - run: python -m pip install -r Poster-Design/hallym-poster-system/requirements.txt
      - run: python -X utf8 -B Poster-Design/tools/release.py --check
      - run: python -X utf8 -B scripts/poster.py doctor
        working-directory: Poster-Design/hallym-poster-system
      - run: python -X utf8 -B -m unittest discover -s tests -v
        working-directory: Poster-Design/hallym-poster-system

